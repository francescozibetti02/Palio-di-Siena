  if(!cavallo) return;
  if(!S.cavalliPosseduti) S.cavalliPosseduti = [];
  if(!S.cavalliPosseduti.includes(nomeCavallo) && S.cavalliPosseduti.length >= MAX_CAVALLI_STALLA){
    mostraPopupErrore('Stalla piena', `Puoi avere al massimo ${MAX_CAVALLI_STALLA} cavalli in stalla contemporaneamente. Vendi un cavallo prima di acquistarne uno nuovo.`);
    return;
  }
  const finaliVinte = (S.scoreCavalliFantino[nomeCavallo] || {}).finaliVinte || 0;
  const consigliato = prezzoConsigliatoCavallo(cavallo, finaliVinte);

  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">💰</div>
    <div class="popup-title">Trattativa per ${nomeCavallo}</div>
    <div class="popup-body">
      Quanto oro sei disposto a offrire per questo cavallo?<br><br>
      Prezzo consigliato dai mediatori: <strong style="color:var(--ocra)">${consigliato} oro</strong><br>
      Il proprietario potrebbe accettare anche un'offerta più bassa — o pretenderne una più alta.<br><br>
      <input id="INP_OFFERTA_CAVALLO" class="inp" type="number" min="0" step="50" placeholder="es. ${consigliato}"
        style="margin-top:6px" autocomplete="off">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove()">Annulla</button>
      <button class="btn gold w" style="flex:1;margin-top:0" onclick="confermaOffertaCavallo('${escJs(nomeCavallo)}',this)">Offri</button>
    </div>
  </div>`;
  R('APP').appendChild(ov);
  setTimeout(()=>{ const el=R('INP_OFFERTA_CAVALLO'); if(el) el.focus(); },150);
}

function confermaOffertaCavallo(nomeCavallo, btnEl){
  if(!S) return;
  const inputEl = R('INP_OFFERTA_CAVALLO');
  const offerta = Math.max(0, Math.round(Number(inputEl?.value || 0)));
  if(!offerta){
    mostraPopupErrore('Offerta non valida', 'Inserisci una cifra in oro da offrire per il cavallo.');
    return;
  }
  if(offerta > S.oro){
    mostraPopupErrore('Oro insufficiente', `Non possiedi ${offerta} oro. Al momento ne hai ${S.oro}.`);
    return;
  }
  const cavallo = CAVALLI_DB.find(c=>c.nome===nomeCavallo);
  if(!cavallo) return;
  if(!S.cavalliPosseduti) S.cavalliPosseduti = [];
  if(!S.cavalliPosseduti.includes(nomeCavallo) && S.cavalliPosseduti.length >= MAX_CAVALLI_STALLA){
    btnEl.closest('.overlay').remove();
    mostraPopupErrore('Stalla piena', `Puoi avere al massimo ${MAX_CAVALLI_STALLA} cavalli in stalla contemporaneamente. Vendi un cavallo prima di acquistarne uno nuovo.`);
    return;
  }
  const finaliVinte = (S.scoreCavalliFantino[nomeCavallo] || {}).finaliVinte || 0;
  // Prezzo minimo: stessa formula del consigliato ma con fattore random 0.8–1.2 invece di 1.3
  const fattoreRandom = 0.8 + Math.random()*0.4;
  const prezzoMinimo = Math.round(valoreBaseCavallo(cavallo, finaliVinte) * fattoreRandom);

  btnEl.closest('.overlay').remove();

  if(offerta >= prezzoMinimo){
    if(!S.cavalliPosseduti) S.cavalliPosseduti = [];
    S.cavalliPosseduti.push(nomeCavallo);
    statoVivoCavallo(nomeCavallo);
    S.oro -= offerta;
    S.log.push(`Acquistato il cavallo ${nomeCavallo} per ${offerta} oro.`);
    verificaObiettivi();
    salvaCorrente();
    const ov = document.createElement('div');
    ov.className='overlay';
    ov.innerHTML=`
    <div class="popup">
      <div class="popup-icon">🐎</div>
      <div class="popup-title">Affare fatto!</div>
      <div class="popup-body">Il proprietario ha accettato la tua offerta: <strong style="color:var(--ocra)">${nomeCavallo}</strong> è ora tuo.<br><br>Spesa: <strong style="color:var(--ross)">-${offerta} oro</strong></div>
      <button class="btn gold w" onclick="this.closest('.overlay').remove();renderCavalliFantino()">Capito</button>
    </div>`;
    R('APP').appendChild(ov);
  } else {
    const ov = document.createElement('div');
    ov.className='overlay';
    ov.innerHTML=`
    <div class="popup">
      <div class="popup-icon">🙅</div>
      <div class="popup-title">Offerta rifiutata</div>
      <div class="popup-body">Il proprietario di <strong style="color:var(--ocra)">${nomeCavallo}</strong> ha rifiutato la tua offerta di <strong style="color:var(--ross)">${offerta} oro</strong>: la ritiene troppo bassa. Puoi riprovare con una cifra più alta.</div>
      <button class="btn gold w" onclick="this.closest('.overlay').remove();renderCavalliFantino()">Capito</button>
    </div>`;
    R('APP').appendChild(ov);
  }
}

/* ═══════════════════════════════════════════════
   STALLA — carriera Fantino: gestione dei cavalli posseduti
   (statistiche, stanchezza, risultati in provincia, palii vinti,
   allenamento con minigioco Tris, offerta di vendita)
═══════════════════════════════════════════════ */
function dotsStanchezza(val){
  let d='';
  for(let i=1;i<=STANCHEZZA_MAX_CAVALLO;i++){
    const attivo = i<=val;
    const colore = !attivo ? 'rgba(200,153,30,.12)' : (val>=STANCHEZZA_MAX_CAVALLO ? 'var(--ross)' : 'var(--ocra)');
    d += `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colore};border:1px solid ${attivo?colore:'rgba(200,153,30,.18)'};margin-right:3px"></span>`;
  }
  return d;
}

function calcolaOffertaVenditaCavallo(nome){
  const st = statoVivoCavallo(nome);
  if(!st) return 0;
  const media = (st.velocita + st.accelerazione + st.tenuta_curva + st.resistenza) / 4;
  const finaliVinte = (S.scoreCavalliFantino && S.scoreCavalliFantino[nome] && S.scoreCavalliFantino[nome].finaliVinte) || 0;
  const palioVinti = (S.palioVintiCavalli && S.palioVintiCavalli[nome]) || 0;
  const base = (media + finaliVinte + palioVinti) * 1000 - st.nervosismo * 100;
  const fattore = 0.8 + Math.random() * 0.4;
  return Math.max(0, Math.round(base * fattore));
}

function renderStalla(){
  if(!S) return;
  if(!S.cavalliPosseduti) S.cavalliPosseduti = [];
  if(!S.scoreCavalliFantino) S.scoreCavalliFantino = {};
  if(!S.palioVintiCavalli) S.palioVintiCavalli = {};
  if(!S.statiCavalli) S.statiCavalli = {};
  if(!S.allenamentoMeseCavalli) S.allenamentoMeseCavalli = {};

  if(!S.cavalliPosseduti.length){
    setMain(`
    <div>
      <div class="hdr">
        <button class="hdr-back" onclick="renderGiocoFantino()">‹</button>
        <span class="hdr-title">Stalla</span>
        <span class="hdr-right" style="font-size:10px">💰 ${S.oro}</span>
      </div>
      <div class="pad fade-in">
        <div class="screen-title" style="margin-top:8px">🐎 La Stalla</div>
        <div class="card" style="text-align:center;padding:24px">
          <div style="font-size:36px;margin-bottom:12px">🐴</div>
          <div style="font-family:var(--fn);font-size:13px;color:rgba(200,153,30,.45);line-height:1.7">
            Non possiedi ancora nessun cavallo.<br>Puoi acquistarne uno dalla schermata Cavalli, nelle Corse in Provincia.
          </div>
        </div>
        <button class="btn w" onclick="renderGiocoFantino()">← Torna indietro</button>
      </div>
    </div>
    `);
    return;
  }

  window._offerteVenditaStalla = window._offerteVenditaStalla || {};

  const box = S.cavalliPosseduti.map(nome=>{
    const st = statoVivoCavallo(nome);
    const score = S.scoreCavalliFantino[nome] || {corse:0, batterieVinte:0, finaliVinte:0};
    const palioVinti = S.palioVintiCavalli[nome] || 0;
    const stanco = st.stanchezza >= STANCHEZZA_MAX_CAVALLO;
    const giaAllenato = !!S.allenamentoMeseCavalli[nome];
    if(window._offerteVenditaStalla[nome] === undefined){
      window._offerteVenditaStalla[nome] = calcolaOffertaVenditaCavallo(nome);
    }
    const offerta = window._offerteVenditaStalla[nome];

    const righeStat = [
      ['⚡','Velocità', st.velocita],
      ['💨','Accelerazione', st.accelerazione],
      ['🌀','Tenuta Curva', st.tenuta_curva],
      ['🫁','Resistenza', st.resistenza],
      ['😰','Nervosismo', st.nervosismo]
    ].map(([em,lb,v])=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:13px;width:18px">${em}</span>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5);width:96px">${lb}</div>
        <div>${pallinistat(v)}</div>
      </div>`).join('');

    const bottoniAllenamento = Object.entries(TIPI_ALLENAMENTO_CAVALLO).map(([key,t])=>`
      <button class="btn w" style="margin-top:6px" ${(stanco||giaAllenato)?'disabled':''}
        onclick="avviaAllenamentoCavallo('${escJs(nome)}','${key}')">
        ${t.icona} ${t.label} <span style="opacity:.6;font-size:10px">(${t.desc})</span>
      </button>`).join('');

    return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-title">🐎 ${nome}</div>

      ${righeStat}

      <div style="display:flex;align-items:center;gap:8px;margin:8px 0 4px">
        <span style="font-size:13px;width:18px">🥱</span>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5);width:96px">Stanchezza</div>
        <div>${dotsStanchezza(st.stanchezza)}</div>
      </div>
      ${stanco ? '<div style="font-family:var(--fn);font-size:10px;color:var(--ross);margin-bottom:6px">Troppo stanco: non può allenarsi né gareggiare finché non riposa.</div>' : ''}

      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.45);margin-top:8px">
        Corse in provincia quest'anno: ${score.corse} · Batterie vinte: ${score.batterieVinte} · Finali vinte: ${score.finaliVinte}
      </div>
      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.45)">
        Palii vinti in carriera: ${palioVinti}
      </div>

      <div style="font-family:var(--fn);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,153,30,.4);margin-top:12px">Allenamento · ${COSTO_ALLENAMENTO_CAVALLO} oro</div>
      ${giaAllenato ? '<div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.4);margin-top:4px">Allenamento già effettuato questo mese.</div>' : ''}
      ${bottoniAllenamento}

      <div style="font-family:var(--fn);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(200,153,30,.4);margin-top:14px">Offerta di vendita</div>
      <div style="font-family:var(--fn);font-size:13px;color:var(--ocra);font-weight:700;margin:4px 0 8px">💰 ${offerta} oro</div>
      <button class="btn w" onclick="apriVenditaCavallo('${escJs(nome)}')">Vendi questo cavallo</button>
    </div>`;
  }).join('');

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderGiocoFantino()">‹</button>
      <span class="hdr-title">Stalla</span>
      <span class="hdr-right" style="font-size:10px">💰 ${S.oro}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🐎 La Stalla</div>
      <div class="screen-sub">I cavalli che possiedi: statistiche, stanchezza e risultati</div>
      ${box}
    </div>
  </div>
  `);
}

function apriVenditaCavallo(nome){
  if(!S) return;
  const offerta = (window._offerteVenditaStalla && window._offerteVenditaStalla[nome]) || calcolaOffertaVenditaCavallo(nome);
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">💰</div>
    <div class="popup-title">Vendere ${nome}?</div>
    <div class="popup-body">
      Il mercato offre <strong style="color:var(--ocra)">${offerta} oro</strong> per questo cavallo.<br><br>
      Se accetti, il cavallo lascerà la tua stalla e le sue statistiche torneranno a quelle di base.
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove()">Annulla</button>
      <button class="btn gold w" style="flex:1;margin-top:0" onclick="confermaVenditaCavallo('${escJs(nome)}',this)">Vendi</button>
    </div>
  </div>`;
  R('APP').appendChild(ov);
}

function confermaVenditaCavallo(nome, btnEl){
  if(!S) return;
  const offerta = (window._offerteVenditaStalla && window._offerteVenditaStalla[nome]) || calcolaOffertaVenditaCavallo(nome);
  S.cavalliPosseduti = S.cavalliPosseduti.filter(n=>n!==nome);
  if(S.statiCavalli) delete S.statiCavalli[nome];
  if(S.scoreCavalliFantino) delete S.scoreCavalliFantino[nome];
  if(window._offerteVenditaStalla) delete window._offerteVenditaStalla[nome];
  S.oro += offerta;
  S.log.push(`Venduto il cavallo ${nome} per ${offerta} oro.`);
  salvaCorrente();
  btnEl.closest('.overlay').remove();
  renderStalla();
}

/* ── Allenamento: minigioco Tris (3×3) contro il computer.
   Vittoria → allenamento riuscito (statistiche modificate). Sconfitta → allenamento fallito
   (oro speso comunque). Pareggio → si rigioca. In ogni caso stanchezza +1 e -200 oro a fine
   partita (vittoria o sconfitta). ── */
function avviaAllenamentoCavallo(nome, tipo){
  if(!S) return;
  const st = statoVivoCavallo(nome);
  if(!st) return;
  if(st.stanchezza >= STANCHEZZA_MAX_CAVALLO){
    mostraPopupErrore('Cavallo stanco', `${nome} è troppo stanco per allenarsi questo mese.`);
    return;
  }
  if(S.allenamentoMeseCavalli && S.allenamentoMeseCavalli[nome]){
    mostraPopupErrore('Allenamento già fatto', `${nome} si è già allenato questo mese.`);
    return;
  }
  if(S.oro < COSTO_ALLENAMENTO_CAVALLO){
    mostraPopupErrore('Oro insufficiente', `L'allenamento costa ${COSTO_ALLENAMENTO_CAVALLO} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  window._trisState = { nome, tipo, griglia: Array(9).fill(null), turno:'P', finita:false, vincitore:null };
  renderTrisAllenamento();
}

function renderTrisAllenamento(){
  if(!S || !window._trisState) return;
  const st = window._trisState;
  const tipoInfo = TIPI_ALLENAMENTO_CAVALLO[st.tipo];

  const celleHtml = st.griglia.map((cella,idx)=>{
    const simbolo = cella==='P' ? '🐎' : cella==='C' ? '✖️' : '';
    const disabilitato = !!cella || st.finita || st.turno!=='P';
    return `<button onclick="giocaCellaTris(${idx})" ${disabilitato?'disabled':''}
      style="aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(200,153,30,.22);
      font-size:18px;display:flex;align-items:center;justify-content:center;cursor:${disabilitato?'default':'pointer'}">${simbolo}</button>`;
  }).join('');

  let messaggio;
  if(st.finita){
    messaggio = st.vincitore==='P' ? '🐎 Hai vinto!' : st.vincitore==='C' ? '✖️ Hai perso.' : 'Pareggio: si rigioca.';
  } else {
    messaggio = st.turno==='P' ? 'Tocca a te: scegli una casella.' : "Il barbaresco rivale sta pensando...";
  }

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="annullaTrisAllenamento()">‹</button>
      <span class="hdr-title">Allenamento · ${st.nome}</span>
      <span class="hdr-right" style="font-size:10px">💰 ${S.oro}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">${tipoInfo.icona} ${tipoInfo.label}</div>
      <div class="screen-sub">${messaggio}</div>
      <div class="card" style="padding:12px">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:200px;margin:0 auto">${celleHtml}</div>
      </div>
      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.4);text-align:center;margin-top:8px">
        Vinci il Tris contro il barbaresco per garantire l'allenamento: ${tipoInfo.desc}. Costo: ${COSTO_ALLENAMENTO_CAVALLO} oro.
      </div>
    </div>
  </div>
  `);
}

function giocaCellaTris(idx){
  if(!S || !window._trisState) return;
  const st = window._trisState;
  if(st.finita || st.turno!=='P' || st.griglia[idx]) return;

  st.griglia[idx] = 'P';
  if(verificaVittoriaTris(st.griglia, 'P')){
    st.finita = true; st.vincitore = 'P';
    renderTrisAllenamento();
    setTimeout(()=>concludiAllenamentoCavallo(), 900);
    return;
  }
  if(st.griglia.every(c=>c)){
    st.finita = true; st.vincitore = 'pareggio';
    renderTrisAllenamento();
    setTimeout(()=>ripetiTrisAllenamento(), 900);
    return;
  }
  st.turno = 'C';
  renderTrisAllenamento();
  setTimeout(()=>mossaComputerTris(), 500);
}

function mossaComputerTris(){
  if(!S || !window._trisState) return;
  const st = window._trisState;
  if(st.finita) return;

  const idx = scegliCellaIATris(st.griglia);
  st.griglia[idx] = 'C';
  if(verificaVittoriaTris(st.griglia, 'C')){
    st.finita = true; st.vincitore = 'C';
    renderTrisAllenamento();
    setTimeout(()=>concludiAllenamentoCavallo(), 900);
    return;
  }
  if(st.griglia.every(c=>c)){
    st.finita = true; st.vincitore = 'pareggio';
    renderTrisAllenamento();
    setTimeout(()=>ripetiTrisAllenamento(), 900);
    return;
  }
  st.turno = 'P';
  renderTrisAllenamento();
}

/* IA a difficoltà bilanciata (versione ammorbidita): il barbaresco coglie sempre una
   vittoria immediata, ma blocca una vittoria immediata del giocatore solo con alta
   probabilità (PROB_BLOCCO_TRIS) invece che sempre, lasciando quindi occasionalmente
   una "disattenzione" sfruttabile. Sulle mosse puramente strategiche (nessuna vittoria
   o blocco urgente) l'IA gioca in modo ottimale col minimax solo con probabilità
   (1 - PROB_MOSSA_CASUALE_TRIS): l'altra parte delle volte sceglie una mossa casuale
   tra quelle libere. Il minigioco resta impegnativo ma decisamente più abbordabile. */
const PROB_MOSSA_CASUALE_TRIS = 0.7;
const PROB_BLOCCO_TRIS = 0.75;

function scegliCellaIATris(griglia){
  const libere = griglia.map((c,i)=>c?null:i).filter(i=>i!==null);
  // Prima mossa dell'IA su griglia vuota (raro, dato che il giocatore parte sempre):
  // scelta rapida del centro per evitare un calcolo inutile.
  if(libere.length === 9) return 4;

  // 1) Vittoria immediata: se il barbaresco può vincere subito, lo fa sempre.
  for(const i of libere){
    const g = griglia.slice();
    g[i] = 'C';
    if(verificaVittoriaTris(g, 'C')) return i;
  }

  // 2) Blocco immediato: se il giocatore potrebbe vincere alla prossima mossa, lo blocca
  //    quasi sempre, ma non sempre (PROB_BLOCCO_TRIS), per non essere invincibile.
  if(Math.random() < PROB_BLOCCO_TRIS){
    for(const i of libere){
      const g = griglia.slice();
      g[i] = 'P';
      if(verificaVittoriaTris(g, 'P')) return i;
    }
  }

  // 3) Nessuna urgenza tattica (o blocco "mancato"): mossa strategica, ottimale solo a volte.
  if(Math.random() < PROB_MOSSA_CASUALE_TRIS){
    return libere[Math.floor(Math.random()*libere.length)];
  }
  let bestScore = -Infinity;
  let bestMosse = [];
  for(const i of libere){
    const g = griglia.slice();
    g[i] = 'C';
    const score = minimaxTris(g, 0, false);
    if(score > bestScore){ bestScore = score; bestMosse = [i]; }
    else if(score === bestScore) bestMosse.push(i);
  }
  return bestMosse[Math.floor(Math.random()*bestMosse.length)];
}

function minimaxTris(griglia, depth, isMaximizing){
  if(verificaVittoriaTris(griglia,'C')) return 10 - depth;
  if(verificaVittoriaTris(griglia,'P')) return depth - 10;
  const libere = griglia.map((c,i)=>c?null:i).filter(i=>i!==null);
  if(!libere.length) return 0;

  if(isMaximizing){
    let best = -Infinity;
    for(const i of libere){
      const g = griglia.slice(); g[i]='C';
      best = Math.max(best, minimaxTris(g, depth+1, false));
    }
    return best;
  } else {
    let best = Infinity;
    for(const i of libere){
      const g = griglia.slice(); g[i]='P';
      best = Math.min(best, minimaxTris(g, depth+1, true));
    }
    return best;
  }
}

function verificaVittoriaTris(griglia, simbolo){
  const linee = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return linee.some(([a,b,c])=>griglia[a]===simbolo && griglia[b]===simbolo && griglia[c]===simbolo);
}

function ripetiTrisAllenamento(){
  if(!S || !window._trisState) return;
  const st = window._trisState;
  st.griglia = Array(9).fill(null);
  st.turno = 'P';
  st.finita = false;
  st.vincitore = null;
  renderTrisAllenamento();
}

function annullaTrisAllenamento(){
  window._trisState = null;
  renderStalla();
}

function concludiAllenamentoCavallo(){
  if(!S || !window._trisState) return;
  const st = window._trisState;
  const nome = st.nome, tipo = st.tipo, vinto = st.vincitore==='P';
  window._trisState = null;

  if(S.oro < COSTO_ALLENAMENTO_CAVALLO){
    mostraPopupErrore('Oro insufficiente', `L'allenamento costa ${COSTO_ALLENAMENTO_CAVALLO} oro. Al momento ne possiedi ${S.oro}.`);
    renderStalla();
    return;
  }

  const cavSt = statoVivoCavallo(nome);
  S.oro -= COSTO_ALLENAMENTO_CAVALLO;
  cavSt.stanchezza = Math.min(STANCHEZZA_MAX_CAVALLO, cavSt.stanchezza + 1);
  if(!S.allenamentoMeseCavalli) S.allenamentoMeseCavalli = {};
  S.allenamentoMeseCavalli[nome] = true;

  let corpoPopup, icona, titolo;
  if(vinto){
    TIPI_ALLENAMENTO_CAVALLO[tipo].applica(cavSt);
    S.log.push(`Allenamento (${TIPI_ALLENAMENTO_CAVALLO[tipo].label}) riuscito per ${nome}: -${COSTO_ALLENAMENTO_CAVALLO} oro, statistiche migliorate, stanchezza +1.`);
    icona='🎉'; titolo='Allenamento riuscito!';
    corpoPopup = `Il Tris è stato vinto: <strong style="color:var(--ocra)">${nome}</strong> ha completato l'allenamento di ${TIPI_ALLENAMENTO_CAVALLO[tipo].label}.<br><br>${TIPI_ALLENAMENTO_CAVALLO[tipo].desc}<br>Stanchezza +1 · Spesa: -${COSTO_ALLENAMENTO_CAVALLO} oro`;
  } else {
    S.log.push(`Allenamento (${TIPI_ALLENAMENTO_CAVALLO[tipo].label}) fallito per ${nome}: -${COSTO_ALLENAMENTO_CAVALLO} oro, nessun miglioramento, stanchezza +1.`);
    icona='😬'; titolo='Allenamento fallito';
    corpoPopup = `Il Tris è andato male: <strong style="color:var(--ocra)">${nome}</strong> si è comunque affaticato ma non ha migliorato le sue statistiche.<br><br>Stanchezza +1 · Spesa: -${COSTO_ALLENAMENTO_CAVALLO} oro`;
  }

  if(window._offerteVenditaStalla) delete window._offerteVenditaStalla[nome];
  salvaCorrente();
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">${icona}</div>
    <div class="popup-title">${titolo}</div>
    <div class="popup-body">${corpoPopup}</div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove();renderStalla()">Capito</button>
  </div>`;
  R('APP').appendChild(ov);
}

/* ═══════════════════════════════════════════════
   CORSE DEL MESE — carriera Fantino
   Identico al sistema del Capitano (4 batterie da 3 coppie, finale a 4), con due differenze:
   - per partecipare il giocatore paga 100 oro, viene inserito tra le 12 coppie con un
     cavallo assegnato a caso (come agli altri fantini) e prosegue come spettatore-giocatore
     fino alla batteria in cui è inserito;
   - quando tocca alla batteria/finale del giocatore, prima della simulazione compare il
     minigioco "Mossa": dal risultato dipende il bonusVelocitaMossa applicato alla sua corsa.
   Se il giocatore non partecipa (non paga la quota), la corsa si svolge come nella carriera
   Capitano: tutte le batterie e la finale sono semplici simulazioni automatiche.
═══════════════════════════════════════════════ */
function apriCorseDelMeseFantino(){
  if(!S) return;
  if(S.corseProvinciaAnnullateMese){
    mostraPopupErrore('Corse annullate', 'Il maltempo di questo mese ha reso impraticabili i tufi: nessuna corsa in provincia può essere disputata.');
    return;
  }
  if(S.infortunatoMese){
    mostraPopupErrore('Infortunato', 'Sei infortunato questo mese: non puoi partecipare alle corse, ma puoi comunque osservarle.');
  }
  if(!S.corsaProvinciaMese){
    if(S.cavalliPosseduti && S.cavalliPosseduti.length && !S.lottoDecisoMese){
      renderPopupLottoCavalli();
      return;
    }
    renderSceltaPartecipazioneCorsaFantino();
    return;
  }
  renderSchermataCorseFantino();
}

/* Popup: prima di ogni corsa in provincia il giocatore decide quali dei suoi cavalli
   posseduti partecipano al lotto dei cavalli assegnabili a sorte. I cavalli già a
   stanchezza massima non possono comunque correre. */
function renderPopupLottoCavalli(){
  if(!S) return;
  const righe = S.cavalliPosseduti.map((nome,idx)=>{
    const st = statoVivoCavallo(nome);
    const stanco = st.stanchezza >= STANCHEZZA_MAX_CAVALLO;
    const escluso = S.cavalliEsclusiLotto && S.cavalliEsclusiLotto.includes(nome);
    return `
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(200,153,30,.1);${stanco?'opacity:.45':''}">
      <input type="checkbox" id="CHK_LOTTO_${idx}" ${stanco?'disabled':(escluso?'':'checked')} style="width:18px;height:18px;flex-shrink:0">
      <div style="flex:1">
        <div style="font-family:var(--fn);font-size:13px;color:var(--ocra-l);font-weight:700">🐎 ${nome}</div>
        <div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.4)">${stanco?'Troppo stanco: non può correre questo mese':'Stanchezza '+st.stanchezza+'/'+STANCHEZZA_MAX_CAVALLO}</div>
      </div>
    </label>`;
  }).join('');

  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🎲</div>
    <div class="popup-title">Lotto della corsa</div>
    <div class="popup-body">
      Quali dei tuoi cavalli vuoi inserire nel lotto assegnato a sorte per la corsa di questo mese?<br><br>
      ${righe}
    </div>
    <button class="btn gold w" onclick="confermaLottoCavalli()">Conferma</button>
  </div>`;
  R('APP').appendChild(ov);
}

function confermaLottoCavalli(){
  if(!S) return;
  const esclusi = [];
  S.cavalliPosseduti.forEach((nome,idx)=>{
    const input = R('CHK_LOTTO_'+idx);
    if(input && !input.checked) esclusi.push(nome);
  });
  S.cavalliEsclusiLotto = esclusi;
  S.lottoDecisoMese = true;
  const ovEl = document.querySelector('.overlay');
  if(ovEl) ovEl.remove();
  salvaCorrente();
  renderSceltaPartecipazioneCorsaFantino();
}

/* Schermata intermedia: chiede al giocatore se vuole pagare la quota e partecipare
   di persona alla corsa di questo mese, oppure generarla come semplice spettatore. */
function renderSceltaPartecipazioneCorsaFantino(){
  if(!S) return;
  const puoPartecipare = !S.infortunatoMese;
  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderCorseProvinciaFantino()">‹</button>
      <span class="hdr-title">Corse del Mese</span>
      <span class="hdr-right" style="font-size:10px">💰 ${S.oro}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🏁 Nuova Corsa</div>
      <div class="screen-sub">Una nuova corsa in provincia è pronta a partire.</div>
      <div class="card" style="text-align:center">
        <div style="font-size:32px;margin-bottom:10px">🏇</div>
        <div style="font-family:var(--fn);font-size:13px;color:rgba(200,153,30,.5);line-height:1.7;margin-bottom:14px">
          Puoi partecipare di persona pagando una quota di <strong style="color:var(--ocra)">${COSTO_PARTECIPAZIONE_CORSA_FANTINO} oro</strong>: verrai inserito tra le 12 coppie con un cavallo assegnato a caso, come gli altri fantini.
          ${!puoPartecipare ? '<br><br><strong style="color:var(--ross)">Sei infortunato questo mese: non puoi partecipare.</strong>' : ''}
        </div>
        ${puoPartecipare ? `<button class="btn gold w" onclick="iniziaCorsaProvinciaFantino(true)">🏇 Partecipa · ${COSTO_PARTECIPAZIONE_CORSA_FANTINO} oro</button>` : ''}
        <button class="btn w" onclick="iniziaCorsaProvinciaFantino(false)">👀 Osserva soltanto</button>
      </div>
    </div>
  </div>
  `);
}

function iniziaCorsaProvinciaFantino(partecipa){
  if(!S) return;
  if(partecipa){
    if(S.infortunatoMese){ mostraPopupErrore('Infortunato', 'Non puoi partecipare questo mese.'); return; }
    if(S.oro < COSTO_PARTECIPAZIONE_CORSA_FANTINO){
      mostraPopupErrore('Oro insufficiente', `La partecipazione costa ${COSTO_PARTECIPAZIONE_CORSA_FANTINO} oro. Al momento ne possiedi ${S.oro}.`);
      return;
    }
    S.oro -= COSTO_PARTECIPAZIONE_CORSA_FANTINO;
    S.log.push(`Partecipazione alla corsa in provincia: -${COSTO_PARTECIPAZIONE_CORSA_FANTINO} oro.`);
  }
  S.corsaProvinciaMese = generaCorsaProvinciaMeseFantino(partecipa);
  salvaCorrente();
  renderSchermataCorseFantino();
}

/* Genera la corsa del mese come nella carriera Capitano, ma se il giocatore partecipa
   lo inserisce come 12ª coppia con un cavallo casuale, sostituendo il fantino dell'ultima
   coppia generata (mantenendo così 12 coppie totali in 4 batterie da 3). */
function generaCorsaProvinciaMeseFantino(giocatorePartecipa){
  if(typeof FANTINI_DB === 'undefined' || typeof CAVALLI_DB === 'undefined') return null;
  const fantiniScelti = pescaCasualiUnici(FANTINI_DB.filter(f=>f.nome !== S.nome), giocatorePartecipa ? 11 : 12);
  const poolCavalli = CAVALLI_DB.filter(c=>{
    const posseduto = S.cavalliPosseduti && S.cavalliPosseduti.includes(c.nome);
    if(!posseduto) return true;
    const escluso = S.cavalliEsclusiLotto && S.cavalliEsclusiLotto.includes(c.nome);
    const stanco = statoVivoCavallo(c.nome).stanchezza >= STANCHEZZA_MAX_CAVALLO;
    return !escluso && !stanco;
  }).map(c=>{
    const posseduto = S.cavalliPosseduti && S.cavalliPosseduti.includes(c.nome);
    if(!posseduto) return c;
    const st = statoVivoCavallo(c.nome);
    return { nome:c.nome, velocita:st.velocita, accelerazione:st.accelerazione, tenuta_curva:st.tenuta_curva, resistenza:st.resistenza, nervosismo:st.nervosismo };
  });
  const cavalliScelti = pescaCasualiUnici(poolCavalli, 12);
  const coppie = fantiniScelti.map((f,i)=>({ fantino:f, cavallo:cavalliScelti[i] }));

  if(giocatorePartecipa){
    // Il "fantino" del giocatore usa le sue statistiche personali (bravura, esperienza, ecc.)
    const fantinoGiocatore = {
      nome: S.nome,
      bravura: S.bravura, esperienza: S.esperienza, gestione_mossa: S.gestioneMossa, empatia: S.empatia
    };
    coppie.push({ fantino: fantinoGiocatore, cavallo: cavalliScelti[11], giocatore: true });
  }

  // Stalla: ogni cavallo posseduto estratto per questa corsa (batteria+finale contano 1 sola
  // volta) accumula stanchezza +1; se il cavallo assegnato al giocatore stesso è di sua
  // proprietà, il nervosismo cala temporaneamente di 3 solo per questa corsa.
  coppie.forEach(c=>{
    const nome = c.cavallo.nome;
    if(S.cavalliPosseduti && S.cavalliPosseduti.includes(nome)){
      const st = statoVivoCavallo(nome);
      st.stanchezza = Math.min(STANCHEZZA_MAX_CAVALLO, st.stanchezza + 1);
      if(c.giocatore){
        c.cavallo = Object.assign({}, c.cavallo, { nervosismo: Math.max(1, c.cavallo.nervosismo - 3) });
        S.log.push(`Ti è stato assegnato il tuo cavallo ${nome}: nervosismo -3 per questa corsa.`);
      }
    }
  });

  // Sorteggio della pista del mese
  const pisteChiavi = Object.keys(PISTE_PROVINCIA);
  const pistaChiave = pisteChiavi[Math.floor(Math.random()*pisteChiavi.length)];

  // Divide le 12 coppie in 4 batterie da 3, mescolando l'ordine
  const ordineBatterie = pescaCasualiUnici(coppie, coppie.length);
  const batterie = [];
  for(let i=0;i<NUM_BATTERIE;i++){
    batterie.push({
      numero: i+1,
      coppie: ordineBatterie.slice(i*COPPIE_PER_BATTERIA, (i+1)*COPPIE_PER_BATTERIA),
      risultato: null,
      completata: false
    });
  }

  return {
    pistaChiave,
    batterie,
    finale: null,
    faseAttuale: 'batterie',
    batteriaCorrente: 0,
    giocatorePartecipa: !!giocatorePartecipa,
    giocatoreEliminato: false   // true se il giocatore non si è qualificato alla finale
  };
}

/* Trova in quale batteria (indice) è presente la coppia del giocatore, se presente */
function trovaBatteriaGiocatore(corsa){
  if(!corsa.giocatorePartecipa) return -1;
  return corsa.batterie.findIndex(b => b.coppie.some(c=>c.giocatore));
}

function renderSchermataCorseFantino(){
  if(!S || !S.corsaProvinciaMese) return;
  const corsa = S.corsaProvinciaMese;
  const pista = PISTE_PROVINCIA[corsa.pistaChiave];

  const renderCoppiaRiga = (c, mostraStelline)=>{
    const giaPreferito = !!S.stelline[c.cavallo.nome];
    const mediaFantino = (c.fantino.bravura + c.fantino.esperienza + c.fantino.gestione_mossa + c.fantino.empatia) / 4;
    return `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(200,153,30,.1)">
      <div style="flex:1">
        <div style="font-family:var(--fn);font-size:12px;color:${c.giocatore?'var(--verde)':'var(--ocra-l)'};font-weight:700">${c.giocatore?'⭐ ':''}${c.fantino.nome} <span style="color:rgba(200,153,30,.4);font-weight:400">su</span> ${c.cavallo.nome}</div>
        <div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.4)">${pallinistat(Math.round(mediaFantino))} media statistiche fantino</div>
      </div>
      ${mostraStelline ? `<button style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px" onclick="assegnaStellinaCavallo('${escJs(c.cavallo.nome)}','corseFantino')">${giaPreferito?'★':'☆'}</button>` : ''}
    </div>`;
  };

  let corpoHtml = '';

  if(corsa.faseAttuale === 'batterie'){
    corpoHtml += `<div class="card"><div class="card-title">Pista del Mese</div>
      <div style="font-family:var(--fn);font-size:13px;color:var(--ocra-l);font-weight:700">${pista.nome}</div>
      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.45);margin-top:3px">${pista.descrizione}</div>
    </div>`;

    corsa.batterie.forEach((b, idx)=>{
      const giaFatta = b.completata;
      const eProssima = (idx === corsa.batteriaCorrente && !giaFatta);
      const eBatteriaGiocatore = b.coppie.some(c=>c.giocatore);
      corpoHtml += `<div class="card" style="margin-bottom:10px;${eBatteriaGiocatore?'border:1px solid rgba(46,160,90,.4)':''}">
        <div class="card-title">Batteria ${b.numero}${eBatteriaGiocatore?' · ⭐ la tua batteria':''}</div>
        ${b.coppie.map(c=>renderCoppiaRiga(c, giaFatta)).join('')}
        ${giaFatta ? `
          <div style="margin-top:10px;font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Ordine d'arrivo:</div>
          ${b.risultato.map((r,i)=>`<div style="font-family:var(--fn);font-size:12px;color:${i===0?'var(--ocra)':'var(--ocra-l)'};font-weight:${i===0?'700':'400'};padding:2px 0">${i+1}° ${r.fantino.nome} su ${r.cavallo.nome}${r.caduta?' <span style="color:var(--ross)">(caduta)</span>':''}</div>`).join('')}
        ` : (eProssima ? `<button class="btn gold w" onclick="avviaDisputaBatteriaFantino(${idx})">🏁 Disputa la Batteria ${b.numero}</button>` : `<div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.3);margin-top:8px;font-style:italic">In attesa delle batterie precedenti…</div>`)}
      </div>`;
    });

    if(corsa.batterie.every(bb=>bb.completata) && corsa.finale){
      corpoHtml += `<button class="btn gold w" onclick="vaiAllaFinaleProvinciaFantino()">🏆 Vai alla Finale →</button>`;
    }

  } else if(corsa.faseAttuale === 'finale'){
    const eFinaleGiocatore = corsa.finale.coppie.some(c=>c.giocatore);
    corpoHtml += `<div class="card"><div class="card-title">Pista del Mese</div>
      <div style="font-family:var(--fn);font-size:13px;color:var(--ocra-l);font-weight:700">${pista.nome}</div>
      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.45);margin-top:3px">${pista.descrizione}</div>
    </div>`;
    if(corsa.giocatoreEliminato){
      corpoHtml += `<div class="card" style="text-align:center;padding:10px 14px">
        <div style="font-family:var(--fn);font-size:12px;color:rgba(200,153,30,.5)">Non ti sei qualificato alla finale questo mese.</div>
      </div>`;
    }
    corpoHtml += `<div class="card${eFinaleGiocatore?' style="border:1px solid rgba(46,160,90,.4)"':''}">
      <div class="card-title">Finale${eFinaleGiocatore?' · ⭐ sei in finale!':''}</div>
      ${corsa.finale.coppie.map(c=>renderCoppiaRiga(c, !!corsa.finale.completata)).join('')}
      ${corsa.finale.completata ? `
        <div style="margin-top:10px;font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Ordine d'arrivo:</div>
        ${corsa.finale.risultato.map((r,i)=>`<div style="font-family:var(--fn);font-size:12px;color:${i===0?'var(--ocra)':'var(--ocra-l)'};font-weight:${i===0?'700':'400'};padding:2px 0">${i+1}° ${r.fantino.nome} su ${r.cavallo.nome}${r.caduta?' <span style="color:var(--ross)">(caduta)</span>':''}</div>`).join('')}
        <button class="btn gold w" onclick="concludiCorseProvinciaFantino()">Continua →</button>
      ` : `<button class="btn gold w" onclick="avviaDisputaFinaleFantino()">🏆 Disputa la Finale</button>`}
    </div>`;

  } else if(corsa.faseAttuale === 'conclusa'){
    corpoHtml += `<div class="card">
      <div class="card-title">🏆 Risultato della Finale</div>
      ${corsa.finale.risultato.map((r,i)=>`<div style="font-family:var(--fn);font-size:13px;color:${i===0?'var(--ocra)':'var(--ocra-l)'};font-weight:${i===0?'700':'400'};padding:3px 0">${i+1}° ${r.fantino.nome} su ${r.cavallo.nome}${r.caduta?' <span style="color:var(--ross)">(caduta)</span>':''}</div>`).join('')}
      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.35);margin-top:10px;font-style:italic">La corsa di questo mese si è conclusa. Una nuova corsa sarà disponibile il mese prossimo.</div>
      <button class="btn w" onclick="renderCorseProvinciaFantino()">← Torna alle Corse</button>
    </div>`;
  }

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderCorseProvinciaFantino()">‹</button>
      <span class="hdr-title">Corse del Mese</span>
      <span class="hdr-right" style="font-size:10px">${MESI_CAPITANO[S.mese-1]} ${S.anno}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🏁 Batterie e Finale</div>
      <div class="screen-sub">4 batterie da 3 coppie · i primi di ognuna accedono alla finale a 4</div>
      ${corpoHtml}
    </div>
  </div>
  `);
}

/* Se nella batteria/finale è presente il giocatore, prima della simulazione si gioca il
   minigioco Mossa; altrimenti si procede direttamente come nel Capitano. */
function avviaDisputaBatteriaFantino(idx){
  if(!S || !S.corsaProvinciaMese) return;
  const corsa = S.corsaProvinciaMese;
  const b = corsa.batterie[idx];
  if(!b || b.completata) return;
  const coppiaGiocatore = b.coppie.find(c=>c.giocatore);
  if(coppiaGiocatore){
    avviaMinigiocoMossa({ contesto:'batteria', indiceBatteria:idx });
  } else {
    disputaBatteriaFantino(idx, 1);
  }
}

function disputaBatteriaFantino(idx, bonusVelocitaMossaGiocatore){
  if(!S || !S.corsaProvinciaMese) return;
  const corsa = S.corsaProvinciaMese;
  const b = corsa.batterie[idx];
  if(!b || b.completata) return;
  const pista = PISTE_PROVINCIA[corsa.pistaChiave];
  // Applica il bonus mossa solo alla coppia del giocatore, se presente
  b.coppie.forEach(c=>{ if(c.giocatore) c.bonusVelocitaMossa = bonusVelocitaMossaGiocatore; });
  b.risultato = simulaGara(b.coppie, pista);
  b.completata = true;
  registraScoreGara(b.risultato, true);
  registraScoreCavalloFantino(b.risultato, true);
  corsa.batteriaCorrente++;

  // Premi e qualificazione per il giocatore (se presente in questa batteria)
  const posizioneGiocatore = b.risultato.findIndex(r=>r.giocatore);
  if(posizioneGiocatore === 0){
    S.oro += PREMIO_BATTERIA_1;
    S.log.push(`Vinta la Batteria ${b.numero} alla corsa in provincia: +${PREMIO_BATTERIA_1} oro, qualificato alla finale.`);
  } else if(posizioneGiocatore === 1){
    S.oro += PREMIO_BATTERIA_2;
    S.log.push(`Arrivato 2° nella Batteria ${b.numero} alla corsa in provincia: +${PREMIO_BATTERIA_2} oro.`);
  }

  if(corsa.batterie.every(bb=>bb.completata) && !corsa.finale){
    const vincitori = corsa.batterie.map(bb=>bb.risultato[0]).map(r=>({fantino:r.fantino, cavallo:r.cavallo, giocatore: !!r.giocatore}));
    corsa.finale = { coppie:vincitori, risultato:null, completata:false };
    // Se il giocatore ha partecipato ma non ha vinto la propria batteria, non è in finale
    if(corsa.giocatorePartecipa && !vincitori.some(v=>v.giocatore)){
      corsa.giocatoreEliminato = true;
    }
  }
  salvaCorrente();
  renderSchermataCorseFantino();
}

function vaiAllaFinaleProvinciaFantino(){
  if(!S || !S.corsaProvinciaMese || !S.corsaProvinciaMese.finale) return;
  S.corsaProvinciaMese.faseAttuale = 'finale';
  salvaCorrente();
  renderSchermataCorseFantino();
}

function avviaDisputaFinaleFantino(){
  if(!S || !S.corsaProvinciaMese || !S.corsaProvinciaMese.finale) return;
  const coppiaGiocatore = S.corsaProvinciaMese.finale.coppie.find(c=>c.giocatore);
  if(coppiaGiocatore){
    avviaMinigiocoMossa({ contesto:'finale' });
  } else {
    disputaFinaleFantino(1);
  }
}

function disputaFinaleFantino(bonusVelocitaMossaGiocatore){
  if(!S || !S.corsaProvinciaMese || !S.corsaProvinciaMese.finale) return;
  const corsa = S.corsaProvinciaMese;
  const pista = PISTE_PROVINCIA[corsa.pistaChiave];
  corsa.finale.coppie.forEach(c=>{ if(c.giocatore) c.bonusVelocitaMossa = bonusVelocitaMossaGiocatore; });
  corsa.finale.risultato = simulaGara(corsa.finale.coppie, pista);
  corsa.finale.completata = true;
  registraScoreGara(corsa.finale.risultato, false);
  registraScoreCavalloFantino(corsa.finale.risultato, false);

  const posizioneGiocatore = corsa.finale.risultato.findIndex(r=>r.giocatore);
  if(posizioneGiocatore >= 0 && posizioneGiocatore < PREMIO_FINALE.length){
    const premio = PREMIO_FINALE[posizioneGiocatore];
    S.oro += premio;
    S.log.push(`Arrivato ${posizioneGiocatore+1}° in finale alla corsa in provincia: +${premio} oro.`);
    if(posizioneGiocatore === 0){
      S.bravura = Math.min(5, S.bravura + 1);
      S.vittorieFinaliProvincia = (S.vittorieFinaliProvincia || 0) + 1;
      S.log.push('Vittoria in finale: Bravura +1.');
    }
  }
  verificaObiettivi();
  salvaCorrente();
  renderSchermataCorseFantino();
}

function concludiCorseProvinciaFantino(){
  if(!S || !S.corsaProvinciaMese) return;
  S.corsaProvinciaMese.faseAttuale = 'conclusa';
  salvaCorrente();
  renderSchermataCorseFantino();
}

/* ═══════════════════════════════════════════════
   LA TRATTA — Carriera Fantino
   Cavalli ammessi: quelli con almeno 2 corse in provincia nell'anno (anche se
   posseduti dal giocatore: il conteggio in S.scoreCavalliAnno include già le sue
   corse). Vengono divisi in batterie da 5-6, con fantini abbinati a sorte; il
   giocatore viene inserito in una sola batteria, abbinato a un cavallo a caso.
   Se nella batteria è presente il giocatore, prima della simulazione compare il
   minigioco della Mossa. Vincere la propria batteria (1° posto): Fama +5,
   Bravura +1, 200 oro.
═══════════════════════════════════════════════ */
function _shuffleArrayFan(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function preparaTrattaPalioFantino(tipoPalio){
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio) return null;
  if(datiPalio.tratta) return datiPalio.tratta; // già preparata

  if(typeof CAVALLI_DB === 'undefined' || typeof FANTINI_DB === 'undefined') return null;

  // 1. Cavalli ammessi: almeno 2 corse in provincia nell'anno (il conteggio include
  //    già i cavalli posseduti dal giocatore, registrati in S.scoreCavalliAnno)
  const score = S.scoreCavalliAnno || {};
  let cavalliAmmessi = CAVALLI_DB.filter(c => (score[c.nome]?.corse || 0) >= 2);

  let modalitaSegreta = false;
  if(cavalliAmmessi.length < 5){
    modalitaSegreta = true;
    cavalliAmmessi = _shuffleArrayFan(CAVALLI_DB.slice()).slice(0, Math.min(12, CAVALLI_DB.length));
  }

  // 2. Divisione in batterie da 5-6 cavalli
  const shuffled = _shuffleArrayFan(cavalliAmmessi.slice());
  const nCavalli = shuffled.length;
  const nGare = Math.max(1, Math.ceil(nCavalli / 6));
  const gruppi = [];
  let offset = 0;
  for(let g=0; g<nGare; g++){
    const rimCavalli = nCavalli - offset;
    const rimGare = nGare - g;
    const dimGruppo = Math.ceil(rimCavalli / rimGare);
    gruppi.push(shuffled.slice(offset, offset + dimGruppo));
    offset += dimGruppo;
  }

  // 3. Il giocatore viene inserito in una batteria a sorte, abbinato a un cavallo
  //    a caso di quella batteria
  const idxBatteriaGiocatore = Math.floor(Math.random() * gruppi.length);

  // 4. Fantini rivali (esclude l'identità del giocatore se ha scelto un fantino esistente)
  let fantiniRivali = FANTINI_DB.slice();
  if(S.sottotipo === 'esistente'){
    fantiniRivali = fantiniRivali.filter(f=>{
      if(S.dbId !== undefined && f.id !== undefined && f.id === S.dbId) return false;
      const nomeFan = f.soprannome || f.nome || '';
      return nomeFan !== S.nome;
    });
  }
  if(fantiniRivali.length === 0) fantiniRivali = FANTINI_DB.slice();

  const miniGare = gruppi.map((cavalli, gIdx) => {
    const eBatteriaGiocatore = (gIdx === idxBatteriaGiocatore);
    const fantiniGara = _shuffleArrayFan(fantiniRivali.slice());
    const idxCavalloGiocatore = eBatteriaGiocatore ? Math.floor(Math.random() * cavalli.length) : -1;

    const coppie = cavalli.map((c, i) => {
      if(i === idxCavalloGiocatore){
        const fantinoGiocatore = { nome:S.nome, bravura:S.bravura, esperienza:S.esperienza, gestione_mossa:S.gestioneMossa, empatia:S.empatia };
        return { cavallo:c, fantino:fantinoGiocatore, giocatore:true };
      }
      return { cavallo:c, fantino:fantiniGara[i % fantiniGara.length] };
    });

    return { numero:gIdx+1, coppie, risultato:null, completata:false, giocatore:eBatteriaGiocatore };
  });

  const tratta = {
    modalitaSegreta,
    nCavalliAmmessi: nCavalli,
    miniGare,
    garaCorrente: 0,
    tutteComplete: false
  };

  datiPalio.tratta = tratta;
  salvaCorrente();
  return tratta;
}

            : `<strong style="color:var(--ocra)">${tratta.nCavalliAmmessi} cavalli</strong> hanno superato la selezione con almeno 2 corse in provincia. Vengono divisi in <strong style="color:var(--ocra)">${tratta.miniGare.length} batterie</strong> da 5-6 cavalli sulla pista senese. Tu sei stato sorteggiato in una di esse: se vinci, +5 Fama, +1 Bravura e 200 oro.`

function avviaMinigiocoMossaTrattaFantino(tipoPalio, garaIdx){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.tratta) return;
  const gara = datiPalio.tratta.miniGare[garaIdx];
  if(!gara || gara.completata) return;

  const { velocita, ampiezzaZona } = calcolaDifficoltaMossa(gara.coppie);
  window._mossaState = {
    contesto: 'trattaPalio',
    tipoPalio, garaIdx,
    velocita, ampiezzaZona,
    centroObiettivo: 50,
    posizione: 0, direzione: 1, fermata: false, timerId: null
  };
  renderMinigiocoMossa();
  avviaTickMossa();
}

function disputaMiniGaraTrattaFantino(tipoPalio, garaIdx, bonusVelocitaMossaGiocatore){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.tratta) return;
  const tratta = datiPalio.tratta;
  const gara = tratta.miniGare[garaIdx];
  if(!gara || gara.completata) return;

  const pista = PISTE_PROVINCIA.senese; // sempre pista senese per la Tratta
  gara.coppie.forEach(c => { if(c.giocatore) c.bonusVelocitaMossa = bonusVelocitaMossaGiocatore; });
  gara.risultato = simulaGara(gara.coppie, pista);
  gara.completata = true;
  tratta.garaCorrente = garaIdx + 1;
  tratta.tutteComplete = tratta.miniGare.every(g => g.completata);

  // Premio per il giocatore se presente in questa batteria
  if(gara.giocatore){
    const posizioneGiocatore = gara.risultato.findIndex(r => r.giocatore);
    if(posizioneGiocatore === 0){
      S.fama = Math.min(100, (S.fama || 0) + 5);
      S.bravura = Math.min(5, (S.bravura || 1) + 1);
      S.oro = (S.oro || 0) + 200;
      S.log.push(`Vinta la Batteria ${gara.numero} della Tratta: Fama +5, Bravura +1, +200 oro.`);
    } else {
      S.log.push(`Batteria ${gara.numero} della Tratta conclusa: ${posizioneGiocatore+1}° posto.`);
    }
  }

  salvaCorrente();
  renderTrattaPalioFantino(tipoPalio);
}

   alle 10 contrade partecipanti (preparaAssegnazioneCavalli/estraiAssegnazioneCavallo
   sono generiche e già riusabili). Qui si fornisce solo una schermata dedicata che
   evidenzia l'eventuale cavallo del giocatore.
═══════════════════════════════════════════════ */
function estraiAssegnazioneCavalloFantino(tipoPalio){
  if(!S) return;

/* ═══════════════════════════════════════════════
   OFFERTE DELLE CONTRADE — Carriera Fantino
   Ogni contrada partecipante, abbinata al proprio cavallo del lotto, può farti
   un'offerta per ingaggiarti come fantino di quel Palio. Il tasto "Accetta
   offerta" è attivo solo per le contrade con cui hai un'intesa maggiore
   dell'85%; in quel caso l'offerta (in oro) viene calcolata con la formula:
     ((intesa/100 + fama + vittorie Palio + vittorie finali corsa provincia) × 70) × random(0.8–1.2)
   Le offerte vengono calcolate una sola volta per Palio e restano fisse finché
   non si accetta. Se nessuna contrada offre un ingaggio (nessuna intesa > 85%),
   il giocatore non è stato scelto per quel Palio e si passa direttamente alla
   fase finale "Il Vincitore".
═══════════════════════════════════════════════ */
function preparaOffertePalioFantino(tipoPalio){
  if(!S) return null;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.partecipanti) return null;
  if(!S.intesaContrade) S.intesaContrade = {};

  if(!datiPalio.offerteContrade){
    datiPalio.offerteContrade = {};
    datiPalio.partecipanti.forEach(nomeContrada => {
      const intesa = (S.intesaContrade[nomeContrada] !== undefined) ? S.intesaContrade[nomeContrada] : 50;
      const attiva = intesa > 85;
      let offerta = 0;
      if(attiva){
        const fattoreRandom = 0.8 + Math.random() * 0.4;
        offerta = Math.round((((intesa / 100) + (S.fama || 0) + (S.vittorie || 0) + (S.vittorieFinaliProvincia || 0)) * 70) * fattoreRandom);
      }
      datiPalio.offerteContrade[nomeContrada] = { intesa, attiva, offerta };
    });
    salvaCorrente();
  }
  return datiPalio.offerteContrade;
}

/* ═══════════════════════════════════════════════
   ACCORDI CON LE CONTRADE — Carriera Fantino
   Ognuna delle contrade in Piazza (escluso il colore per cui il giocatore corre)
   può proporre un accordo segreto per fargli sbagliare la mossa apposta. La
   probabilità che la singola contrada faccia l'offerta è pari al valore della
   sua intesa col giocatore (0-100 → 0-100%); la cifra proposta segue la formula
   (media bravura/esperienza/gestione_mossa/empatia del fantino × 150 × random
   0.8-1.2). Le offerte vengono tirate una sola volta per Palio. Accettandone una
   il giocatore incassa l'oro, perde 10 di intesa con la propria contrada e
   guadagna 10 di intesa con la contrada alleata; resterà poi libero, alla
   mossa, di rispettare l'accordo o tradirlo. Si può accettare un solo accordo
   per Palio (la mossa è un solo istante) e si può proseguire senza accettarne
   nessuno.
═══════════════════════════════════════════════ */
function preparaAccordiContradeFantino(tipoPalio){
  if(!S) return null;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.partecipanti) return null;
  if(!S.intesaContrade) S.intesaContrade = {};
  const contradaGiocatore = datiPalio.contradaFantino;

  if(!datiPalio.accordiContradeFantino){
    const mediaFantino = ((S.bravura||1) + (S.esperienza||1) + (S.gestioneMossa||1) + (S.empatia||1)) / 4;
    const offerte = {};
    datiPalio.partecipanti.forEach(nomeContrada => {
      if(nomeContrada === contradaGiocatore) return;
      const intesa = (S.intesaContrade[nomeContrada] !== undefined) ? S.intesaContrade[nomeContrada] : 50;
      const attiva = Math.random() * 100 < intesa;
      let offerta = 0;
      if(attiva){
        const fattoreRandom = 0.8 + Math.random() * 0.4;
        offerta = Math.round(mediaFantino * 150 * fattoreRandom);
      }
      offerte[nomeContrada] = { intesa, attiva, offerta };
    });
    datiPalio.accordiContradeFantino = offerte;
    salvaCorrente();
  }
  return datiPalio.accordiContradeFantino;
}

function accettaAccordoContradaFantino(tipoPalio, nomeContrada){
  if(!S) return;

  if(!o || !o.attiva) return;

  const contradaGiocatore = datiPalio.contradaFantino;

  S.oro = (S.oro || 0) + o.offerta;
  const intesaPropria = (S.intesaContrade[contradaGiocatore] !== undefined) ? S.intesaContrade[contradaGiocatore] : 50;
  S.intesaContrade[contradaGiocatore] = Math.max(0, intesaPropria - 10);
  const intesaAlleata = (S.intesaContrade[nomeContrada] !== undefined) ? S.intesaContrade[nomeContrada] : 50;
  S.intesaContrade[nomeContrada] = Math.min(100, intesaAlleata + 10);
  applicaRivalitaIntesaContrada(nomeContrada);

  datiPalio.accordoMossaFantino = nomeContrada;
  S.log.push(`Accordo segreto con la Contrada del ${nomeContrada} per la mossa: +${o.offerta} oro, intesa con la Contrada del ${contradaGiocatore} -10, intesa con la Contrada del ${nomeContrada} +10.`);
  salvaCorrente();
  renderAccordiContradeFantino(tipoPalio);

/* ═══════════════════════════════════════════════
   ACCORDI TRA FANTINI — Carriera Fantino
   Alle 9 contrade rivali in Piazza (tutte tranne quella per cui corre il
   giocatore) viene assegnato un fantino a caso dal database. Il giocatore può
   offrire oro a ciascun fantino rivale perché freni il proprio cavallo.
   Il fantino accetta se:  offerta ≥ ((media statistiche rivale × 120) − amicizia) × random(0.8–1.2)
   Cifra suggerita:        ((media statistiche rivale × 120) − amicizia) × 1.3
   Se accetta, con probabilità pari all'amicizia% sarà "di parola" (cavallo
   della sua contrada −3 Velocità fino a fine Palio, amicizia +10), altrimenti
   "lo tradisce" (incassa comunque l'oro ma non frena, amicizia −50).
   Se l'offerta è insufficiente il fantino rifiuta: nessun oro speso, amicizia −10.
   L'esito di ogni accordo viene comunicato nella schermata successiva
   (Istruzioni del Capitano).
═══════════════════════════════════════════════ */
function preparaAccordiFantiniRivali(tipoPalio){
  if(!S) return null;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.partecipanti || !datiPalio.contradaFantino) return null;
  if(typeof FANTINI_DB === 'undefined' || !FANTINI_DB.length) return null;

  const contradaGiocatore = datiPalio.contradaFantino;
  const contradeRivali = datiPalio.partecipanti.filter(n => n !== contradaGiocatore);

  if(!datiPalio.fantiniRivaliAccordi){
    const scelti = _estraiFantiniPesati(FANTINI_DB, contradeRivali.length);
    const assegnazione = {};
    contradeRivali.forEach((nomeContrada, i) => {
      assegnazione[nomeContrada] = scelti[i % scelti.length].nome;
    });
    datiPalio.fantiniRivaliAccordi = assegnazione;
    salvaCorrente();
  }
  if(!datiPalio.accordiFantiniRivali){
    datiPalio.accordiFantiniRivali = {};
    salvaCorrente();
  }
  return { contradaGiocatore, contradeRivali, assegnazione: datiPalio.fantiniRivaliAccordi, accordi: datiPalio.accordiFantiniRivali };
}

function _mediaStatFantinoRivale(f){
  return ((f.bravura||1) + (f.esperienza||1) + (f.gestione_mossa||1) + (f.empatia||1)) / 4;
}

/* Estrazione pesata di n fantini (senza ripetizioni) dal pool passato: i fantini con
   media statistiche più alta (es. i "big" come Tittia) hanno molte più probabilità di
   essere estratti rispetto a un fantino mediocre, ma resta comunque possibile (anche se
   raro) che un fantino più debole finisca fra i prescelti. Il peso cresce in modo
   marcato (esponente alto) proprio per rendere "quasi certa" la presenza dei migliori. */
function _estraiFantiniPesati(pool, n){
  const candidati = pool.slice();
  const scelti = [];
  const quanti = Math.min(n, candidati.length);
  const ESPONENTE_PESO = 5; // più alto = più probabile che i migliori vengano scelti quasi sempre
  for(let k = 0; k < quanti; k++){
    const pesi = candidati.map(f => Math.pow(Math.max(_mediaStatFantinoRivale(f), 0.1), ESPONENTE_PESO));
    const totale = pesi.reduce((a,b) => a+b, 0);
    let r = Math.random() * totale;
    let idx = candidati.length - 1;
    for(let i = 0; i < pesi.length; i++){
      r -= pesi[i];
      if(r <= 0){ idx = i; break; }
    }
    scelti.push(candidati[idx]);
    candidati.splice(idx, 1);
  }
  return scelti;
}

function offriAccordoFantinoRivale(tipoPalio, nomeContrada, idx){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.fantiniRivaliAccordi || !datiPalio.accordiFantiniRivali) return;
  if(datiPalio.accordiFantiniRivali[nomeContrada]) return; // già deciso

  const nomeFantino = datiPalio.fantiniRivaliAccordi[nomeContrada];
  const f = (typeof FANTINI_DB !== 'undefined') ? FANTINI_DB.find(x => x.nome === nomeFantino) : null;
  if(!f) return;

  const input = R('OFFERTA_FAN_'+idx);
  const offerta = Math.max(0, Math.round(Number(input?.value) || 0));

  if(!S.amiciziaFantini) S.amiciziaFantini = {};
  const amicizia = (S.amiciziaFantini[nomeFantino] !== undefined) ? S.amiciziaFantini[nomeFantino] : 50;
  const media = _mediaStatFantinoRivale(f);
  const fattoreRandom = 0.8 + Math.random()*0.4;
  const soglia = Math.max(0, (media*1200 - amicizia) * fattoreRandom);

  if(offerta < soglia){
    S.amiciziaFantini[nomeFantino] = Math.max(0, amicizia - 10);
    datiPalio.accordiFantiniRivali[nomeContrada] = { fantino: nomeFantino, stato:'rifiutato', offerta };
    S.log.push(`${nomeFantino} ha rifiutato la tua offerta di ${offerta} oro (amicizia ora ${S.amiciziaFantini[nomeFantino]}).`);
    salvaCorrente();
    renderAccordiFantiniRivali(tipoPalio);
    return;
  }

  // Il fantino accetta: spende l'oro del giocatore
  S.oro = Math.max(0, (S.oro || 0) - offerta);

  const diParola = Math.random()*100 < amicizia;
  if(diParola){
    S.amiciziaFantini[nomeFantino] = Math.min(100, amicizia + 10);
    if(!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
    datiPalio.velocitaOffsetContrade[nomeContrada] = (datiPalio.velocitaOffsetContrade[nomeContrada] || 0) - 3;
  } else {
    S.amiciziaFantini[nomeFantino] = Math.max(0, amicizia - 50);
  }

  datiPalio.accordiFantiniRivali[nomeContrada] = {
    fantino: nomeFantino, stato:'accettato', offerta, esito: diParola ? 'parola' : 'tradimento'
  };
  S.log.push(`Accordo con ${nomeFantino} (Contrada del ${nomeContrada}) per ${offerta} oro: ha ${diParola?'mantenuto la parola':'preso i soldi e ti ha tradito'}.`);
  salvaCorrente();
  renderAccordiFantiniRivali(tipoPalio);
}

/* ═══════════════════════════════════════════════
   ISTRUZIONI DEL CAPITANO — Carriera Fantino
   Comunica al giocatore l'esito reale degli accordi presi con i fantini
   rivali nella fase precedente (chi è stato di parola e chi lo ha tradito),
   mostra il cavallo abbinato alla propria Contrada (con i risultati avuti
   nella Tratta e nelle corse in provincia, e le statistiche sotto forma di
   pallini colorati solo se il cavallo è di proprietà del giocatore) e
   comunica la strategia che il capitano si aspetta venga rispettata in
   Piazza del Campo.

   Le 4 strategie possibili sono assegnate a caso e restano fissate per
   l'intero Palio (datiPalio.strategiaCapitanoFantino). Il rispetto o meno
   dell'istruzione si verifica solo a corsa conclusa (vedi
   valutaStrategiaCapitanoFantino più sotto, da richiamare quando sarà
   disponibile l'esito reale della corsa): +5 intesa con la propria Contrada
   se rispettata, −5 se disattesa.
═══════════════════════════════════════════════ */
const STRATEGIE_CAPITANO_FANTINO = [
  { id:'sbaglia_mossa',   testo:'Sbaglia appositamente la mossa',     icona:'🚫', dettaglio:"Meglio una mossa fallita, o restare ultimi, che rischiare di favorire involontariamente una contrada sgradita. Non avere fretta di scattare al canape." },
  { id:'podio',           testo:'Cerca di arrivare sul podio',        icona:'🥉', dettaglio:'Non serve vincere: basta un piazzamento d\'onore, tra i primi tre, per portare lustro alla Contrada.' },
  { id:'ostacola_nemica', testo:'Impedisci la vittoria della nemica', icona:'🗡️', dettaglio:'Qualunque cosa accada in Piazza, la contrada nemica non deve alzare il Drappellone.' },
  { id:'vinci',           testo:'Vinci',                              icona:'🏆', dettaglio:'Il capitano non vuole sentire scuse: il Palio deve tornare nel rione.' }
];

/* Individua la "nemica" del momento tra le contrade partecipanti: quella con
   cui il giocatore ha l'intesa più bassa (default 50 se mai tracciata). */
function _trovaContradaNemicaFantino(tipoPalio, contradaGiocatore){
  if(!S) return null;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.partecipanti) return null;
  const rivali = datiPalio.partecipanti.filter(n => n !== contradaGiocatore);
  if(!rivali.length) return null;
  if(!S.intesaContrade) S.intesaContrade = {};
  let minVal = Infinity, candidate = [];
  rivali.forEach(n => {
    const v = (S.intesaContrade[n] !== undefined) ? S.intesaContrade[n] : 50;
    if(v < minVal){ minVal = v; candidate = [n]; }
    else if(v === minVal){ candidate.push(n); }
  });
  return candidate[Math.floor(Math.random()*candidate.length)] || null;
}

/* Genera (una sola volta per Palio) e ritorna la strategia del capitano. */
function preparaStrategiaCapitanoFantino(tipoPalio){
  if(!S) return null;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.contradaFantino) return null;
  if(!datiPalio.strategiaCapitanoFantino){
    const scelta = STRATEGIE_CAPITANO_FANTINO[Math.floor(Math.random()*STRATEGIE_CAPITANO_FANTINO.length)];
    const strategia = { id: scelta.id, bersaglio: null, valutata: false };
    if(scelta.id === 'ostacola_nemica'){
      strategia.bersaglio = _trovaContradaNemicaFantino(tipoPalio, datiPalio.contradaFantino);
    }
    datiPalio.strategiaCapitanoFantino = strategia;
    salvaCorrente();
  }
  return datiPalio.strategiaCapitanoFantino;
}

/* Da richiamare quando sarà noto l'esito reale del Palio (fase "corsa"/
   "vincitore", non ancora implementata per la Carriera Fantino). L'oggetto
   `esito` atteso: { piazzamento, nPartecipanti, squalificato, vincitrice }.
   Assegna +5 intesa con la propria Contrada se l'istruzione del capitano è
   stata rispettata, −5 se disattesa. */
function valutaStrategiaCapitanoFantino(tipoPalio, esito){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  const strategia = datiPalio && datiPalio.strategiaCapitanoFantino;
  if(!datiPalio || !strategia || strategia.valutata) return;
  const contradaGiocatore = datiPalio.contradaFantino;
  const { piazzamento, nPartecipanti, squalificato, vincitrice } = esito || {};

  let successo = false;
  if(strategia.id === 'sbaglia_mossa'){
    successo = !!squalificato || (piazzamento && nPartecipanti && piazzamento >= nPartecipanti);
  } else if(strategia.id === 'podio'){
    successo = !squalificato && piazzamento && piazzamento <= 3;
  } else if(strategia.id === 'ostacola_nemica'){
    successo = !strategia.bersaglio || vincitrice !== strategia.bersaglio;
  } else if(strategia.id === 'vinci'){
    successo = !squalificato && piazzamento === 1;
  }

  if(!S.intesaContrade) S.intesaContrade = {};
  const intesaAttuale = (S.intesaContrade[contradaGiocatore] !== undefined) ? S.intesaContrade[contradaGiocatore] : 50;
  S.intesaContrade[contradaGiocatore] = successo ? Math.min(100, intesaAttuale + 5) : Math.max(0, intesaAttuale - 5);
  applicaRivalitaIntesaContrada(contradaGiocatore);

  strategia.valutata = true;
  strategia.successo = successo;
  const testoStrategia = STRATEGIE_CAPITANO_FANTINO.find(s => s.id === strategia.id);
  S.log.push(`Istruzione del capitano ("${testoStrategia?testoStrategia.testo:strategia.id}"): ${successo?'rispettata':'disattesa'}. Intesa con la Contrada del ${contradaGiocatore} ${successo?'+5':'-5'}.`);
  salvaCorrente();
}

/* ═══════════════════════════════════════════════
   ESTRAZIONE AL CANAPO — Carriera Fantino
   Stessa logica del Capitano (preparaCanapoPalio/estraiCanapoPalio/
   renderCanapoPalio), riadattata: la "propria" contrada è
   datiPalio.contradaFantino invece di S.contrada.nome. Le contrade
   alleate/nemiche adiacenti al canape sono quelle realmente alleate o
   rivali (RAPPORTI_CONTRADE / relazioneIniziale, fisse, le stesse usate
   alla partenza della carriera Capitano) e non dipendono dal valore di
   intesa tra il fantino e la contrada.
   Effetti (modifiche temporanee valide fino a fine Palio):
   - La contrada estratta "di rincorsa" subisce Velocità −1.
   - Se la contrada del giocatore finisce in una posizione adiacente a una
     contrada storicamente nemica, il cavallo del giocatore subisce
     Nervosismo +2 per ogni contrada nemica adiacente; se adiacente a
     un'alleata storica, Nervosismo −1.
═══════════════════════════════════════════════ */
function preparaCanapoPalioFantino(tipoPalio){
  if(!S) return null;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.partecipanti) return null;
  if(!datiPalio.canapoFantino){
    datiPalio.canapoFantino = {
      assegnazioni: {},                                   // { posizione (1-10): nomeContrada }
      contradeRimanenti: datiPalio.partecipanti.slice(),  // pool da cui estrarre a sorte
      effetti: [],                                         // log testuale degli effetti applicati durante il sorteggio
      completata: false
    };
    salvaCorrente();
  }
  return datiPalio.canapoFantino;
}

function estraiCanapoPalioFantino(tipoPalio){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.contradaFantino) return;
  const canapo = preparaCanapoPalioFantino(tipoPalio);
  if(!canapo || canapo.completata) return;

  const contradaGiocatore = datiPalio.contradaFantino;

  // Trova la prossima posizione libera, in ordine: 1,2,...,9, poi "di rincorsa" (10)
  let prossimaPos = null;
  for(let p = 1; p <= 10; p++){
    if(!canapo.assegnazioni[p]){ prossimaPos = p; break; }
  }
  if(prossimaPos === null || canapo.contradeRimanenti.length === 0) return;

  // Estrazione a sorte di una contrada tra quelle rimaste
  const idx = Math.floor(Math.random() * canapo.contradeRimanenti.length);
  const contradaEstratta = canapo.contradeRimanenti.splice(idx, 1)[0];
  canapo.assegnazioni[prossimaPos] = contradaEstratta;

  const labelPos = prossimaPos <= 9 ? `posizione ${prossimaPos}` : 'di rincorsa';
  S.log.push(`Estrazione al canapo: ${contradaEstratta} sorteggiata ${labelPos}.`);

  // Effetto 1 — la contrada "di rincorsa" subisce un calo di velocità (-1, fino a fine Palio)
  if(prossimaPos === 10){
    if(!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
    datiPalio.velocitaOffsetContrade[contradaEstratta] = (datiPalio.velocitaOffsetContrade[contradaEstratta] || 0) - 1;
    canapo.effetti.push(`🐎 <strong style="color:var(--ocra-l)">${contradaEstratta}</strong> parte di rincorsa: Velocità <strong style="color:var(--ross)">−1</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>`);
    S.log.push(`${contradaEstratta} parte di rincorsa: velocità -1 (fino a fine Palio).`);
  }

  // Effetto 2 — posizione adiacente tra la contrada del giocatore e un'altra già piazzata:
  // se nemica (intesa < 20): nervosismo cavallo +2; se alleata (intesa > 80): nervosismo cavallo -1
  posizioniAdiacentiCanapo(prossimaPos).forEach(p => {
    const vicina = canapo.assegnazioni[p];
    if(!vicina) return;
    const coinvolgeGiocatore = (contradaEstratta === contradaGiocatore && vicina !== contradaGiocatore)
      || (vicina === contradaGiocatore && contradaEstratta !== contradaGiocatore);
    if(!coinvolgeGiocatore) return;
    const altra = (contradaEstratta === contradaGiocatore) ? vicina : contradaEstratta;
    const relAltra = relazioneIniziale(contradaGiocatore, altra);
    const eAlleata = relAltra === 'alleato';
    const eNemica = relAltra === 'rivale';
    if(!datiPalio.modificheTempPalio) datiPalio.modificheTempPalio = {};
    if(eAlleata){
      datiPalio.modificheTempPalio.nervosismoOffset = (datiPalio.modificheTempPalio.nervosismoOffset || 0) - 1;
      canapo.effetti.push(`😌 <strong style="color:var(--ocra-l)">${contradaGiocatore}</strong> è adiacente all'alleata <strong style="color:var(--verde)">${altra}</strong> al canape: Nervosismo del cavallo <strong style="color:var(--verde)">−1</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>`);
      S.log.push(`Posizione adiacente tra ${contradaGiocatore} e l'alleata ${altra} al canape: nervosismo cavallo -1 (fino a fine Palio).`);
    } else if(eNemica){
      datiPalio.modificheTempPalio.nervosismoOffset = (datiPalio.modificheTempPalio.nervosismoOffset || 0) + 2;
      canapo.effetti.push(`😬 <strong style="color:var(--ocra-l)">${contradaGiocatore}</strong> è adiacente alla nemica <strong style="color:var(--ross)">${altra}</strong> al canape: Nervosismo del cavallo <strong style="color:var(--ross)">+2</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>`);
      S.log.push(`Posizione adiacente tra ${contradaGiocatore} e la nemica ${altra} al canape: nervosismo cavallo +2 (fino a fine Palio).`);
    }
  });

  if(Object.keys(canapo.assegnazioni).length >= 10){
    canapo.completata = true;
    S.log.push('Estrazione al canapo completata: tutte le 10 posizioni sono state stabilite.');
  }

  salvaCorrente();
  renderCanapoPalioFantino(tipoPalio);
}

function renderCanapoPalioFantino(tipoPalio){

  const contradaGiocatore = datiPalio.contradaFantino;
  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';

  const progressHtml = FASI_PALIO_FANTINO.map((f,i) => `
    <div style="width:${100/FASI_PALIO_FANTINO.length - 1}%;height:4px;border-radius:2px;background:${i<=faseIdx?'var(--ocra)':'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>

    const eIoGiocatore = nomeContrada === contradaGiocatore;

    let interno;
    if(nomeContrada){
      const cd = CONTRADE.find(c => c.nome === nomeContrada);
      interno = `

        </div>
        <div style="font-family:var(--fn);font-size:9px;font-weight:700;color:${eIoGiocatore?'var(--ocra)':'var(--ocra-l)'};text-align:center;line-height:1.2;margin-top:4px;overflow-wrap:break-word">${nomeContrada}</div>`;
    } else {
      interno = `
        <div style="width:46px;height:46px;border-radius:10px;background:rgba(200,153,30,.05);border:2px dashed rgba(200,153,30,.3);display:flex;align-items:center;justify-content:center;margin:0 auto">

    return `

                border:${nomeContrada ? (eIoGiocatore?'1px solid rgba(200,153,30,.6)':eRincorsa?'1px solid rgba(139,26,0,.5)':'1px solid rgba(46,92,26,.4)') : '1px solid rgba(200,153,30,.16)'};
                border-radius:11px;padding:8px 3px">
      <div style="font-family:var(--fn);font-size:8px;letter-spacing:.4px;text-transform:uppercase;color:rgba(200,153,30,.4);margin-bottom:5px">${etichetta}</div>
      ${interno}

  }).join('');

  const effettiHtml = (canapo.effetti && canapo.effetti.length)
    ? `<div class="card" style="margin-top:12px">
        <div class="card-title">Effetti del sorteggio</div>
        ${canapo.effetti.map(e => `<div style="font-family:var(--fn);font-size:11px;color:var(--perg2);line-height:1.7;padding:3px 0;border-bottom:1px solid rgba(200,153,30,.08)">${e}</div>`).join('')}
      </div>`
    : '';

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx+1}/${FASI_PALIO_FANTINO.length}</span>
    </div>
    <div class="pad fade-in">

      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">
        ${progressHtml}
      </div>

      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:40px;margin-bottom:6px">🎯</div>
        <div class="screen-title">Estrazione al Canapo</div>
        <div class="screen-sub" style="margin-bottom:0">Il sorteggio stabilisce la posizione alla mossa di ogni contrada</div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Come funziona</div>
        <div style="font-family:var(--fn);font-size:12px;color:var(--perg2);line-height:1.7">
          Tocca <strong style="color:var(--ocra)">Estrazione</strong> per sorteggiare una delle 10 contrade partecipanti.
          La contrada estratta occupa la prossima posizione libera al canape, dalla 1 fino alla 9, e infine la posizione "di rincorsa".
          La contrada di rincorsa parte da dietro e perde velocità; una posizione adiacente a una contrada nemica fa aumentare il nervosismo del cavallo della tua Contrada, mentre una adiacente a un'alleata lo calma.
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(200,153,30,.12);display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Posizioni estratte</div>
          <div style="font-family:var(--fn);font-size:16px;font-weight:700;color:${tutteAssegnate?'var(--verde)':'var(--ocra-l)'}">${nAssegnate} / 10</div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:7px;margin-bottom:4px">
