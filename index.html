/* ── Vai a trovarlo: costo 300 oro, +intesa = 2 × empatia fantino × random(0.8–1.2), max 3 al mese ── */
function eseguiVisitaFantino(nomeFantino){
  if(!S) return;
  if(S.visiteFantiniMese === undefined) S.visiteFantiniMese = 0;
  if(S.visiteFantiniMese >= MAX_VISITE_FANTINI_MESE){
    mostraPopupErrore('Limite raggiunto', `Puoi visitare al massimo ${MAX_VISITE_FANTINI_MESE} fantini al mese. Riprova il mese prossimo.`);
    return;
  }
  if(S.oro < COSTO_VISITA_FANTINO){
    mostraPopupErrore('Oro insufficiente', `Andare a trovare un fantino costa ${COSTO_VISITA_FANTINO} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  const f = FANTINI_DB.find(x=>x.nome===nomeFantino);
  if(!f) return;

  S.oro -= COSTO_VISITA_FANTINO;
  const fattore = 0.8 + Math.random()*0.4;
  const aumento = Math.round(2 * f.empatia * fattore);
  if(S.intesaFantini[nomeFantino] === undefined) S.intesaFantini[nomeFantino] = 0;
  S.intesaFantini[nomeFantino] = Math.min(100, S.intesaFantini[nomeFantino] + aumento);
  S.visiteFantiniMese++;
  S.log.push(`Visita a ${nomeFantino}: -${COSTO_VISITA_FANTINO} oro, +${aumento} intesa (ora ${S.intesaFantini[nomeFantino]}).`);
  verificaObiettivi();
  salvaCorrente();
  mostraPopupRisultatoManiero('🚪 Visita al Fantino', `Hai trascorso del tempo con <strong style="color:var(--ocra)">${nomeFantino}</strong>.<br><br>Spesa: <strong style="color:var(--ross)">-${COSTO_VISITA_FANTINO} oro</strong><br>Intesa: <strong style="color:var(--verde)">+${aumento}</strong> (ora ${S.intesaFantini[nomeFantino]})`, 'renderContattaFantini');
}

/* ═══════════════════════════════════════════════
   MOTORE DI SIMULAZIONE CORSA (a step)
   Statistiche pesate 70% cavallo / 30% fantino, applicate come
   correttivi ai coefficienti chiave piuttosto che come media diretta.
═══════════════════════════════════════════════ */

/* L'empatia del fantino abbassa il nervosismo effettivo del cavallo */
function nervosismoEffettivo(cavallo, fantino){
  return Math.max(1, cavallo.nervosismo - (fantino.empatia-1)*0.4);
}

/* Simula una singola corsa (un giro completo della pista per NUM_GIRI_CORSA volte) per una coppia cavallo+fantino.
   Ritorna il tempo totale impiegato (valori più bassi = più veloce) e un eventuale evento di caduta. */
function simulaCorsaCoppia(cavallo, fantino, pista, bonusVelocitaMossa){
  bonusVelocitaMossa = bonusVelocitaMossa || 1; // moltiplicatore da minigioco mossa (1 = nessun effetto, usato dal Capitano)
  const nervEff = nervosismoEffettivo(cavallo, fantino);
  // Il nervosismo alto abbassa la resistenza effettiva del cavallo
  const resistenzaEff = Math.max(0.5, cavallo.resistenza - (nervEff-1)*0.3);
  // La bravura del fantino aiuta lievemente la velocità di punta (sorpassi più efficaci)
  const velocitaMax = (cavallo.velocita + fantino.bravura*0.15) * bonusVelocitaMossa;
  // La gestione mossa del fantino aiuta l'accelerazione, soprattutto in partenza
  const accelerazione = cavallo.accelerazione + fantino.gestione_mossa*0.3;
  // L'esperienza del fantino aiuta a tenere una velocità maggiore in curva
  const tenutaCurvaEff = cavallo.tenuta_curva + fantino.esperienza*0.2;

  const segmentiGiro = pista.segmento;
  const lunghezzaGiro = segmentiGiro.reduce((tot,s)=>tot+s.lunghezza,0);
  const distanzaTotale = lunghezzaGiro * NUM_GIRI_CORSA;

  let velocitaAttuale = 0.3;
  let distanzaPercorsa = 0;
  let tempo = 0;
  let caduta = false;
  const passo = 2.0;
  let iterazioniMax = 20000; // sicurezza anti-loop infinito

  for(let giro=0; giro<NUM_GIRI_CORSA && !caduta; giro++){
    for(const seg of segmentiGiro){
      let distSeg = 0;
      while(distSeg < seg.lunghezza && iterazioniMax-->0){
        let vTarget;
        if(seg.tipo === 'curva'){
          // Tenuta curva alta avvicina la velocità in curva a quella massima; bassa tenuta penalizza molto
          const fattoreCurva = Math.min(1.0, 0.45 + tenutaCurvaEff*0.09) / seg.severita;
          vTarget = velocitaMax * fattoreCurva;
          // Rischio di caduta: tenuta curva molto bassa rispetto alla severità della curva
          const rischioCaduta = Math.max(0, (seg.severita*1.3 - tenutaCurvaEff) * 0.012);
          if(Math.random() < rischioCaduta){ caduta = true; break; }
        } else {
          vTarget = velocitaMax;
        }
        // La velocità cala progressivamente nel corso della gara, in modo inversamente
        // proporzionale alla resistenza effettiva (alta resistenza = calo minore)
        const frazioneGara = distanzaPercorsa / distanzaTotale;
        const caloResistenza = frazioneGara * (1.5 / resistenzaEff);
        vTarget = Math.max(0.2, vTarget - caloResistenza);

        if(velocitaAttuale < vTarget){
          velocitaAttuale = Math.min(vTarget, velocitaAttuale + accelerazione*0.08);
        } else {
          velocitaAttuale = Math.max(vTarget, velocitaAttuale - 0.15);
        }

        const avanzamento = velocitaAttuale * passo;
        distSeg += avanzamento;
        distanzaPercorsa += avanzamento;
        tempo += passo;
      }
      if(caduta) break;
    }
  }
  if(caduta){
    // Una caduta penalizza pesantemente il tempo finale (il cavallo scosso finisce ultimo o quasi)
    tempo += 600 + Math.random()*400;
  }
  // Piccola variabilità random per evitare risultati sempre identici a parità di statistiche
  tempo *= (0.97 + Math.random()*0.06);
  return { tempo, caduta };
}

/* Simula una batteria/finale: array di coppie {cavallo, fantino} -> ritorna classifica ordinata
   (dal primo all'ultimo) con tempo e flag caduta per ciascuna coppia.
   Se una coppia ha la proprietà bonusVelocitaMossa (impostata dal minigioco mossa del
   fantino-giocatore), questo bonus viene applicato alla sua simulazione. */
function simulaGara(coppie, pista){
  const risultati = coppie.map(c=>{
    const r = simulaCorsaCoppia(c.cavallo, c.fantino, pista, c.bonusVelocitaMossa);
    return { cavallo:c.cavallo, fantino:c.fantino, tempo:r.tempo, caduta:r.caduta, giocatore:!!c.giocatore };
  });
  risultati.sort((a,b)=>a.tempo-b.tempo);
  return risultati;
}

/* ═══════════════════════════════════════════════
   GENERAZIONE DELLA CORSA MENSILE
═══════════════════════════════════════════════ */
function pescaCasualiUnici(lista, n){
  const copia = lista.slice();
  const presi = [];
  for(let i=0;i<n && copia.length>0;i++){
    const idx = Math.floor(Math.random()*copia.length);
    presi.push(copia[idx]);
    copia.splice(idx,1);
  }
  return presi;
}

function generaCorsaProvinciaMese(){
  if(typeof FANTINI_DB === 'undefined' || typeof CAVALLI_DB === 'undefined') return null;
  const fantiniScelti = pescaCasualiUnici(FANTINI_DB, 12);
  const cavalliScelti = pescaCasualiUnici(CAVALLI_DB, 12);
  const coppie = fantiniScelti.map((f,i)=>({ fantino:f, cavallo:cavalliScelti[i] }));

  // Sorteggio della pista del mese
  const pisteChiavi = Object.keys(PISTE_PROVINCIA);
  const pistaChiave = pisteChiavi[Math.floor(Math.random()*pisteChiavi.length)];

  // Divide le 12 coppie in 4 batterie da 3
  const ordineBatterie = pescaCasualiUnici(coppie, coppie.length); // shuffle completo
  const batterie = [];
  for(let i=0;i<NUM_BATTERIE;i++){
    batterie.push({
      numero: i+1,
      coppie: ordineBatterie.slice(i*COPPIE_PER_BATTERIA, (i+1)*COPPIE_PER_BATTERIA),
      risultato: null, // sarà popolato dopo la simulazione
      completata: false
    });
  }

  return {
    pistaChiave,
    batterie,
    finale: null,       // {coppie, risultato, completata} — popolata dopo le 4 batterie
    faseAttuale: 'batterie', // 'batterie' -> 'finale' -> 'conclusa'
    batteriaCorrente: 0      // indice della prossima batteria da disputare
  };
}

function renderSchermataCorse(){

    const giaPreferito = !!S.stelline[c.cavallo.nome];
    const mediaFantino = (c.fantino.bravura + c.fantino.esperienza + c.fantino.gestione_mossa + c.fantino.empatia) / 4;

      </div>`;

      <button class="hdr-back" onclick="renderCorseProvincia()">‹</button>

    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🏁 Batterie e Finale</div>
      <div class="screen-sub">4 batterie da 3 coppie · i primi di ognuna accedono alla finale a 4</div>
      ${corpoHtml}

/* ── Stellina preferita: il giocatore può assegnarne e toglierne quante vuole,
   sia dalla schermata Corse (dopo la batteria/finale) sia dal menu Cavalli ── */
function assegnaStellinaCavallo(nomeCavallo, origine){
  if(!S) return;
  if(!S.stelline) S.stelline = {};
  const giaPreferito = !!S.stelline[nomeCavallo];

  if(giaPreferito){
    // Toggle: rimuove la stellina se il giocatore clicca di nuovo sullo stesso cavallo
    delete S.stelline[nomeCavallo];
    S.log.push(`Stellina rimossa dal cavallo ${nomeCavallo}.`);
  } else {
    S.stelline[nomeCavallo] = true;
    S.log.push(`Stellina assegnata al cavallo ${nomeCavallo}.`);
  }
  salvaCorrente();
  if(origine === 'cavalli') renderCavalliProvincia();
  else if(origine === 'cavalliFantino') renderCavalliFantino();
  else if(origine === 'corseFantino') renderSchermataCorseFantino();
  else renderSchermataCorse();
}

/* ── Registra nello score annuale l'esito di una gara per ogni cavallo partecipante ── */
function registraScoreGara(risultato, eBatteria){
  if(!S.scoreCavalliAnno) S.scoreCavalliAnno = {};
  risultato.forEach((r,i)=>{
    const nome = r.cavallo.nome;
    if(!S.scoreCavalliAnno[nome]) S.scoreCavalliAnno[nome] = {corse:0, batterieVinte:0, finaliVinte:0};
    S.scoreCavalliAnno[nome].corse++;
    if(i===0){
      if(eBatteria) S.scoreCavalliAnno[nome].batterieVinte++;
      else S.scoreCavalliAnno[nome].finaliVinte++;
    }
  });
}

/* Risultati delle corse in provincia per i cavalli posseduti nella Stalla (carriera Fantino).
   Si azzerano a fine anno. Batteria+finale dello stesso cavallo nello stesso mese contano
   comunque come corse distinte ai fini statistici, ma la stanchezza (gestita altrove) +1 sola volta. */
function registraScoreCavalloFantino(risultato, eBatteria){
  if(!S.scoreCavalliFantino) S.scoreCavalliFantino = {};
  risultato.forEach((r,i)=>{
    const nome = r.cavallo.nome;
    if(!S.cavalliPosseduti || !S.cavalliPosseduti.includes(nome)) return;
    if(!S.scoreCavalliFantino[nome]) S.scoreCavalliFantino[nome] = {corse:0, batterieVinte:0, finaliVinte:0};
    S.scoreCavalliFantino[nome].corse++;
    if(i===0){
      if(eBatteria) S.scoreCavalliFantino[nome].batterieVinte++;
      else S.scoreCavalliFantino[nome].finaliVinte++;
    }
  });
}

function disputaBatteria(idx){
  if(!S || !S.corsaProvinciaMese) return;
  const corsa = S.corsaProvinciaMese;
  const b = corsa.batterie[idx];
  if(!b || b.completata) return;
  const pista = PISTE_PROVINCIA[corsa.pistaChiave];
  b.risultato = simulaGara(b.coppie, pista);
  b.completata = true;
  registraScoreGara(b.risultato, true);
  corsa.batteriaCorrente++;

  // Quando tutte le batterie sono completate si preparano i dati della finale,
  // ma si resta sulla schermata delle batterie (così si vedono anche i risultati
  // della 4ª batteria) finché il giocatore non clicca "Vai alla Finale".
  if(corsa.batterie.every(bb=>bb.completata) && !corsa.finale){
    const vincitori = corsa.batterie.map(bb=>bb.risultato[0]).map(r=>({fantino:r.fantino, cavallo:r.cavallo}));
    corsa.finale = { coppie:vincitori, risultato:null, completata:false };
  }
  salvaCorrente();
  renderSchermataCorse();
}

/* Passaggio esplicito dalla schermata delle batterie (con tutti i risultati visibili,
   inclusa la 4ª batteria) alla schermata della finale. */
function vaiAllaFinaleProvincia(){
  if(!S || !S.corsaProvinciaMese || !S.corsaProvinciaMese.finale) return;
  S.corsaProvinciaMese.faseAttuale = 'finale';
  salvaCorrente();
  renderSchermataCorse();
}

function disputaFinale(){
  if(!S || !S.corsaProvinciaMese || !S.corsaProvinciaMese.finale) return;
  const corsa = S.corsaProvinciaMese;
  const pista = PISTE_PROVINCIA[corsa.pistaChiave];
  corsa.finale.risultato = simulaGara(corsa.finale.coppie, pista);
  corsa.finale.completata = true;
  registraScoreGara(corsa.finale.risultato, false);
  salvaCorrente();
  renderSchermataCorse();
}

/* Passaggio esplicito dalla schermata della finale (con risultato visibile) alla
   schermata conclusiva del mese. */
function concludiCorseProvincia(){
  if(!S || !S.corsaProvinciaMese) return;
  S.corsaProvinciaMese.faseAttuale = 'conclusa';
  salvaCorrente();
  renderSchermataCorse();
}


/* ── Verifica automaticamente gli obiettivi di tipo 'azione'/'soglia' e assegna i premi ──
   Va chiamata dopo ogni azione che potrebbe far scattare un obiettivo. Gli obiettivi di
   tipo 'palio' (legati a un evento preciso: vittoria di Luglio/Agosto/cappotto) non hanno
   una funzione 'verificato' e vengono quindi ignorati qui: sono completati direttamente
   dal codice del sistema del Palio nel momento in cui l'evento si verifica. */
function verificaObiettivi(){
  if(!S) return;
  if(!S.obiettiviCompletati) S.obiettiviCompletati = {};
  const eFantino = S.tipo === 'fantino';
  const lista = eFantino ? OBIETTIVI_FANTINO : OBIETTIVI_CAPITANO;
  const campoPremio = eFantino ? 'fama' : 'prestigio';
  const nuoviCompletati = [];
  lista.forEach(ob=>{
    if(S.obiettiviCompletati[ob.id]) return; // già completato in passato
    if(typeof ob.verificato === 'function' && ob.verificato(S)){
      S.obiettiviCompletati[ob.id] = true;
      S[campoPremio] = (S[campoPremio]||0) + PREMIO_OBIETTIVO;
      S.log.push(`Obiettivo completato: "${ob.titolo}". +${PREMIO_OBIETTIVO} ${campoPremio==='fama'?'fama':'prestigio'}.`);
      nuoviCompletati.push(ob);
    }
  });
  if(nuoviCompletati.length){
    salvaCorrente();
    mostraPopupObiettiviCompletati(nuoviCompletati);
  }
}

function iniziaCarreraFantinoEsistente(idx){
  if(!_slotCorrente){ mostraPopupErrore('Errore','Nessuno slot selezionato. Riprova.'); return; }
  const db = FANTINI_DB;
  if(!db || !db[idx]){ mostraPopupErrore('Errore','Fantino non trovato nel database.'); return; }
  const fan = db[idx];

  // Recupera le statistiche dal DB (supporta sia i vecchi nomi che i nuovi)
  const bravura       = fan.bravura        ?? fan.velocita   ?? 1;
  const esperienza    = fan.esperienza      ?? fan.resistenza ?? 1;
  const gestioneMossa = fan.gestione_mossa  ?? fan.gestioneMossa ?? fan.equilibrio ?? 1;
  const empatia       = fan.empatia         ?? 1;

  const nome = fan.soprannome || fan.nome || 'Sconosciuto';

  // Intesa iniziale casuale (0–100) con ognuna delle 17 contrade
  const intesaContradeIniziale = {};
  CONTRADE.forEach(c=>{ intesaContradeIniziale[c.nome] = Math.floor(Math.random()*101); });
  normalizzaRivalitaIntesaContrade(intesaContradeIniziale);

  // Amicizia iniziale casuale (0–100) con ognuno dei fantini rivali del database (esclude se stesso)
  const amiciziaFantiniIniziale = {};
  if(typeof FANTINI_DB !== 'undefined'){
    FANTINI_DB.forEach((f,i)=>{ if(i !== idx) amiciziaFantiniIniziale[f.nome] = Math.floor(Math.random()*101); });
  }

  S = {
    tipo: 'fantino',
    sottotipo: 'esistente',
    nome,
    nomeCompleto: fan.nomeCompleto || fan.nome || nome,
    dbId: fan.id ?? idx,      // memorizza l'id così possiamo escluderlo dai rivali
    anno: ANNO,
    mese: 1, // 1=Gennaio ... 8=Agosto (mese del Palio, ultimo dell'annata)
    contrada: null,
    bravura,
    esperienza,
    gestioneMossa,
    empatia,
    fama: 10,
    oro: 2000,
    vittorie: 0,
    vittorieFinaliProvincia: 0,
    amiciziaFantini: amiciziaFantiniIniziale,
    amiciziaFantiniMese: 0,
    intesaContrade: intesaContradeIniziale,
    incontriContradeMese: 0,
    corsaProvinciaMese: null,
    corseProvinciaAnnullateMese: false,
    infortunatoMese: false,
    stelline: {},
    scoreCavalliFantino: {},
    statiCavalli: {},
    palioVintiCavalli: {},
    allenamentoMeseCavalli: {},
    cavalliEsclusiLotto: [],
    lottoDecisoMese: false,
    cavalliPosseduti: [],
    corsaProvinciaPartecipazioneMese: false,
    dirittoLuglio: ['Chiocciola','Pantera','Nicchio','Selva','Lupa','Istrice','Tartuca'],
    dirittoAgosto: ['Drago','Valdimontone','Pantera','Civetta','Tartuca','Leocorno','Bruco'],
    palioLuglioAnno: null,
    palioAgostoAnno: null,
    estrazionePalioInCorso: null,
    palioCorsi: 0,
    obiettiviCompletati: {},
    log: [`Inizio carriera nei panni di ${nome}. La leggenda continua sul tufo senese.`]
  };
  salvaCorrente();
  renderGiocoFantino();
}

/* ── Avanzamento del tempo (carriera Fantino): Gennaio → Agosto, poi nuovo anno.
   Stessa struttura della carriera Capitano, ma senza maniero, bonus di contrada,
   né cena della vigilia: qui contano solo fama, oro, vittorie ed i rapporti del fantino. ── */
function avanzaMeseFantino(){
  if(!S) return;

  // A fine Maggio (prima di entrare in Giugno) si estraggono le contrade del Palio di Luglio.
  // A fine Luglio (prima di entrare in Agosto) si estraggono quelle del Palio di Agosto.
  if(S.mese === 5 && !S.palioLuglioAnno){
    avviaEstrazionePalioFantino('luglio');
    return;
  }
  if(S.mese === 7 && !S.palioAgostoAnno){
    avviaEstrazionePalioFantino('agosto');
    return;
  }

  eseguiAvanzamentoMeseFantinoEffettivo();
}

function eseguiAvanzamentoMeseFantinoEffettivo(){
  let nuovoAnno = false;
  if(S.mese < MESI_CAPITANO.length){
    S.mese++;
    S.log.push(`Si entra nel mese di ${MESI_CAPITANO[S.mese-1]} ${S.anno}.`);
  } else {
    // Agosto era l'ultimo mese: si passa all'anno successivo, si riparte da Gennaio
    S.anno++;
    S.mese = 1;
    nuovoAnno = true;
    S.log.push(`L'annata si conclude. Inizia il nuovo anno: Gennaio ${S.anno}.`);
  }
  // Le corse in provincia annullate da un eventuale imprevisto valgono solo per il mese appena concluso
  S.corseProvinciaAnnullateMese = false;
  // Una nuova corsa in provincia è disponibile ogni mese
  S.corsaProvinciaMese = null;
  // L'infortunio impedisce di correre solo per il mese in cui si verifica
  S.infortunatoMese = false;
  // Il minigioco "Incontro" con una contrada si può fare al massimo 1 volta al mese
  S.incontriContradeMese = 0;
  // L'azione "Amicizia" con i fantini rivali si può fare al massimo 3 volte al mese
  S.amiciziaFantiniMese = 0;
  // La partecipazione del giocatore alla corsa in provincia è possibile una volta al mese
  S.corsaProvinciaPartecipazioneMese = false;
  // Stalla: la stanchezza dei cavalli posseduti cala di 1 ogni mese; l'allenamento e la
  // decisione sul lotto della corsa si possono ripetere ogni mese
  if(S.statiCavalli){
    Object.values(S.statiCavalli).forEach(st=>{ st.stanchezza = Math.max(0, st.stanchezza - 1); });
  }
  S.allenamentoMeseCavalli = {};
  S.lottoDecisoMese = false;
  S.cavalliEsclusiLotto = [];
  if(nuovoAnno){
    // I risultati delle corse in provincia dei cavalli posseduti si azzerano a fine anno
    S.scoreCavalliFantino = {};
    // S.scoreCavalliAnno tiene i risultati delle corse in provincia di TUTTI i cavalli
    // (non solo quelli posseduti dal giocatore): viene aggiornato anche nella carriera Fantino
    // (vedi registraScoreGara) e va quindi azzerato qui ad ogni cambio anno, altrimenti le
    // "corse disputate" mostrate nelle schermate Cavalli/Tratta continuano ad accumularsi.
    S.scoreCavalliAnno = {};
  }
  if(nuovoAnno){
    // I risultati del Palio di quest'annata sono ormai conclusi: si riparte daccapo per la prossima
    S.palioLuglioAnno = null;
    S.palioAgostoAnno = null;
  }

  const giornale = generaImprevistoMensileFantino();

  salvaCorrente();
  renderGiocoFantino();
  mostraPopupGiornaleSiena(giornale);
}

/* ═══════════════════════════════════════════════
   ESTRAZIONE DELLE CONTRADE PARTECIPANTI AL PALIO
   (carriera Fantino — stessa logica della carriera Capitano: 7 di diritto + 3 a sorte)
═══════════════════════════════════════════════ */
function avviaEstrazionePalioFantino(tipoPalio){
  if(!S) return;
  const dirittoCorrente = (tipoPalio==='luglio') ? S.dirittoLuglio : S.dirittoAgosto;
  const pool = CONTRADE.map(c=>c.nome).filter(n=>!dirittoCorrente.includes(n));

  S.estrazionePalioInCorso = {
    tipoPalio,
    anno: S.anno,
    diritto: dirittoCorrente.slice(),
    pool: pool,
    estratte: [],
    contesto: 'fantino' // distingue dal flusso capitano per sapere dove tornare a fine estrazione
  };
  salvaCorrente();
  renderEstrazionePalio();
}

/* Conclude l'estrazione per la carriera Fantino: fissa le 10 partecipanti, calcola il diritto
   per l'anno prossimo, e avanza il mese. Riusa la stessa schermata renderEstrazionePalio()/
   eseguiEstrazioneSingola() della carriera Capitano, perché la UI è identica. */
function completaEstrazionePalioFantino(){
  if(!S || !S.estrazionePalioInCorso) return;
  const est = S.estrazionePalioInCorso;
  if(est.estratte.length < 3) return;

  const partecipanti = est.diritto.concat(est.estratte);
  const risultato = {
    anno: est.anno,
    partecipanti,
    dirittoUsato: est.diritto.slice(),
    estratte: est.estratte.slice()
  };
  const nuovoDiritto = est.pool.slice();
  const nomePalio = est.tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';

  if(est.tipoPalio === 'luglio'){
    S.palioLuglioAnno = risultato;
    S.dirittoLuglio = nuovoDiritto;
    S.log.push(`Estrazione Palio di Luglio ${est.anno} completata. Partecipanti: ${partecipanti.join(', ')}.`);
  } else {
    S.palioAgostoAnno = risultato;
    S.dirittoAgosto = nuovoDiritto;
    S.log.push(`Estrazione Palio di Agosto ${est.anno} completata. Partecipanti: ${partecipanti.join(', ')}.`);
  }

  S.estrazionePalioInCorso = null;
  salvaCorrente();

  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🏇</div>
    <div class="popup-title">Le 10 contrade del Palio di ${nomePalio}</div>
    <div class="popup-body">
      Partecipano: <strong style="color:var(--ocra)">${partecipanti.join(', ')}</strong>.<br><br>
      Le altre 7 contrade diventano di diritto per il prossimo Palio di ${nomePalio}.
    </div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove();renderRapportiContrade()">Vai ai Rapporti con le Contrade</button>
  </div>`;
  R('APP').appendChild(ov);
}

/* ═══════════════════════════════════════════════
   IMPREVISTI MENSILI — "Giornale di Siena" (carriera Fantino)
   Mese tranquillo (70%) oppure uno dei seguenti imprevisti (30%, equiprobabili):
   - periodo no: bravura scende fino a 1
   - maltempo: corse in provincia annullate per il mese
   - infortunato: non si può correre questo mese
   - grande amicizia: amicizia con un fantino rivale → 100
   - nuovo nemico: amicizia con un fantino rivale → 0
   - litigio: intesa con una contrada → 0
   - grande accordo: intesa con una contrada → 100
   - dono gradito: +500 oro
   - multa: -300 oro
═══════════════════════════════════════════════ */
function fantinoRivaleCaso(){
  // Un fantino a caso dal database, diverso dal giocatore stesso (se "esistente")
  if(typeof FANTINI_DB === 'undefined' || !FANTINI_DB.length) return null;
  const candidati = FANTINI_DB.filter(f => f.nome !== S.nome);
  const pool = candidati.length ? candidati : FANTINI_DB;
  return pool[Math.floor(Math.random()*pool.length)].nome;
}

function contradaCaso(){
  return CONTRADE[Math.floor(Math.random()*CONTRADE.length)].nome;
}

function generaImprevistoMensileFantino(){
  const cEImprevisto = Math.random() < PROBABILITA_IMPREVISTI_FANTINO;

  if(!cEImprevisto){
    const A = contradaCaso();
    let B = contradaCaso();
    while(B===A) B = contradaCaso();
    const F = fantinoRivaleCaso() || 'un fantino';
    let frase = FRASI_MESE_TRANQUILLO_FANTINO[Math.floor(Math.random()*FRASI_MESE_TRANQUILLO_FANTINO.length)];
    frase = frase.replace('{A}',A).replace('{B}',B).replace('{F}',F);
    return { titolo:'Mese tranquillo', testo:frase };
  }

  const tipi = ['periodo_no','maltempo','infortunato','grande_amicizia','nuovo_nemico','litigio','grande_accordo','dono_gradito','multa'];
  const tipo = tipi[Math.floor(Math.random()*tipi.length)];

  switch(tipo){
    case 'periodo_no': {
      S.bravura = Math.max(1, S.bravura - 1);
      S.log.push(`Imprevisto: periodo no. Bravura scesa a ${S.bravura}.`);
      return { titolo:'Periodo no', testo:'Una serie di prove deludenti ha minato la sicurezza in sella: la tua <strong style="color:var(--ross)">Bravura diminuisce</strong>.' };
    }
    case 'maltempo': {
      S.corseProvinciaAnnullateMese = true;
      S.log.push('Imprevisto: maltempo. Le corse in provincia di questo mese sono annullate.');
      return { titolo:'Maltempo', testo:'Piogge incessanti hanno reso impraticabili i tufi dei paesi vicini: tutte le corse in provincia di questo mese sono state annullate.' };
    }
    case 'infortunato': {
      S.infortunatoMese = true;
      S.log.push('Imprevisto: infortunio. Questo mese non puoi correre.');
      return { titolo:'Infortunato', testo:'Una caduta in allenamento ti ha lasciato acciaccato: <strong style="color:var(--ross)">questo mese non potrai correre</strong>.' };
    }
    case 'grande_amicizia': {
      const F = fantinoRivaleCaso();
      if(F){
        if(!S.amiciziaFantini) S.amiciziaFantini = {};
        S.amiciziaFantini[F] = 100;
        S.log.push(`Imprevisto: grande amicizia con ${F}. Amicizia portata a 100.`);
        return { titolo:'Grande amicizia', testo:`Una sincera intesa fuori pista ti ha legato al fantino <strong style="color:var(--ocra)">${F}</strong>: l'amicizia con lui sale a <strong style="color:var(--verde)">100</strong>.` };
      }
      return { titolo:'Mese tranquillo', testo:'La vita in piazza scorre tranquilla.' };
    }
    case 'nuovo_nemico': {
      const F = fantinoRivaleCaso();
      if(F){
        if(!S.amiciziaFantini) S.amiciziaFantini = {};
        S.amiciziaFantini[F] = 0;
        S.log.push(`Imprevisto: nuovo nemico, ${F}. Amicizia portata a 0.`);
        return { titolo:'Nuovo nemico', testo:`Un diverbio acceso ha rotto ogni rapporto con il fantino <strong style="color:var(--ocra)">${F}</strong>: l'amicizia con lui scende a <strong style="color:var(--ross)">0</strong>.` };
      }
      return { titolo:'Mese tranquillo', testo:'La vita in piazza scorre tranquilla.' };
    }
    case 'litigio': {
      const C = contradaCaso();
      if(!S.intesaContrade) S.intesaContrade = {};
      S.intesaContrade[C] = 0;
      S.log.push(`Imprevisto: litigio con la Contrada del ${C}. Intesa azzerata.`);
      return { titolo:'Litigio', testo:`Un litigio con i dirigenti della Contrada del <strong style="color:var(--ocra)">${C}</strong> ha fatto crollare ogni rapporto: l'intesa scende a <strong style="color:var(--ross)">0</strong>.` };
    }
    case 'grande_accordo': {
      const C = contradaCaso();
      if(!S.intesaContrade) S.intesaContrade = {};
      S.intesaContrade[C] = 100;
      applicaRivalitaIntesaContrada(C);
      S.log.push(`Imprevisto: grande accordo con la Contrada del ${C}. Intesa portata a 100.`);
      return { titolo:'Grande accordo', testo:`Un\'intesa perfetta con i dirigenti della Contrada del <strong style="color:var(--ocra)">${C}</strong> porta i rapporti al massimo: intesa a <strong style="color:var(--verde)">100</strong>.` };
    }
    case 'dono_gradito': {
      S.oro += 500;
      S.log.push('Imprevisto: dono gradito. +500 oro.');
      return { titolo:'Dono gradito', testo:'Un ammiratore anonimo ti ha fatto recapitare un dono inaspettato: <strong style="color:var(--verde)">+500 oro</strong> nelle tue tasche.' };
    }
    case 'multa': {
      S.oro = Math.max(0, S.oro - 300);
      S.log.push('Imprevisto: multa. -300 oro.');
      return { titolo:'Multa', testo:'Un\'infrazione commessa in allenamento ti è costata una sanzione: <strong style="color:var(--ross)">-300 oro</strong>.' };
    }
  }
  return { titolo:'Mese tranquillo', testo:'La vita in piazza scorre tranquilla.' };
}

/* ═══════════════════════════════════════════════
   RAPPORTI CON LE CONTRADE (carriera Fantino)
   17 contrade, ognuna con un'intesa 0–100 (iniziale casuale).
   Azioni: "Incontra" (minigioco Forza 4, gratis, max 1 al mese, ±15 intesa)
           "Accordo" (300 oro, +10 intesa, sempre disponibile)
   Se la contrada partecipa al Palio dell'anno in corso (Luglio o Agosto,
   dopo l'estrazione) compare l'etichetta "Partecipa al Palio", che sparisce
   non appena quel Palio è concluso (palioLuglioAnno/palioAgostoAnno → null
   al cambio d'anno).
═══════════════════════════════════════════════ */
const COSTO_ACCORDO_FANTINO = 1500;
const BONUS_ACCORDO_FANTINO = 10;
const BONUS_INCONTRO_VITTORIA = 15;
const MALUS_INCONTRO_SCONFITTA = 15;
const SOGLIA_RIVALITA_INTESA = 85;

/* ── Regola di rivalità tra le contrade (Carriera Fantino) ──
   Se l'intesa con una contrada raggiunge 85 o più, l'intesa con la sua
   contrada rivale storica (presa da RAPPORTI_CONTRADE, la stessa mappa usata
   a inizio Carriera Capitano) crolla immediatamente a 0. Finché l'intesa con
   la prima contrada resta a 85 o più, non è possibile alzare l'intesa con la
   rivale: i relativi tasti "Incontra" e "Accordo" restano disattivati. */
function applicaRivalitaIntesaContrada(nomeContrada){
  if(!S || !S.intesaContrade || !nomeContrada) return;
  const rapporto = RAPPORTI_CONTRADE[nomeContrada];
  if(!rapporto || !rapporto.rivali.length) return;
  const valore = (S.intesaContrade[nomeContrada] !== undefined) ? S.intesaContrade[nomeContrada] : 50;
  if(valore >= SOGLIA_RIVALITA_INTESA){
    rapporto.rivali.forEach(nomeRivale=>{
      S.intesaContrade[nomeRivale] = 0;
    });
  }
}

/* Versione "bulk": scansiona un intero oggetto intesa (o S.intesaContrade se non
   viene passato nulla) e azzera tutte le rivali di ogni contrada già a 85+.
   Usata sia all'inizializzazione di una nuova Carriera Fantino (dove l'intesa
   di partenza è casuale e potrebbe già superare la soglia) sia come rete di
   sicurezza ad ogni apertura della schermata "Rapporti con le Contrade", così
   la regola resta valida anche su partite salvate prima di questa modifica. */
function normalizzaRivalitaIntesaContrade(oggettoIntesa){
  const intesa = oggettoIntesa || (S && S.intesaContrade);
  if(!intesa) return;
  Object.keys(RAPPORTI_CONTRADE).forEach(nome=>{
    const rapporto = RAPPORTI_CONTRADE[nome];
    if(!rapporto || !rapporto.rivali.length) return;
    const valore = (intesa[nome] !== undefined) ? intesa[nome] : 50;
    if(valore >= SOGLIA_RIVALITA_INTESA){
      rapporto.rivali.forEach(nomeRivale=>{ intesa[nomeRivale] = 0; });
    }
  });
}

/* Restituisce l'elenco delle contrade che, avendo intesa >=85 con il giocatore,
   bloccano l'aumento dell'intesa con nomeContrada perché ne è storicamente rivale. */
function contradeCheBloccanoIntesa(nomeContrada){
  if(!S || !S.intesaContrade || !nomeContrada) return [];
  return Object.keys(RAPPORTI_CONTRADE).filter(nome=>{
    const r = RAPPORTI_CONTRADE[nome];
    if(!r || !r.rivali.includes(nomeContrada)) return false;
    const v = (S.intesaContrade[nome] !== undefined) ? S.intesaContrade[nome] : 50;
    return v >= SOGLIA_RIVALITA_INTESA;
  });
}

function contradePartecipantiPalioFantino(nomeContrada){
  const etichette = [];
  // L'etichetta compare solo finché quel Palio non si è ancora concluso (vedi flag "concluso"
  // impostato in renderVincitorePalioFantino): appena la Carriera è corsa sparisce subito,
  // senza aspettare il cambio d'anno, così non si confonde con quella del Palio successivo.
  if(S.palioLuglioAnno && !S.palioLuglioAnno.concluso && S.palioLuglioAnno.partecipanti.includes(nomeContrada)) etichette.push('Luglio');
  if(S.palioAgostoAnno && !S.palioAgostoAnno.concluso && S.palioAgostoAnno.partecipanti.includes(nomeContrada)) etichette.push('Agosto');
  return etichette;
}

function renderRapportiContrade(){
  if(!S) return;
  if(!S.intesaContrade) S.intesaContrade = {};
  if(S.incontriContradeMese === undefined) S.incontriContradeMese = 0;
  normalizzaRivalitaIntesaContrade();

  const righeHtml = CONTRADE.map(c=>{
    const valore = (S.intesaContrade[c.nome] !== undefined) ? S.intesaContrade[c.nome] : 50;
    const colore = coloreBarraAmicizia(valore);
    const palio = contradePartecipantiPalioFantino(c.nome);
    const tagPalio = palio.length
      ? `<span style="color:var(--verde);font-weight:700;font-size:10px;margin-left:6px">🏇 Partecipa al Palio${palio.length>1?` (${palio.join(' e ')})`:''}</span>`
      : '';
    const bloccanti = contradeCheBloccanoIntesa(c.nome);
    const bloccata = bloccanti.length > 0;
    const tagRivalita = bloccata
      ? `<div style="font-family:var(--fn);font-size:10px;color:var(--ross);font-weight:700;margin-bottom:8px">⛔ Rivalità: l'intesa con ${bloccanti.join(', ')} è a ${SOGLIA_RIVALITA_INTESA}+, i rapporti con ${c.nome} sono bloccati a 0</div>`
      : '';
    const incontraDisabilitato = (S.incontriContradeMese>=1) || bloccata;
    return `
    <div class="card" style="margin-bottom:10px;padding:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <img src="${IMG_BASE}${c.img}" alt="${c.nome}"
             style="width:34px;height:34px;object-fit:contain;border-radius:4px;background:rgba(0,0,0,.2);border:var(--bord);flex-shrink:0"
             onerror="this.style.opacity='.15'">
        <div style="flex:1">
          <div style="font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ocra-l)">${c.nome}${tagPalio}</div>
        </div>
        <div style="font-family:var(--fn);font-size:12px;color:rgba(200,153,30,.55);font-weight:700">${valore}</div>
      </div>
      <div style="width:100%;height:8px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid rgba(200,153,30,.15);margin-bottom:10px">
        <div style="height:100%;width:${valore}%;background:${colore};border-radius:5px;transition:width .2s"></div>
      </div>
      ${tagRivalita}
      <div style="display:flex;gap:8px">
        <button class="btn w" style="flex:1;margin-top:0;font-size:12px;padding:9px 6px;${incontraDisabilitato?'opacity:.35':''}" ${incontraDisabilitato?'disabled':''} onclick="avviaIncontroContrada('${escJs(c.nome)}')">
          🎲 Incontra
        </button>
        <button class="btn gold w" style="flex:1;margin-top:0;font-size:12px;padding:9px 6px;${bloccata?'opacity:.35':''}" ${bloccata?'disabled':''} onclick="confermaAccordoContradaFantino('${escJs(c.nome)}')">
          🤝 Accordo
        </button>
      </div>
    </div>`;
  }).join('');

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderGiocoFantino()">‹</button>
      <span class="hdr-title">Rapporti con le Contrade</span>
      <span class="hdr-right" style="font-size:10px">💰 ${S.oro}<br><span style="color:rgba(200,153,30,.38)">${MESI_CAPITANO[S.mese-1]} ${S.anno}</span></span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🏛️ Le 17 Contrade</div>
      <div class="screen-sub">${S.incontriContradeMese>=1 ? 'Hai già incontrato una contrada questo mese.' : 'Puoi incontrare gratuitamente una contrada al mese, oppure stringere un accordo a pagamento.'}</div>
      ${righeHtml}
    </div>
  </div>
  `);
}

/* ── Accordo: 300 oro per +10 di intesa, sempre disponibile (nessun limite mensile) ── */
function confermaAccordoContradaFantino(nomeContrada){
  if(!S) return;
  const bloccanti = contradeCheBloccanoIntesa(nomeContrada);
  if(bloccanti.length){
    mostraPopupErrore('Rivalità in corso', `L'intesa con ${bloccanti.join(', ')} è a ${SOGLIA_RIVALITA_INTESA} o più: i rapporti con la Contrada del ${nomeContrada}, sua rivale storica, restano bloccati a 0.`);
    return;
  }
  if(S.oro < COSTO_ACCORDO_FANTINO){
    mostraPopupErrore('Oro insufficiente', `Per stringere un accordo servono ${COSTO_ACCORDO_FANTINO} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🤝</div>
    <div class="popup-title">Confermi l'accordo?</div>
    <div class="popup-body">Pagherai <strong style="color:var(--ocra)">${COSTO_ACCORDO_FANTINO} oro</strong> per ottenere <strong style="color:var(--ocra)">+${BONUS_ACCORDO_FANTINO}</strong> di intesa con la Contrada del <strong style="color:var(--ocra)">${nomeContrada}</strong>.</div>
    <div style="display:flex;gap:8px">
      <button class="btn w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove()">Annulla</button>
      <button class="btn gold w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove();eseguiAccordoContradaFantino('${escJs(nomeContrada)}')">Conferma</button>
    </div>
  </div>`;
  R('APP').appendChild(ov);
}

function eseguiAccordoContradaFantino(nomeContrada){
  if(!S) return;
  S.oro -= COSTO_ACCORDO_FANTINO;
  if(!S.intesaContrade) S.intesaContrade = {};
  const attuale = (S.intesaContrade[nomeContrada] !== undefined) ? S.intesaContrade[nomeContrada] : 50;
  S.intesaContrade[nomeContrada] = Math.min(100, attuale + BONUS_ACCORDO_FANTINO);
  applicaRivalitaIntesaContrada(nomeContrada);
  S.log.push(`Accordo con la Contrada del ${nomeContrada}: -${COSTO_ACCORDO_FANTINO} oro, +${BONUS_ACCORDO_FANTINO} intesa (ora ${S.intesaContrade[nomeContrada]}).`);
  verificaObiettivi();
  salvaCorrente();
  renderRapportiContrade();
}

/* ═══════════════════════════════════════════════
   MINIGIOCO "INCONTRA" — Forza 4 contro il gioco
   Griglia 7 colonne × 6 righe. Giocatore = 🔴, gioco (IA) = 🟡.
   Vittoria → intesa +15. Sconfitta (o pareggio) → intesa −15.
   Disponibile gratis, massimo 1 volta al mese per contrada/giornata.
═══════════════════════════════════════════════ */
const F4_COLONNE = 7;
const F4_RIGHE = 6;

function avviaIncontroContrada(nomeContrada){
  if(!S) return;
  const bloccanti = contradeCheBloccanoIntesa(nomeContrada);
  if(bloccanti.length){
    mostraPopupErrore('Rivalità in corso', `L'intesa con ${bloccanti.join(', ')} è a ${SOGLIA_RIVALITA_INTESA} o più: i rapporti con la Contrada del ${nomeContrada}, sua rivale storica, restano bloccati a 0.`);
    return;
  }
  if(S.incontriContradeMese === undefined) S.incontriContradeMese = 0;
  if(S.incontriContradeMese >= 1){
    mostraPopupErrore('Incontro già fatto', 'Hai già incontrato una contrada questo mese. Riprova il mese prossimo.');
    return;
  }
  // Griglia vuota: array di colonne, ogni colonna è uno stack dal basso verso l'alto
  const griglia = [];
  for(let col=0; col<F4_COLONNE; col++) griglia.push([]);
  window._forza4State = {
    nomeContrada,
    griglia,           // griglia[colonna] = array di 'P' (player) o 'C' (computer), index 0 = riga più bassa
    turno: 'P',        // 'P' = giocatore, 'C' = computer
    finita: false,
    vincitore: null    // 'P', 'C', o 'pareggio'
  };
  renderIncontroContrada();
}

function renderIncontroContrada(){
  if(!S || !window._forza4State) return;
  const st = window._forza4State;

  // Costruisce la griglia visuale, riga più alta in cima
  let righeHtml = '';
  for(let riga=F4_RIGHE-1; riga>=0; riga--){
    let celleHtml = '';
    for(let col=0; col<F4_COLONNE; col++){
      const cella = st.griglia[col][riga];
      const simbolo = cella==='P' ? '🔴' : cella==='C' ? '🟡' : '';
      celleHtml += `<div style="width:12.6%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(200,153,30,.18);display:flex;align-items:center;justify-content:center;font-size:13px">${simbolo}</div>`;
    }
    righeHtml += `<div style="display:flex;gap:2px;margin-bottom:2px">${celleHtml}</div>`;
  }

  const colonnePieneHtml = Array.from({length:F4_COLONNE}, (_,col)=>{
    const piena = st.griglia[col].length >= F4_RIGHE;
    const disabilitato = piena || st.finita || st.turno!=='P';
    return `<button onclick="giocaColonnaForza4(${col})" ${disabilitato?'disabled':''}
      style="flex:1;height:24px;border-radius:5px;background:rgba(200,153,30,.08);border:1px solid rgba(200,153,30,.25);cursor:pointer;color:var(--ocra-l);font-size:12px;opacity:${disabilitato?'.3':'1'}">▼</button>`;
  }).join('');

  let messaggio;
  if(st.finita){
    messaggio = st.vincitore==='P' ? '🔴 Hai vinto!' : st.vincitore==='C' ? '🟡 Hai perso.' : 'Pareggio.';
  } else {
    messaggio = st.turno==='P' ? 'Tocca a te: scegli una colonna.' : "Il rivale sta pensando...";
  }

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="annullaIncontroContrada()">‹</button>
      <span class="hdr-title">Incontro · ${st.nomeContrada}</span>
      <span class="hdr-right" style="font-size:10px">💰 ${S.oro}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🎲 Forza 4</div>
      <div class="screen-sub">${messaggio}</div>
      <div class="card" style="padding:10px">
        <div style="max-width:240px;margin:0 auto">
          <div style="display:flex;gap:2px;margin-bottom:5px">${colonnePieneHtml}</div>
          ${righeHtml}
        </div>
      </div>
    </div>
  </div>
  `);
}

function giocaColonnaForza4(col){
  if(!S || !window._forza4State) return;
  const st = window._forza4State;
  if(st.finita || st.turno!=='P') return;
  if(st.griglia[col].length >= F4_RIGHE) return;

  st.griglia[col].push('P');
  if(verificaVittoriaForza4(st.griglia, col, st.griglia[col].length-1, 'P')){
    st.finita = true; st.vincitore = 'P';
    renderIncontroContrada();
    setTimeout(()=>concludiIncontroContrada(), 900);
    return;
  }
  if(grigliaCompletaForza4(st.griglia)){
    st.finita = true; st.vincitore = 'pareggio';
    renderIncontroContrada();
    setTimeout(()=>concludiIncontroContrada(), 900);
    return;
  }

  st.turno = 'C';
  renderIncontroContrada();
  setTimeout(()=>mossaComputerForza4(), 600);
}

function mossaComputerForza4(){
  if(!S || !window._forza4State) return;
  const st = window._forza4State;
  if(st.finita) return;

  const colScelta = scegliColonnaIAForza4(st.griglia);
  st.griglia[colScelta].push('C');
  const riga = st.griglia[colScelta].length - 1;

  if(verificaVittoriaForza4(st.griglia, colScelta, riga, 'C')){
    st.finita = true; st.vincitore = 'C';
    renderIncontroContrada();
    setTimeout(()=>concludiIncontroContrada(), 900);
    return;
  }
  if(grigliaCompletaForza4(st.griglia)){
    st.finita = true; st.vincitore = 'pareggio';
    renderIncontroContrada();
    setTimeout(()=>concludiIncontroContrada(), 900);
    return;
  }

  st.turno = 'P';
  renderIncontroContrada();
}

/* IA depotenziata: 1) vince se può (non rinuncia mai a una vittoria a portata di mano),
   2) con probabilità F4_PROB_MOSSA_CASUALE gioca però una colonna casuale invece di
   blocco/strategia ottimale, così il giocatore ha reali possibilità di vincere (circa
   metà delle partite) invece di perdere sempre; 3) altrimenti blocca la vittoria del
   giocatore se imminente, 4) altrimenti esplora l'albero delle mosse con minimax +
   potatura alpha-beta (alcune mosse in avanti, con euristica di valutazione della
   griglia) per giocare in modo strategico invece che solo reattivo. */
const F4_PROFONDITA = 5;
const F4_PROB_MOSSA_CASUALE = 0.5;

function scegliColonnaIAForza4(griglia){
  const colonneDisponibili = [];
  for(let col=0; col<F4_COLONNE; col++) if(griglia[col].length < F4_RIGHE) colonneDisponibili.push(col);
  if(!colonneDisponibili.length) return null;

  // 1) Mossa vincente immediata
  for(const col of colonneDisponibili){
    const rigaSim = griglia[col].length;
    if(verificaVittoriaForza4(griglia, col, rigaSim, 'C', true)) return col;
  }

  // 2) Depotenziamento: a volte l'IA non gioca in modo ottimale e sceglie una colonna
  // casuale, ignorando sia il blocco che la strategia.
  if(Math.random() < F4_PROB_MOSSA_CASUALE){
    return colonneDisponibili[Math.floor(Math.random()*colonneDisponibili.length)];
  }

  // 3) Blocca la vittoria imminente del giocatore
  for(const col of colonneDisponibili){
    const rigaSim = griglia[col].length;
    if(verificaVittoriaForza4(griglia, col, rigaSim, 'P', true)) return col;
  }

  // 4) Ricerca minimax con potatura alpha-beta
  const ordinePreferenza = [3,2,4,1,5,0,6].filter(c=>colonneDisponibili.includes(c));
  let bestScore = -Infinity;
  let bestCols = [];
  let alpha = -Infinity, beta = Infinity;
  for(const col of ordinePreferenza){
    griglia[col].push('C');
    const riga = griglia[col].length-1;
    const score = minimaxForza4(griglia, col, riga, 'C', F4_PROFONDITA-1, alpha, beta, false);
    griglia[col].pop();
    if(score > bestScore){ bestScore = score; bestCols = [col]; }
    else if(score === bestScore) bestCols.push(col);
    alpha = Math.max(alpha, bestScore);
  }
  return bestCols[Math.floor(Math.random()*bestCols.length)];
}

/* Minimax con potatura alpha-beta. griglia viene modificata temporaneamente durante la
   ricorsione (push/pop) per evitare copie costose della struttura dati. */
function minimaxForza4(griglia, ultimaCol, ultimaRiga, ultimoSimbolo, depth, alpha, beta, isMaximizing){
  if(ultimaCol !== null && verificaVittoriaForza4(griglia, ultimaCol, ultimaRiga, ultimoSimbolo)){
    return ultimoSimbolo==='C' ? (100000 + depth) : (-100000 - depth);
  }
  const colonneDisponibili = [];
  for(let col=0; col<F4_COLONNE; col++) if(griglia[col].length < F4_RIGHE) colonneDisponibili.push(col);
  if(!colonneDisponibili.length || depth===0){
    return valutaGrigliaForza4(griglia);
  }

  const ordinePreferenza = [3,2,4,1,5,0,6].filter(c=>colonneDisponibili.includes(c));

  if(isMaximizing){
    let best = -Infinity;
    for(const col of ordinePreferenza){
      griglia[col].push('C');
      const riga = griglia[col].length-1;
      const score = minimaxForza4(griglia, col, riga, 'C', depth-1, alpha, beta, false);
      griglia[col].pop();
      if(score > best) best = score;
      if(best > alpha) alpha = best;
      if(alpha >= beta) break;
    }
    return best;
  } else {
    let best = Infinity;
    for(const col of ordinePreferenza){
      griglia[col].push('P');
      const riga = griglia[col].length-1;
      const score = minimaxForza4(griglia, col, riga, 'P', depth-1, alpha, beta, true);
      griglia[col].pop();
      if(score < best) best = score;
      if(best < beta) beta = best;
      if(alpha >= beta) break;
    }
    return best;
  }
}

/* Euristica di valutazione della griglia per il minimax: assegna un punteggio a ogni
   possibile "finestra" di 4 celle (orizzontale, verticale, diagonale) in base a quanti
   pezzi del computer o del giocatore contiene, più un bonus per il controllo della
   colonna centrale (statisticamente la più forte a Forza 4). */
function valutaGrigliaForza4(griglia){
  const get = (c,r) => griglia[c][r] || null;
  let punteggio = 0;

  const centro = 3;
  for(let r=0; r<F4_RIGHE; r++){
    if(griglia[centro][r]==='C') punteggio += 3;
    else if(griglia[centro][r]==='P') punteggio -= 3;
  }

  function valutaFinestra(cells){
    let c=0, p=0;
    for(const v of cells){ if(v==='C') c++; else if(v==='P') p++; }
    if(c>0 && p>0) return 0;
    if(c===4) return 100000;
    if(c===3) return 50;
    if(c===2) return 10;
    if(c===1) return 1;
    if(p===4) return -100000;
    if(p===3) return -50;
    if(p===2) return -10;
    if(p===1) return -1;
    return 0;
  }

  for(let r=0; r<F4_RIGHE; r++){
    for(let c=0; c<=F4_COLONNE-4; c++){
      punteggio += valutaFinestra([get(c,r),get(c+1,r),get(c+2,r),get(c+3,r)]);
    }
  }
  for(let c=0; c<F4_COLONNE; c++){
    for(let r=0; r<=F4_RIGHE-4; r++){
      punteggio += valutaFinestra([get(c,r),get(c,r+1),get(c,r+2),get(c,r+3)]);
    }
  }
  for(let c=0; c<=F4_COLONNE-4; c++){
    for(let r=0; r<=F4_RIGHE-4; r++){
      punteggio += valutaFinestra([get(c,r),get(c+1,r+1),get(c+2,r+2),get(c+3,r+3)]);
    }
  }
  for(let c=0; c<=F4_COLONNE-4; c++){
    for(let r=3; r<F4_RIGHE; r++){
      punteggio += valutaFinestra([get(c,r),get(c+1,r-1),get(c+2,r-2),get(c+3,r-3)]);
    }
  }
  return punteggio;
}

/* Verifica se piazzare 'simbolo' in (col,riga) crea un 4 in linea.
   Se simulato=true, prima inserisce temporaneamente il pezzo, controlla, poi lo rimuove
   (usato dall'IA per valutare mosse senza alterare la griglia reale). */
function verificaVittoriaForza4(griglia, col, riga, simbolo, simulato){
  if(simulato){
    griglia[col].push(simbolo);
    const esito = verificaVittoriaForza4(griglia, col, griglia[col].length-1, simbolo, false);
    griglia[col].pop();
    return esito;
  }
  if(griglia[col][riga] !== simbolo) return false;

  const direzioni = [[1,0],[0,1],[1,1],[1,-1]];
  for(const [dCol,dRiga] of direzioni){
    let conta = 1;
    let c = col+dCol, r = riga+dRiga;
    while(c>=0 && c<F4_COLONNE && r>=0 && r<F4_RIGHE && griglia[c][r]===simbolo){ conta++; c+=dCol; r+=dRiga; }
    c = col-dCol; r = riga-dRiga;
    while(c>=0 && c<F4_COLONNE && r>=0 && r<F4_RIGHE && griglia[c][r]===simbolo){ conta++; c-=dCol; r-=dRiga; }
    if(conta >= 4) return true;
  }
  return false;
}

function grigliaCompletaForza4(griglia){
  return griglia.every(colonna => colonna.length >= F4_RIGHE);
}

  </div>`;
  R('APP').appendChild(ov);
}

/* ── Amicizia: 100 oro per +10 amicizia con un fantino rivale, max 3 volte al mese ── */
function eseguiAmiciziaFantinoRivale(nomeFantino){
  if(!S) return;
  if(S.amiciziaFantiniMese === undefined) S.amiciziaFantiniMese = 0;
  if(S.amiciziaFantiniMese >= MAX_AMICIZIA_FANTINI_MESE){
    mostraPopupErrore('Limite raggiunto', `Puoi fare amicizia con al massimo ${MAX_AMICIZIA_FANTINI_MESE} fantini al mese. Riprova il mese prossimo.`);
    return;
  }
  if(S.oro < COSTO_AMICIZIA_FANTINO_RIVALE){
    mostraPopupErrore('Oro insufficiente', `L'azione "Amicizia" costa ${COSTO_AMICIZIA_FANTINO_RIVALE} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  if(!S.amiciziaFantini) S.amiciziaFantini = {};

  S.oro -= COSTO_AMICIZIA_FANTINO_RIVALE;
  const attuale = (S.amiciziaFantini[nomeFantino] !== undefined) ? S.amiciziaFantini[nomeFantino] : 50;
  S.amiciziaFantini[nomeFantino] = Math.min(100, attuale + BONUS_AMICIZIA_FANTINO_RIVALE);
  S.amiciziaFantiniMese++;
  S.log.push(`Amicizia con ${nomeFantino}: -${COSTO_AMICIZIA_FANTINO_RIVALE} oro, +${BONUS_AMICIZIA_FANTINO_RIVALE} amicizia (ora ${S.amiciziaFantini[nomeFantino]}).`);
  verificaObiettivi();
  salvaCorrente();
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🤝</div>
    <div class="popup-title">Amicizia rinsaldata</div>
    <div class="popup-body">Hai trascorso del tempo con <strong style="color:var(--ocra)">${nomeFantino}</strong>.<br><br>Spesa: <strong style="color:var(--ross)">-${COSTO_AMICIZIA_FANTINO_RIVALE} oro</strong><br>Amicizia: <strong style="color:var(--verde)">+${BONUS_AMICIZIA_FANTINO_RIVALE}</strong> (ora ${S.amiciziaFantini[nomeFantino]})</div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove();renderFantiniRivali()">Capito</button>
  </div>`;
  R('APP').appendChild(ov);
}
