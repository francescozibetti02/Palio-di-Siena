<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Nome dell'applicazione per la schermata Home -->
<meta name="apple-mobile-web-app-title" content="Palio di Siena">
<meta name="application-name" content="Palio di Siena">

<!-- Icona per iPhone / iPad -->
<link rel="apple-touch-icon" sizes="180x180" href="icona.png">

<!-- Icona/Favicon generica per Android e Browser -->
<link rel="icon" type="image/png" sizes="32x32" href="icona.png">
<link rel="icon" type="image/png" sizes="16x16" href="icona.png">

<!-- File Web App Manifest (fondamentale per Android e Chrome) -->
<link rel="manifest" href="manifest.json">

<!-- Colore della barra di stato sui telefoni -->
<meta name="theme-color" content="#8b263e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Palio di Siena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
:root{
  /* Palette medievale senese:
     Mattone brunito, ocra calda, pergamena invecchiata,
     verde bosco, blu oltremare quattrocentesco */
  --mat:#1A0A04;        /* mattone scurissimo — sfondo */
  --mat2:#2C1208;       /* mattone medio */
  --mat3:#3D1A0C;       /* mattone chiaro — card */
  --ocra:#C8991E;       /* ocra senese calda */
  --ocra-l:#E2C97E;     /* ocra chiara / testo */
  --ocra-d:#7A5A08;     /* ocra scura */
  --perg:#EDE0C0;       /* pergamena */
  --perg2:#C9B98A;      /* pergamena scura */
  --ross:#8B1A00;       /* rosso mattone */
  --ross2:#5C0F00;
  --verde:#2E5C1A;      /* verde quattrocentesco */
  --az:#1A3060;         /* azzurro oltremare */
  --bord:1px solid rgba(200,153,30,.20);
  --bord2:1px solid rgba(200,153,30,.48);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  --fs:"Georgia","Times New Roman",serif;
  --fn:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
html,body{height:100%;overflow:hidden;background:#110602;overscroll-behavior:none}
body{font-family:var(--fs)}

.app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  padding-top:var(--st);padding-bottom:var(--sb);
  padding-left:var(--sl);padding-right:var(--sr);
  background:var(--mat);color:var(--perg);
  display:flex;flex-direction:column;overflow:hidden
}
/* Texture pergamena: trama a spina di pesce medievale */
.app::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(60deg,transparent,transparent 22px,rgba(200,153,30,.025) 22px,rgba(200,153,30,.025) 23px),
    repeating-linear-gradient(-60deg,transparent,transparent 22px,rgba(200,153,30,.025) 22px,rgba(200,153,30,.025) 23px),
    repeating-linear-gradient(0deg,transparent,transparent 44px,rgba(200,153,30,.015) 44px,rgba(200,153,30,.015) 45px)
}

.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.main::-webkit-scrollbar{display:none}
.pad{padding:16px 14px 36px}

/* ══════════════════
   HOME
══════════════════ */
.home-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:0 16px 32px;min-height:100%
}

/* Stemma: cavallerizzo — cerchio pergamena su mattone */
.stemma{
  width:96px;height:96px;margin:0 auto 8px;
  border-radius:50%;
  background:radial-gradient(circle at 42% 38%,#3D1A0C,#1A0A04);
  border:2px solid var(--ocra);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(200,153,30,.22),inset 0 0 20px rgba(200,153,30,.07);
  position:relative;overflow:hidden
}
.stemma::after{
  content:"";position:absolute;inset:6px;border-radius:50%;
  border:1px solid rgba(200,153,30,.28)
}
/* Anello interno decorativo */
.stemma::before{
  content:"";position:absolute;inset:12px;border-radius:50%;
  border:1px dashed rgba(200,153,30,.14)
}
.stemma-icon{font-size:42px;line-height:1;position:relative;z-index:1}

.home-title{
  font-family:var(--fs);font-size:31px;font-weight:700;
  color:var(--ocra);text-align:center;letter-spacing:.5px;
  line-height:1.1;margin-bottom:3px;
  text-shadow:0 2px 20px rgba(200,153,30,.28)
}
.home-anno{
  font-family:var(--fn);font-size:10px;
  color:var(--ocra-l);letter-spacing:3.5px;text-align:center;
  margin-bottom:16px;text-transform:uppercase;opacity:.7
}

.divider{
  width:100%;display:flex;align-items:center;gap:8px;margin:4px 0 16px
}
.divider::before,.divider::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,153,30,.32),transparent)
}
.divider-gem{font-size:9px;color:rgba(200,153,30,.42);letter-spacing:2px}

.home-section-label{
  font-family:var(--fn);font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:rgba(200,153,30,.38);
  align-self:flex-start;margin-bottom:8px
}

/* Bottoni carriera grandi */
.career-btn{
  width:100%;
  background:linear-gradient(160deg,#2C1208,#1A0A04);
  border:var(--bord2);border-radius:13px;
  padding:16px 14px;margin-bottom:10px;
  cursor:pointer;text-align:left;position:relative;overflow:hidden;
  -webkit-appearance:none;transition:opacity .12s
}
.career-btn::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,153,30,.45),transparent)
}
/* Fascia laterale colorata — araldica */
.career-btn::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ocra-d),var(--ocra),var(--ocra-d))
}
.career-btn:active{opacity:.72}
.career-btn-inner{display:flex;align-items:center;gap:12px}
.career-btn-icon{font-size:30px;flex-shrink:0;padding-left:4px}
.career-btn-title{
  font-family:var(--fn);font-size:15px;font-weight:700;
  color:var(--ocra);margin-bottom:3px
}
.career-btn-sub{
  font-family:var(--fn);font-size:11px;
  color:rgba(200,153,30,.48);line-height:1.4
}
.career-btn-arrow{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  font-size:15px;color:rgba(200,153,30,.35);font-family:var(--fn)
}

/* Bottoni secondari */
.sec-btn{
  width:100%;background:rgba(255,255,255,.025);
  border:var(--bord);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;
  cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;
  -webkit-appearance:none;transition:opacity .12s
}
.sec-btn:active{opacity:.7}
.sec-btn[disabled]{opacity:.3;pointer-events:none}
.sec-btn-icon{font-size:17px}
.sec-btn-label{
  font-family:var(--fn);font-size:13px;color:var(--perg2);font-weight:500;flex:1
}
.sec-btn-sub{font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.38);margin-top:1px}
.sec-btn-chev{font-size:11px;color:rgba(200,153,30,.28)}

/* ══════════════════
   HEADER INTERNO
══════════════════ */
.hdr{
  background:linear-gradient(135deg,#2C1208,#3D1A0C 50%,#2C1208);
  border-bottom:2px solid var(--ocra);
  padding:11px 16px;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:10;flex-shrink:0
}
.hdr::after{
  content:"✦";position:absolute;left:50%;transform:translateX(-50%);
  color:var(--ocra);font-size:11px;opacity:.5
}
.hdr-back{
  font-size:22px;color:var(--ocra);background:none;border:none;
  cursor:pointer;padding:4px 6px;-webkit-appearance:none;line-height:1
}
.hdr-title{
  font-family:var(--fn);font-size:15px;font-weight:700;
  color:var(--ocra);letter-spacing:.4px
}
.hdr-right{
  font-family:var(--fn);font-size:10px;color:var(--ocra-l);text-align:right;line-height:1.4
}

/* ══════════════════
   CARD
══════════════════ */
.card{
  background:linear-gradient(160deg,#2C1208,#221006);
  border:var(--bord);border-radius:13px;
  padding:14px;margin-bottom:12px;position:relative;overflow:hidden
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,153,30,.22),var(--ocra-d),rgba(200,153,30,.22),transparent)
}
.card-title{
  font-family:var(--fn);font-size:9px;font-weight:600;color:var(--ocra);
  text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px
}
.card-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(200,153,30,.2),transparent)}

/* ══════════════════
   INPUT
══════════════════ */
.inp-label{
  font-family:var(--fn);font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:rgba(200,153,30,.45);margin-bottom:6px
}
.inp{
  width:100%;padding:13px 14px;background:rgba(0,0,0,.35);
  border:var(--bord2);border-radius:10px;
  font-family:var(--fn);font-size:16px;color:var(--perg);
  -webkit-appearance:none;outline:none;
  -webkit-user-select:text;user-select:text
}
.inp::placeholder{color:rgba(200,153,30,.22)}
.inp:focus{border-color:var(--ocra);box-shadow:0 0 0 2px rgba(200,153,30,.10)}

/* ══════════════════
   PULSANTI
══════════════════ */
.btn{
  padding:13px 16px;border-radius:10px;border:var(--bord2);
  background:linear-gradient(160deg,#3D1A0C,#221006);
  cursor:pointer;font-size:15px;font-family:var(--fn);
  color:var(--ocra-l);font-weight:600;
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;
  -webkit-appearance:none;transition:opacity .1s;gap:7px
}
.btn:active{opacity:.73}
.btn.gold{
  background:linear-gradient(135deg,var(--ocra-d),#5A3E06);
  color:#1A0A04;border-color:var(--ocra);font-weight:800
}
.btn.ross{
  background:linear-gradient(135deg,var(--ross),var(--ross2));
  color:var(--ocra-l);border-color:rgba(200,153,30,.4)
}
.btn.w{width:100%;margin-top:8px;display:flex}
.btn[disabled]{opacity:.3;pointer-events:none}

/* ══════════════════
   SLOT SALVATAGGIO
══════════════════ */
.slot-grid{display:flex;flex-direction:column;gap:8px}
.slot{
  background:linear-gradient(160deg,#221006,#1A0A04);
  border:var(--bord);border-radius:11px;
  padding:13px 14px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  -webkit-appearance:none;transition:opacity .12s;
  position:relative;overflow:hidden
}
.slot::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,153,30,.18),transparent)
}
.slot.vuoto{opacity:.55}
.slot:active{opacity:.7}
.slot-num{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.3);border:1px solid rgba(200,153,30,.3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ocra);
  flex-shrink:0
}
.slot-info{flex:1}
.slot-nome{
  font-family:var(--fn);font-size:13px;font-weight:700;
  color:var(--ocra-l);margin-bottom:2px
}
.slot-dettaglio{
  font-family:var(--fn);font-size:10px;
  color:rgba(200,153,30,.4)
}
.slot-chev{font-size:13px;color:rgba(200,153,30,.3)}
.slot-vuoto-label{
  font-family:var(--fn);font-size:12px;
  color:rgba(200,153,30,.28);font-style:italic
}
.slot-del{
  padding:6px 10px;font-size:14px;color:rgba(200,153,30,.4);
  background:none;border:none;cursor:pointer;-webkit-appearance:none;
  border-left:1px solid rgba(200,153,30,.12);margin-left:4px
}
.slot-del:active{color:#E05555}

/* ══════════════════
   CONTRADE
══════════════════ */
.contrade-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px
}
.contrada-card{
  background:linear-gradient(160deg,#2C1208,#1A0A04);
  border:var(--bord);border-radius:12px;
  padding:12px 10px 10px;cursor:pointer;text-align:center;
  position:relative;overflow:hidden;
  -webkit-appearance:none;transition:all .15s;
  display:flex;flex-direction:column;align-items:center
}
.contrada-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,153,30,.18),transparent)
}
.contrada-card:active{opacity:.72}
.contrada-card.sel{
  border-color:var(--ocra);
  background:linear-gradient(160deg,#3D1A0C,#2C1208);
  box-shadow:0 0 16px rgba(200,153,30,.14)
}
.contrada-card.sel::before{
  background:linear-gradient(90deg,transparent,var(--ocra),transparent)
}
/* Immagine stemma contrada */
.contrada-img{
  width:56px;height:56px;object-fit:contain;
  margin-bottom:7px;border-radius:4px;
  /* Fallback se immagine assente */
  background:rgba(0,0,0,.25);
  border:1px solid rgba(200,153,30,.15)
}
.contrada-nome{
  font-family:var(--fn);font-size:11px;font-weight:700;
  color:var(--ocra-l);margin-bottom:4px
}
.contrada-bonus{
  font-family:var(--fn);font-size:9px;
  color:rgba(200,153,30,.44);line-height:1.35
}
.contrada-check{
  position:absolute;top:6px;right:8px;
  font-size:11px;color:var(--ocra);display:none
}
.contrada-card.sel .contrada-check{display:block}

/* ══════════════════
   FANTINO OPTIONS
══════════════════ */
.fantino-option{
  background:linear-gradient(160deg,#2C1208,#1A0A04);
  border:var(--bord);border-radius:13px;
  padding:16px;margin-bottom:10px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  -webkit-appearance:none;transition:opacity .12s;
  position:relative;overflow:hidden
}
.fantino-option::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,153,30,.2),transparent)
}
.fantino-option:active{opacity:.7}
.fo-icon{font-size:28px;flex-shrink:0}
.fo-title{font-family:var(--fn);font-size:14px;font-weight:700;color:var(--ocra);margin-bottom:3px}
.fo-sub{font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.42);line-height:1.4}
.fo-arrow{margin-left:auto;font-size:15px;color:rgba(200,153,30,.32)}

/* ══════════════════
   SCHERMATE INTERNE
══════════════════ */
.screen-title{
  font-family:var(--fs);font-size:22px;font-weight:700;
  color:var(--ocra);margin-bottom:4px;text-align:center
}
.screen-sub{
  font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.45);
  text-align:center;margin-bottom:20px;letter-spacing:.4px
}

/* GIOCO STAT BOX */
.stat-box{
  flex:1;min-width:80px;background:rgba(0,0,0,.25);
  border-radius:9px;padding:10px;text-align:center;
  border:var(--bord)
}
.stat-box-icon{font-size:18px;margin-bottom:3px}
.stat-box-val{
  font-family:var(--fn);font-size:17px;font-weight:700;color:var(--ocra)
}
.stat-box-label{
  font-family:var(--fn);font-size:9px;color:rgba(200,153,30,.38);
  text-transform:uppercase;letter-spacing:1px;margin-top:1px
}

/* POPUP */
.overlay{
  position:fixed;inset:0;z-index:999;
  background:rgba(17,6,2,.88);
  display:flex;align-items:center;justify-content:center;padding:20px
}
.popup{
  background:linear-gradient(160deg,#2C1208,#1A0A04);
  border:2px solid var(--ocra);border-radius:16px;
  padding:22px 20px;max-width:340px;width:100%;
  box-shadow:0 0 40px rgba(200,153,30,.18);position:relative
}
.popup-icon{font-size:30px;text-align:center;margin-bottom:6px}
.popup-title{
  font-family:var(--fn);font-size:16px;font-weight:700;
  color:var(--ocra);text-align:center;margin-bottom:6px
}
.popup-body{
  font-family:var(--fn);font-size:12px;color:var(--perg2);
  text-align:center;line-height:1.6;margin-bottom:14px
}

@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .2s ease-out both}

/* ══════════════════
   TUTORIAL — accordion
══════════════════ */
.tut-item{
  background:linear-gradient(160deg,#2C1208,#221006);
  border:var(--bord);border-radius:11px;margin-bottom:9px;overflow:hidden
}
.tut-item>summary{
  list-style:none;cursor:pointer;padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  font-family:var(--fn);font-size:12.5px;font-weight:700;color:var(--ocra-l);
  -webkit-tap-highlight-color:transparent
}
.tut-item>summary::-webkit-details-marker{display:none}
.tut-item>summary::after{content:'▸';margin-left:auto;color:var(--ocra);transition:transform .15s;font-size:11px}
.tut-item[open]>summary::after{transform:rotate(90deg)}
.tut-item-ico{font-size:16px;flex-shrink:0}
.tut-item-body{
  padding:0 14px 14px 40px;font-family:var(--fn);font-size:12px;
  color:var(--perg2);line-height:1.65
}
.tut-item-body p{margin:0 0 9px 0}
.tut-item-body p:last-child{margin-bottom:0}
.tut-item-body b{color:var(--ocra-l)}
.tut-item-body ul{margin:0 0 9px 0;padding-left:16px}
.tut-item-body li{margin-bottom:5px}
.tut-phase{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}
.tut-phase-num{
  flex-shrink:0;width:23px;height:23px;border-radius:50%;
  background:rgba(200,153,30,.1);border:1px solid rgba(200,153,30,.3);
  display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px
}
.tut-phase-txt{flex:1}
.tut-note{
  margin-top:2px;padding:9px 11px;border-radius:8px;
  background:rgba(200,153,30,.07);border:1px dashed rgba(200,153,30,.28);
  font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.65);line-height:1.55
}

/* Tasti direzionali del minigioco Spionaggio: triangolo CSS puro, leggero e senza font emoji */
.spio-dir-btn{
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:rgba(200,153,30,.1);
  border:1px solid rgba(200,153,30,.25);cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background .12s ease;
}
.spio-dir-btn:active{ background:rgba(200,153,30,.25); }
.spio-arrow{
  display:inline-block;width:0;height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-bottom:14px solid var(--ocra-l);
}
</style>
</head>
<body>
<div class="app" id="APP">
  <div class="main" id="MAIN"></div>
</div>
<script src="fantini_db.js"></script>
<script src="cavalli_db.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════
   COSTANTI
═══════════════════════════════════════════════ */
const ANNO = 2027;
const IMG_BASE = 'img/contrade/'; // cartella immagini contrade

const CONTRADE = [
  { nome:'Aquila',       img:'contrada_aquila.png',       bonus:'Blasone imperiale: inizi con +10 Prestigio',                    bonusKey:'prestigio',         bonusVal:10  },
  { nome:'Bruco',        img:'contrada_bruco.png',        bonus:'Casse ricche: budget iniziale 4000 oro',                         bonusKey:'oro_iniziale',       bonusVal:4000},
  { nome:'Chiocciola',   img:'contrada_chiocciola.png',   bonus:'Passo lento e sicuro: il tuo fantino ha meno rischio di cadere', bonusKey:'stabilita',          bonusVal:1   },
  { nome:'Civetta',      img:'contrada_civetta.png',      bonus:'Occhi nella notte: minigioco Scherzo più facile',                bonusKey:'scherzo_facile',     bonusVal:1   },
  { nome:'Drago',        img:'contrada_drago.png',        bonus:'Fuoco antico: inizi con intesa 100 con un fantino',              bonusKey:'intesa_fantino_100', bonusVal:1   },

/* ── Stalla (carriera Fantino): stato "vivo" di un cavallo posseduto.
   Le modifiche da allenamento restano fino alla vendita; la stanchezza va da 0 a 3. ── */
function statoVivoCavallo(nome){
  const base = (typeof CAVALLI_DB !== 'undefined') ? CAVALLI_DB.find(c=>c.nome===nome) : null;
  if(!base) return null;
  if(!S.statiCavalli) S.statiCavalli = {};
  if(!S.statiCavalli[nome]){
    S.statiCavalli[nome] = {
      velocita: base.velocita, accelerazione: base.accelerazione,
      tenuta_curva: base.tenuta_curva, resistenza: base.resistenza,
      nervosismo: base.nervosismo, stanchezza: 0
    };
  }
  return S.statiCavalli[nome];
}

/* ── Carriera Fantino: formula del prezzo dei cavalli in vendita ──
   prezzo_minimo    = ((media statistiche + finali vinte) × 1000 − nervosismo × 100) × random(0.8–1.2)
   prezzo_consigliato = ((media statistiche + finali vinte) × 1000 − nervosismo × 100) × 1.3
   "media statistiche" = media di velocità, accelerazione, tenuta_curva, resistenza */
function valoreBaseCavallo(cavallo, finaliVinte){
  const media = (cavallo.velocita + cavallo.accelerazione + cavallo.tenuta_curva + cavallo.resistenza) / 4;
  return Math.max(0, (media + (finaliVinte||0)) * 1000 - cavallo.nervosismo * 100);
}
function prezzoConsigliatoCavallo(cavallo, finaliVinte){
  return Math.round(valoreBaseCavallo(cavallo, finaliVinte) * 1.3);
}

/* Completa direttamente (senza passare da verificaObiettivi, che gestisce solo i tipi
   'azione'/'soglia') un obiettivo di tipo 'palio' della lista passata, assegnando il
   premio nel campo indicato ('prestigio' per il Capitano, 'fama' per il Fantino). */
function completaObiettivoDiretto(lista, id, campoPremio){
  if(!S) return;
  if(!S.obiettiviCompletati) S.obiettiviCompletati = {};
  if(S.obiettiviCompletati[id]) return;
  const ob = lista.find(o=>o.id===id);
  if(!ob) return;
  S.obiettiviCompletati[id] = true;
  const nuovoValore = (S[campoPremio]||0) + PREMIO_OBIETTIVO;
  S[campoPremio] = (campoPremio === 'fama') ? Math.min(100, nuovoValore) : nuovoValore;
  S.log.push(`Obiettivo completato: "${ob.titolo}". +${PREMIO_OBIETTIVO} ${campoPremio==='fama'?'fama':'prestigio'}.`);
}

function R(id){ return document.getElementById(id); }
function setMain(html){ R('MAIN').innerHTML='<div class="fade-in">'+html+'</div>'; }

/* Escape di apici singoli e backslash per interpolare in sicurezza nomi (es. "Viso D'Angelo")
   dentro attributi onclick="...('${nome}')" senza rompere la stringa JS generata. */
function escJs(str){
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function annoRomano(n){
  const val=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const sym=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r='';for(let i=0;i<val.length;i++){while(n>=val[i]){r+=sym[i];n-=val[i];}}return r;
}

/* ── Salvataggi: 3 slot per tipo ── */
function slotKey(tipo, n){ return `palio_siena_${tipo}_slot${n}`; }
function leggiSlot(tipo, n){
  const d = localStorage.getItem(slotKey(tipo,n));
  return d ? JSON.parse(d) : null;
}
function scriviSlot(tipo, n, dati){
  localStorage.setItem(slotKey(tipo,n), JSON.stringify(dati));
}
function cancellaSlot(tipo, n){
  localStorage.removeItem(slotKey(tipo,n));
}

function renderSlotCarica(tipo){
  const titolo = tipo==='capitano' ? 'Carica Capitano' : 'Carica Fantino';
  let slotsHtml = '';
  for(let i=1;i<=NUM_SLOT;i++){
    const d = leggiSlot(tipo, i);
    if(d){
      const etichetta = tipo==='capitano'
        ? `${d.contrada?.nome||'—'} · ${MESI_CAPITANO[(d.mese||1)-1]} ${d.anno||ANNO} · Vittorie: ${d.vittorie||0}`
        : `A.D. ${d.anno||ANNO} · Fama: ${d.fama||0} · Vittorie: ${d.vittorie||0}`;
      slotsHtml += `
      <div class="slot" onclick="caricaDaSlot('${tipo}',${i})">
        <div class="slot-num">${i}</div>
        <div class="slot-info">
          <div class="slot-nome">${d.nome||'Senza nome'}</div>
          <div class="slot-dettaglio">${etichetta}</div>
        </div>
        <button class="slot-del" onclick="event.stopPropagation();confermaEliminaSlot('${tipo}',${i})" title="Elimina">✕</button>
        <span class="slot-chev">›</span>
      </div>`;
    } else {
      slotsHtml += `
      <div class="slot vuoto" style="pointer-events:none">
        <div class="slot-num">${i}</div>
        <div class="slot-info">
          <div class="slot-vuoto-label">Slot vuoto</div>
        </div>
      </div>`;
    }
  }
  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderHome()">‹</button>
      <span class="hdr-title">${titolo}</span>
      <span class="hdr-right"></span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">Scegli il salvataggio</div>
      <div class="screen-sub">Seleziona uno slot per continuare la partita</div>
      <div class="slot-grid">${slotsHtml}</div>
    </div>
  </div>
  `);
}

function confermaSovrascriviSlot(tipo, n){
  const d = leggiSlot(tipo, n);

  ov.className='overlay';
  ov.innerHTML=`

  R('APP').appendChild(ov);
}

function confermaEliminaSlot(tipo, n){
  const d = leggiSlot(tipo, n);
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🗑️</div>
    <div class="popup-title">Eliminare il salvataggio?</div>
    <div class="popup-body">La partita di <strong style="color:var(--ocra)">${d?.nome||'Senza nome'}</strong> verrà cancellata definitivamente.</div>
    <div style="display:flex;gap:8px">
      <button class="btn w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove()">Annulla</button>
      <button class="btn ross w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove();eliminaSlot('${tipo}',${n})">Elimina</button>
    </div>
  </div>`;
  R('APP').appendChild(ov);
}

function eliminaSlot(tipo, n){
  cancellaSlot(tipo, n);
  renderSlotCarica(tipo);
}

function caricaDaSlot(tipo, n){
  const d = leggiSlot(tipo, n);
  if(!d) return;
  S = d;
  _slotCorrente = {tipo, n};
  if(tipo==='capitano') renderGiocoCapitano();
  else renderGiocoFantino();
}

function salvaCorrente(){
  if(!S || !_slotCorrente) return;
  scriviSlot(_slotCorrente.tipo, _slotCorrente.n, S);
}

/* ═══════════════════════════════════════════════
   INIZIO CARRIERA CAPITANO
═══════════════════════════════════════════════ */
function iniziaCarrieraCapitano(){
  if(!_nomeCapTmp || !_contradaSelTmp || !_slotCorrente) return;

  // Genera il livello di amicizia iniziale con ognuna delle altre 16 contrade
  const amicizia = {};
  CONTRADE.forEach(c=>{
    if(c.nome === _contradaSelTmp.nome) return; // la propria contrada non ha un valore di amicizia con sé stessa
    const rel = relazioneIniziale(_contradaSelTmp.nome, c.nome);
    let v;
    if(rel === 'rivale')      v = Math.floor(Math.random()*21);        // 0–20
    else if(rel === 'alleato') v = 80 + Math.floor(Math.random()*21);  // 80–100
    else                       v = 30 + Math.floor(Math.random()*41);  // 30–70
    amicizia[c.nome] = v;
  });

  // Genera il livello di intesa iniziale con ognuno dei fantini del database
  const intesaFantini = {};
  if(typeof FANTINI_DB !== 'undefined'){
    FANTINI_DB.forEach(f=>{ intesaFantini[f.nome] = Math.floor(Math.random()*101); }); // 0–100
  }

  // Bonus Drago: un fantino casuale parte con intesa 100
  if(_contradaSelTmp.bonusKey === 'intesa_fantino_100' && typeof FANTINI_DB !== 'undefined' && FANTINI_DB.length){
    const idxBonus = Math.floor(Math.random() * FANTINI_DB.length);
    intesaFantini[FANTINI_DB[idxBonus].nome] = 100;
  }

  // Bonus Torre: una contrada alleata (non rivale storica) parte con amicizia 100
  if(_contradaSelTmp.bonusKey === 'amicizia_100'){
    const alleateStoriche = (RAPPORTI_CONTRADE[_contradaSelTmp.nome]?.alleati || []);
    const candidati = alleateStoriche.length ? alleateStoriche : CONTRADE.filter(c=>c.nome !== _contradaSelTmp.nome).map(c=>c.nome);
    const sceltaAlleata = candidati[Math.floor(Math.random() * candidati.length)];
    if(sceltaAlleata) amicizia[sceltaAlleata] = 100;
  }

  // Morale iniziale base (poi eventuale bonus Valdimontone)
  const moraleIniziale = _contradaSelTmp.bonusKey === 'morale_80'
    ? 80
    : 40 + Math.floor(Math.random()*41); // 40–80

  S = {
    tipo: 'capitano',
    nome: _nomeCapTmp,
    contrada: _contradaSelTmp,
    anno: ANNO,
    mese: 1, // 1=Gennaio ... 8=Agosto (mese del Palio, ultimo dell'annata)
    oro: _contradaSelTmp.bonusKey === 'oro_iniziale' ? _contradaSelTmp.bonusVal : ORO_INIZIALE_CAPITANO,
    prestigio: 10 + (_contradaSelTmp.bonusKey === 'prestigio' ? _contradaSelTmp.bonusVal : 0),
    vittorie: 0,
    vittorieAnnoCorrente: 0,      // vittorie ottenute nell'annata in corso (per l'obiettivo "Vero Vincente")
    strisciaVittorieAnnuali: 0,   // anni consecutivi con almeno una vittoria (per l'obiettivo "Vero Vincente")
    amicizia,
    intesaFantini,
    visiteFantiniMese: 0,
    corseProvinciaAnnullateMese: false,
    stelline: {},
    scoreCavalliAnno: {},
    corsaProvinciaMese: null,
    _storicoAzioni: {},
    obiettiviCompletati: {},
    dirittoLuglio: ['Chiocciola','Pantera','Nicchio','Selva','Lupa','Istrice','Tartuca'],
    dirittoAgosto: ['Drago','Valdimontone','Pantera','Civetta','Tartuca','Leocorno','Bruco'],
    palioLuglioAnno: null,
    palioAgostoAnno: null,
    estrazionePalioInCorso: null,
    maniero: {
      morale: moraleIniziale,
      condizioni: 40 + Math.floor(Math.random()*41),   // 40–80 iniziale
      azioniUsateMese: {},
      probabilitaImprevisti: _contradaSelTmp.bonusKey === 'anti_scherzo'
        ? PROBABILITA_IMPREVISTI_RIDOTTA  // Istrice: parte già con probabilità ridotta
        : PROBABILITA_IMPREVISTI_BASE,
      annoProbabilitaRidotta: _contradaSelTmp.bonusKey === 'anti_scherzo' ? ANNO : null,
      annoProtezioneUsata: null
    },
    log: [`Inizio carriera come Capitano della Contrada del${/^[AEIOU]/.test(_contradaSelTmp.nome)?'l\'':' '}${_contradaSelTmp.nome}. Gennaio ${ANNO}.`]
  };
  salvaCorrente();
  renderGiocoCapitano();
}

/* ── Avanzamento del tempo: Gennaio → Agosto, poi nuovo anno ── */
function avanzaMeseCapitano(){
  if(!S) return;

  // A fine Maggio (prima di entrare in Giugno) si estraggono le contrade del Palio di Luglio.
  // A fine Luglio (prima di entrare in Agosto) si estraggono quelle del Palio di Agosto.
  // In entrambi i casi la schermata di estrazione sospende l'avanzamento del mese: si procede
  // solo dopo che il giocatore ha completato l'estrazione (vedi completaEstrazionePalio()).
  if(S.mese === 5 && !S.palioLuglioAnno){
    avviaEstrazionePalio('luglio');
    return;
  }
  if(S.mese === 7 && !S.palioAgostoAnno){
    avviaEstrazionePalio('agosto');
    return;
  }

  eseguiAvanzamentoMeseEffettivo();
}

/* La vera logica di avanzamento mese, separata per poter essere richiamata anche
   dopo che l'estrazione del Palio è stata completata (vedi completaEstrazionePalio()). */
function eseguiAvanzamentoMeseEffettivo(){
  let nuovoAnno = false;
  if(S.mese < MESI_CAPITANO.length){
    S.mese++;
    S.log.push(`Si entra nel mese di ${MESI_CAPITANO[S.mese-1]} ${S.anno}.`);
  } else {
    // Agosto era l'ultimo mese: si passa all'anno successivo, si riparte da Gennaio
    S.anno++;
    S.mese = 1;
    nuovoAnno = true;
    S.log.push(`L'annata si conclude. Inizia il nuovo anno: Gennaio ${S.anno}.`);
  }
  // Le azioni del maniero si possono usare una volta al mese: si resettano ad ogni cambio mese
  if(S.maniero){
    S.maniero.azioniUsateMese = {};
    // Il tempo logora il maniero: ogni mese le condizioni calano di 5 punti
    S.maniero.condizioni = Math.max(0, S.maniero.condizioni - 5);
    // La riduzione della probabilità di imprevisti vale solo per l'anno in cui è stata attivata
    if(S.maniero.annoProbabilitaRidotta !== null && S.maniero.annoProbabilitaRidotta !== S.anno){
      S.maniero.probabilitaImprevisti = PROBABILITA_IMPREVISTI_BASE;
      S.maniero.annoProbabilitaRidotta = null;
    }
  }
  // Le visite ai fantini ("vai a trovarlo") si resettano ogni mese: massimo 3 al mese
  S.visiteFantiniMese = 0;
  // Le corse in provincia annullate da un eventuale imprevisto valgono solo per il mese appena concluso
  S.corseProvinciaAnnullateMese = false;
  // Una nuova corsa in provincia è disponibile ogni mese
  S.corsaProvinciaMese = null;
  // Le stelline "preferito" e i risultati annuali dei cavalli si azzerano al cambio anno
  if(nuovoAnno){
    S.stelline = {};
    S.scoreCavalliAnno = {};
    // I risultati del Palio di quest'annata sono ormai conclusi: si riparte daccapo per la prossima
    S.palioLuglioAnno = null;
    S.palioAgostoAnno = null;
    // Aggiorna la striscia di annate consecutive con almeno una vittoria (obiettivo "Vero Vincente"):
    // se nell'annata appena conclusa abbiamo vinto almeno un Palio la striscia continua, altrimenti si azzera.
    S.strisciaVittorieAnnuali = (S.vittorieAnnoCorrente || 0) > 0 ? (S.strisciaVittorieAnnuali || 0) + 1 : 0;
    S.vittorieAnnoCorrente = 0;
  }

  const giornale = generaImprevistoMensile();
  verificaObiettivi();

  salvaCorrente();
  renderGiocoCapitano();
  mostraPopupGiornaleSiena(giornale);
}

/* ═══════════════════════════════════════════════
   ESTRAZIONE DELLE CONTRADE PARTECIPANTI AL PALIO
   Ogni Palio (Luglio o Agosto) ha 10 contrade al via:
   - 7 "di diritto" (quelle NON estratte nel pool dell'anno precedente per quello stesso Palio)
   - 3 estratte a sorte dalle restanti 10 contrade (17 - 7 di diritto)
   Le 7 contrade del pool da 10 che NON vengono estratte diventano il diritto dell'anno prossimo.
═══════════════════════════════════════════════ */
function avviaEstrazionePalio(tipoPalio){
  if(!S) return;
  const dirittoCorrente = (tipoPalio==='luglio') ? S.dirittoLuglio : S.dirittoAgosto;
  const pool = CONTRADE.map(c=>c.nome).filter(n=>!dirittoCorrente.includes(n));

  S.estrazionePalioInCorso = {
    tipoPalio,            // 'luglio' o 'agosto'
    anno: S.anno,
    diritto: dirittoCorrente.slice(),  // le 7 contrade già sicure
    pool: pool,            // le 10 contrade da cui estrarre (non ancora estratte)
    estratte: [],          // le contrade via via estratte (max 3)
    contesto: 'capitano'
  };
  salvaCorrente();
  renderEstrazionePalio();
}

function renderEstrazionePalio(){
  if(!S || !S.estrazionePalioInCorso) return;
  const est = S.estrazionePalioInCorso;
  const nomePalio = est.tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const completata = (est.estratte.length >= 3);

  const trovaContrada = nome => CONTRADE.find(c=>c.nome===nome);

  const boxDirittoHtml = est.diritto.map(nome=>{
    const c = trovaContrada(nome);
    return `
    <div class="card" style="text-align:center;padding:10px 8px;${nome===S.contrada?.nome?'border:1px solid rgba(200,153,30,.6)':''}">
      <img src="${IMG_BASE}${c?c.img:''}" alt="${nome}"
           style="width:38px;height:38px;object-fit:contain;border-radius:4px;background:rgba(0,0,0,.2);margin:0 auto 6px"
           onerror="this.style.opacity='.15'">
      <div style="font-family:var(--fn);font-size:11px;font-weight:700;color:var(--ocra-l)">${nome}</div>
      <div style="font-family:var(--fn);font-size:9px;color:rgba(200,153,30,.4);margin-top:2px">di diritto</div>
    </div>`;
  }).join('');

  const slotEstrazioneHtml = [0,1,2].map(i=>{
    const nome = est.estratte[i];
    if(nome){
      const c = trovaContrada(nome);
      return `
      <div class="card" style="text-align:center;padding:10px 8px;${nome===S.contrada?.nome?'border:1px solid rgba(200,153,30,.6)':''}">
        <img src="${IMG_BASE}${c?c.img:''}" alt="${nome}"
             style="width:38px;height:38px;object-fit:contain;border-radius:4px;background:rgba(0,0,0,.2);margin:0 auto 6px"
             onerror="this.style.opacity='.15'">
        <div style="font-family:var(--fn);font-size:11px;font-weight:700;color:var(--verde)">${nome}</div>
        <div style="font-family:var(--fn);font-size:9px;color:rgba(46,160,90,.6);margin-top:2px">estratta</div>
      </div>`;
    }
    return `
    <div class="card" style="text-align:center;padding:10px 8px;opacity:.4">
      <div style="width:38px;height:38px;border-radius:4px;background:rgba(0,0,0,.15);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:18px">❔</div>
      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.4)">da estrarre</div>
    </div>`;
  }).join('');

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Estrazione Palio</span>
      <span class="hdr-right" style="font-size:10px">${S.anno}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🎲 Estrazione contrade Palio di ${nomePalio} ${est.anno}</div>
      <div class="screen-sub">7 contrade partecipano di diritto. Le restanti 3 vengono estratte a sorte tra le 10 rimaste.</div>

      <div class="home-section-label" style="margin-top:6px">Contrade di diritto</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        ${boxDirittoHtml}
      </div>

      <div class="home-section-label">Estrazione a sorte (3 contrade)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        ${slotEstrazioneHtml}
      </div>

      <div class="card" style="text-align:center">
        ${completata ?
          `<div style="font-family:var(--fn);font-size:12px;color:var(--verde);margin-bottom:10px">✅ Estrazione completata! Le 10 contrade partecipanti al Palio di ${nomePalio} sono state stabilite.</div>
           <button class="btn gold w" onclick="${est.contesto==='fantino' ? 'completaEstrazionePalioFantino()' : 'completaEstrazionePalio()'}">Procedi al mese successivo →</button>`
          :
          `<button class="btn gold w" onclick="eseguiEstrazioneSingola()">🎲 Estrazione (${est.estratte.length+1}/3)</button>`
        }
      </div>
    </div>
  </div>
  `);
}

function eseguiEstrazioneSingola(){
  if(!S || !S.estrazionePalioInCorso) return;
  const est = S.estrazionePalioInCorso;
  if(est.estratte.length >= 3 || !est.pool.length) return;
  const idx = Math.floor(Math.random()*est.pool.length);
  const nomeEstratto = est.pool.splice(idx,1)[0];
  est.estratte.push(nomeEstratto);
  salvaCorrente();
  renderEstrazionePalio();
}

/* Conclude l'estrazione: fissa le 10 partecipanti di quest'anno, calcola il diritto
   per l'anno prossimo (le 7 contrade del pool NON estratte), e finalmente avanza il mese. */
function completaEstrazionePalio(){
  if(!S || !S.estrazionePalioInCorso) return;
  const est = S.estrazionePalioInCorso;
  if(est.estratte.length < 3) return;

  const partecipanti = est.diritto.concat(est.estratte);
  const risultato = {
    anno: est.anno,
    partecipanti,            // le 10 contrade al via di quest'anno
    dirittoUsato: est.diritto.slice(),
    estratte: est.estratte.slice()
  };
  // Le 7 contrade del pool NON estratte diventano il diritto per l'anno prossimo
  const nuovoDiritto = est.pool.slice();

  if(est.tipoPalio === 'luglio'){
    S.palioLuglioAnno = risultato;
    S.dirittoLuglio = nuovoDiritto;
    S.log.push(`Estrazione Palio di Luglio ${est.anno} completata. Partecipanti: ${partecipanti.join(', ')}.`);
  } else {
    S.palioAgostoAnno = risultato;
    S.dirittoAgosto = nuovoDiritto;
    S.log.push(`Estrazione Palio di Agosto ${est.anno} completata. Partecipanti: ${partecipanti.join(', ')}.`);
  }

  S.estrazionePalioInCorso = null;
  salvaCorrente();
  eseguiAvanzamentoMeseEffettivo();
}

/* ═══════════════════════════════════════════════
   IMPREVISTI MENSILI — "Giornale di Siena"
═══════════════════════════════════════════════ */
function nomiContradeAlleGiocatore(){
  // Tutte le contrade tranne quella del giocatore, per i nomi casuali usati nelle frasi
  return CONTRADE.filter(c=>c.nome !== (S.contrada?.nome||''));
}

function dueContradeCaso(){
  const altre = nomiContradeAlleGiocatore();
  if(altre.length < 2) return ['Civetta','Torre'];
  const i = Math.floor(Math.random()*altre.length);
  let j = Math.floor(Math.random()*altre.length);
  while(j===i) j = Math.floor(Math.random()*altre.length);
  return [altre[i].nome, altre[j].nome];
}

function fantinoCaso(){
  if(typeof FANTINI_DB === 'undefined' || !FANTINI_DB.length) return 'un fantino';
  return FANTINI_DB[Math.floor(Math.random()*FANTINI_DB.length)].nome;
}

/* Genera (ed applica) l'eventuale imprevisto del mese appena iniziato.
   Ritorna {titolo, testo} da mostrare nel popup "Giornale di Siena". */
function generaImprevistoMensile(){
  const probabilita = S.maniero ? S.maniero.probabilitaImprevisti : PROBABILITA_IMPREVISTI_BASE;
  const cEImprevisto = Math.random() < probabilita;

  if(!cEImprevisto){
    const [A,B] = dueContradeCaso();
    const F = fantinoCaso();
    let frase = FRASI_MESE_TRANQUILLO[Math.floor(Math.random()*FRASI_MESE_TRANQUILLO.length)];
    frase = frase.replace('{A}',A).replace('{B}',B).replace('{F}',F);
    return { titolo:'Mese tranquillo', testo:frase };
  }

  // Estrae uno dei 7 imprevisti con pari probabilità
  const tipi = ['tetto','fantino_no','scherzo_contrada','pioggia','donazione','amicizia_improvvisa','rissa'];
  const tipo = tipi[Math.floor(Math.random()*tipi.length)];

  switch(tipo){
    case 'tetto': {
      if(S.maniero) S.maniero.condizioni = 0;
      S.log.push('Imprevisto: crolla parte del tetto del maniero. Condizioni del maniero azzerate.');
      return { titolo:'Crolla il tetto del maniero!', testo:'Una trave marcia ha ceduto sotto il peso degli anni: il tetto del maniero è crollato in più punti. Le condizioni della sede sono ora pessime: servirà una manutenzione urgente.' };
    }
    case 'fantino_no': {
      const nomi = (typeof FANTINI_DB!=='undefined') ? FANTINI_DB.map(f=>f.nome) : [];
      if(nomi.length){
        const scelto = nomi[Math.floor(Math.random()*nomi.length)];
        if(!S.intesaFantini) S.intesaFantini = {};
        S.intesaFantini[scelto] = 0;
        S.log.push(`Imprevisto: il fantino ${scelto} non è d'accordo con la contrada. Intesa azzerata.`);
        return { titolo:'Il fantino non è d\'accordo', testo:`Una discussione accesa con <strong style="color:var(--ocra)">${scelto}</strong> ha fatto crollare l'intesa: il fantino si dichiara scontento dei rapporti con la contrada.` };
      }
      // fallback se il database fantini non è disponibile
      return { titolo:'Mese tranquillo', testo:'La vita in piazza scorre tranquilla.' };
    }
    case 'scherzo_contrada': {
      // Istrice: 60% di probabilità che lo scherzo venga sventato
      if(S.contrada?.bonusKey === 'anti_scherzo' && Math.random() < 0.6){
        const [A,B] = dueContradeCaso(); const F = fantinoCaso();
        let frase = FRASI_MESE_TRANQUILLO[Math.floor(Math.random()*FRASI_MESE_TRANQUILLO.length)];
        frase = frase.replace('{A}',A).replace('{B}',B).replace('{F}',F);
        return { titolo:'Scherzo sventato 🦔', testo:`Le spine dell\'Istrice hanno fermato gli scherzi altrui: <strong style="color:var(--verde)">lo scherzo è stato sventato</strong> prima di fare danni. ${frase}` };
      }
      const altre = nomiContradeAlleGiocatore();
      const c = altre[Math.floor(Math.random()*altre.length)];
      if(!S.amicizia) S.amicizia = {};
      const attuale = (S.amicizia[c.nome]!==undefined) ? S.amicizia[c.nome] : 50;
      S.amicizia[c.nome] = Math.max(0, attuale - 10);
      if(S.maniero) S.maniero.morale = Math.max(0, S.maniero.morale - 15);
      S.prestigio = Math.max(0, (S.prestigio||0) - 5);
      S.log.push(`Imprevisto: la Contrada del ${c.nome} ha fatto uno scherzo. Amicizia -10 (ora ${S.amicizia[c.nome]}), morale contradaioli -15, prestigio -5.`);
      return { titolo:'Uno scherzo dai rivali', testo:`La Contrada del <strong style="color:var(--ocra)">${c.nome}</strong> ha organizzato uno scherzo ai danni della tua contrada. L'amicizia con loro scende di 10 punti, il morale dei contradaioli cala di 15 punti e il prestigio della contrada ne risente: <strong style="color:var(--ross)">-5 prestigio</strong>.` };
    }
    case 'pioggia': {
      S.corseProvinciaAnnullateMese = true;
      S.log.push('Imprevisto: pioggia incessante. Le corse in provincia di questo mese sono annullate.');
      return { titolo:'Pioggia incessante', testo:'Un mese di pioggia ininterrotta ha reso impraticabili i tufi dei paesi vicini: tutte le corse in provincia di questo mese sono state annullate.' };
    }
    case 'donazione': {
      S.oro += 800;
      S.log.push('Imprevisto: un vecchio contradaiolo dona 800 oro alla contrada.');
      return { titolo:'La generosità di un anziano', testo:'Un vecchio contradaiolo, fedele alla causa per tutta la vita, ha donato <strong style="color:var(--verde)">800 oro</strong> alle casse della contrada.' };
    }
    case 'amicizia_improvvisa': {
      const nomi = (typeof FANTINI_DB!=='undefined') ? FANTINI_DB.map(f=>f.nome) : [];
      if(nomi.length){
        const scelto = nomi[Math.floor(Math.random()*nomi.length)];
        if(!S.intesaFantini) S.intesaFantini = {};
        const attuale = (S.intesaFantini[scelto]!==undefined) ? S.intesaFantini[scelto] : 50;
        S.intesaFantini[scelto] = Math.min(100, attuale + 50);
        S.log.push(`Imprevisto: amicizia improvvisa con ${scelto}. Intesa +50 (ora ${S.intesaFantini[scelto]}).`);
        return { titolo:'Amicizia improvvisa', testo:`Una serata passata insieme ha fatto scoccare la scintilla: l'intesa con <strong style="color:var(--ocra)">${scelto}</strong> è cresciuta improvvisamente di <strong style="color:var(--verde)">50 punti</strong>.` };
      }
      return { titolo:'Mese tranquillo', testo:'La vita in piazza scorre tranquilla.' };
    }
    case 'rissa': {
      S.oro = Math.max(0, S.oro - 600);
      S.log.push('Imprevisto: rissa tra contradaioli. Multa di 600 oro.');
      return { titolo:'Rissa tra contradaioli', testo:'Una rissa scoppiata davanti alla sede della contrada ha attirato l\'attenzione del Comune: una multa di <strong style="color:var(--ross)">600 oro</strong> è stata comminata alla contrada.' };
    }
  }
  return { titolo:'Mese tranquillo', testo:'La vita in piazza scorre tranquilla.' };

   Agosto: attivato da Agosto (mese 8), poi si avanza all'anno successivo (Gennaio)

/* Testi narrativi per ogni fase (2-3 frasi ambientate) */
const TESTI_FASI_PALIO = {

/* Avvia il flusso "I giorni del Palio" */
function avviaPalioGiornate(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;

  const contradaGiocatore = S.contrada.nome;
  const partecipa = datiPalio.partecipanti.includes(contradaGiocatore);

  if (!partecipa) {
    // La contrada non partecipa: mostra solo la schermata vincitore random
    const vincitore = datiPalio.partecipanti[Math.floor(Math.random() * datiPalio.partecipanti.length)];
    // Salva il vincitore nello stato
    if (tipoPalio === 'luglio') {
      S.palioLuglioAnno.vincitore = vincitore;
    } else {
      S.palioAgostoAnno.vincitore = vincitore;
    }
    salvaCorrente();
    renderPalioNonPartecipante(tipoPalio, vincitore);
    return;
  }

  // La contrada partecipa: inizia il flusso delle 10 fasi
  // Calcola il vincitore in anticipo (per la schermata finale)
  const partecipanti = datiPalio.partecipanti;
  // Probabilità di vincita pesata: la contrada del giocatore ha bonus se ha un buon fantino
  const vincitore = calcolaVincitorePalio(partecipanti, contradaGiocatore);
  if (tipoPalio === 'luglio') {
    S.palioLuglioAnno.vincitore = vincitore;
    S.palioLuglioAnno.faseCorrente = 0;
    S.palioLuglioAnno.giocatorePartecipa = true;
  } else {
    S.palioAgostoAnno.vincitore = vincitore;
    S.palioAgostoAnno.faseCorrente = 0;
    S.palioAgostoAnno.giocatorePartecipa = true;
  }
  salvaCorrente();
  renderFasePalio(tipoPalio, 0);
}

/* Calcola il vincitore del Palio tra le 10 contrade partecipanti.
   La contrada del giocatore ha un piccolo bonus basato sull'intesa col fantino migliore.
   Le contrade che hanno accettato un accordo segreto subiscono un malus (velocità −2). */
function calcolaVincitorePalio(partecipanti, contradaGiocatore) {
  const datiPalio = S.palioLuglioAnno?.partecipanti?.includes(contradaGiocatore)
    ? S.palioLuglioAnno : S.palioAgostoAnno;

  // Peso base uguale per tutte
  const pesi = {};
  partecipanti.forEach(c => { pesi[c] = 10; });

  // Bonus per la contrada del giocatore (intesa col fantino migliore)
  if (S.intesaFantini) {
    const intesaMax = Math.max(0, ...Object.values(S.intesaFantini));
    pesi[contradaGiocatore] = 10 + Math.round(intesaMax / 10);
  }

  // Malus per le contrade che hanno accettato l'accordo segreto (velocità −2)
  const velocitaOffset = (datiPalio && datiPalio.velocitaOffsetContrade) ? datiPalio.velocitaOffsetContrade : {};
  const resistenzaOffset = (datiPalio && datiPalio.resistenzaOffsetContrade) ? datiPalio.resistenzaOffsetContrade : {};
  partecipanti.forEach(c => {
    if (velocitaOffset[c]) pesi[c] = Math.max(1, (pesi[c] || 10) + velocitaOffset[c]);
    if (resistenzaOffset[c]) pesi[c] = Math.max(1, (pesi[c] || 10) + resistenzaOffset[c]);
  });

  // Bonus per accordi accettati (ogni accordo aiuta il giocatore)
  const nAccettati = datiPalio?.accordiPalio?.accettati?.length || 0;
  pesi[contradaGiocatore] = (pesi[contradaGiocatore] || 10) + nAccettati;

  // Modifiche temporanee dalla tattica scelta (velocità, accelerazione, resistenza, tenuta_curva)
  if (datiPalio && datiPalio.tattica && datiPalio.tattica.accettata && datiPalio.modificheTempPalio) {
    const m = datiPalio.modificheTempPalio;
    // velocità e accelerazione aumentano le chance; tenuta_curva e resistenza influenzano meno
    const bonusTattica = Math.round(
      ((m.velocita || 0) + (m.accelerazione || 0)) * 0.8 +
      ((m.resistenza || 0) + (m.tenuta_curva || 0)) * 0.4
    );
    pesi[contradaGiocatore] = Math.max(1, (pesi[contradaGiocatore] || 10) + bonusTattica);
  }

  // Estrazione pesata
  const totale = Object.values(pesi).reduce((a, b) => a + b, 0);
  let r = Math.random() * totale;
  for (const c of partecipanti) {
    r -= pesi[c];
    if (r <= 0) return c;
  }
  return partecipanti[partecipanti.length - 1];
}

/* Schermata per la contrada non partecipante: solo vincitore */

/* Renderizza una singola fase del Palio */
function renderFasePalio(tipoPalio, faseIdx) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;

  const fase = FASI_PALIO[faseIdx];

  // La Tratta ha una schermata dedicata con le prove
  if (fase.id === 'tratta') {
    renderTrattaPalio(tipoPalio);
    return;
  }

  // La Scelta dei Cavalli ha una schermata dedicata con selezione interattiva
  if (fase.id === 'scelta_cavalli') {
    renderSceltaCavalliPalio(tipoPalio);
    return;
  }

  // Presentazione del Lotto
  if (fase.id === 'presentazione') {
    renderPresentazioneLotto(tipoPalio);
    return;
  }

  // Assegnazione Cavalli — estrazione a sorte contrada/cavallo
  if (fase.id === 'assegnazione') {
    renderAssegnazioneCavalli(tipoPalio);
    return;
  }

  // Ingaggio del Fantino — trattativa con i fantini del database
  if (fase.id === 'ingaggio') {
    renderIngaggioFantino(tipoPalio);
    return;
  }

  // Accordi con le contrade — nuova schermata dedicata
  if (fase.id === 'accordi') {
    renderAccordiPalio(tipoPalio);
    return;
  }

  // Tattica di gara — istruzioni al fantino
  if (fase.id === 'tattica') {
    renderTatticaPalio(tipoPalio);
    return;
  }

  // Estrazione al Canapo — schermata dedicata con sorteggio delle posizioni alla mossa
  if (fase.id === 'canapo') {
    renderCanapoPalio(tipoPalio);
    return;
  }

  // La Corsa — simulazione giro per giro in Piazza del Campo
  if (fase.id === 'corsa') {
    renderCorsaPalio(tipoPalio);
    return;
  }

  const isUltima = (faseIdx === FASI_PALIO.length - 1);
  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';

  let corpoExtra = '';

  if (fase.id === 'vincitore') {
    const vincitore = datiPalio.vincitore;
    const datiVincitore = CONTRADE.find(c => c.nome === vincitore);
    const giocatoreVince = vincitore === S.contrada.nome;
    const piazzamento = datiPalio.corsaClassifica ? datiPalio.corsaClassifica.findIndex(n => n === S.contrada.nome) + 1 : null;
    const PREMI_ORO = [5000,4000,3000,2000,1500,1000,750,500,250,0];
    const premioOro = piazzamento ? (PREMI_ORO[piazzamento-1] || 0) : 0;

    if (!datiPalio._vincitoreEffettiApplicati) {
      datiPalio._vincitoreEffettiApplicati = true;
      if (!S.obiettiviCompletati) S.obiettiviCompletati = {};

      // Oro per il piazzamento
      S.oro = (S.oro || 0) + premioOro;

      if (giocatoreVince) {
        S.vittorie = (S.vittorie || 0) + 1;
        S.vittorieAnnoCorrente = (S.vittorieAnnoCorrente || 0) + 1;
        datiPalio._vittoriaContata = true;
        if (!S.maniero) S.maniero = { morale:50, condizioni:50, azioniUsateMese:{}, probabilitaImprevisti:PROBABILITA_IMPREVISTI_BASE, annoProbabilitaRidotta:null, annoProtezioneUsata:null };
        S.maniero.morale = Math.min(100, (S.maniero.morale || 0) + 50);
        S.prestigio = (S.prestigio || 0) + 10;
        const nomeFantino = datiPalio.ingaggio ? datiPalio.ingaggio.ingaggiato : null;
        if (nomeFantino && S.intesaFantini) S.intesaFantini[nomeFantino] = Math.min(100, (S.intesaFantini[nomeFantino] || 0) + 10);
        if (tipoPalio === 'luglio' && !S.obiettiviCompletati['vittoria_luglio']) {
          S.obiettiviCompletati['vittoria_luglio'] = true; S.prestigio = (S.prestigio||0) + 5;
        }
        if (tipoPalio === 'agosto' && !S.obiettiviCompletati['vittoria_agosto']) {
          S.obiettiviCompletati['vittoria_agosto'] = true; S.prestigio = (S.prestigio||0) + 5;
        }
        // "Cappotto": vincere sia il Palio di Luglio sia quello di Agosto nello stesso anno.
        // Agosto si corre sempre dopo Luglio nella stessa annata, quindi basta controllare,
        // al momento della vittoria d'Agosto, che anche il Palio di Luglio di quest'anno

        if (tipoPalio === 'agosto' && S.palioLuglioAnno && S.palioLuglioAnno.vincitore === S.contrada.nome && !S.obiettiviCompletati['cappotto']) {

        S.maniero.morale = Math.max(0, (S.maniero.morale || 0) - 50);
        const nomeFantino = datiPalio.ingaggio ? datiPalio.ingaggio.ingaggiato : null;
        if (nomeFantino && S.intesaFantini) S.intesaFantini[nomeFantino] = Math.max(0, (S.intesaFantini[nomeFantino] || 0) - 20);
        S.log.push(`Sconfitta al Palio di ${nomePalio} ${S.anno} (${piazzamento||'?'}° posto). Morale -50, intesa fantino -20.`);
      }
      if (premioOro > 0) S.log.push(`Premio piazzamento (${piazzamento}° posto): +${premioOro} oro.`);
      salvaCorrente();
      verificaObiettivi();
    }

    const nextFn = tipoPalio === 'luglio' ? 'avanzaMeseCapitano()' : 'concludiAnnataCapitano()';
    corpoExtra = `
    <div class="card" style="text-align:center;padding:20px 16px;margin-top:12px;${giocatoreVince?'border:2px solid var(--ocra);box-shadow:0 0 30px rgba(200,153,30,.25)':''}">
      <img src="img/palio/drappellone_${tipoPalio}.png" alt="Drappellone del Palio di ${nomePalio}"
           style="width:110px;height:auto;object-fit:contain;margin:0 auto ${giocatoreVince?'14':'10'}px;display:block;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.4)"
           onerror="this.style.display='none'">
      ${datiVincitore ? `<img src="${IMG_BASE}${datiVincitore.img}" alt="${vincitore}"
           style="width:72px;height:72px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.2);border:2px solid var(--ocra);margin:0 auto 12px;display:block"

      <button class="btn gold w" style="margin-top:12px" onclick="${nextFn}">

  const btnAvanti = !isUltima ? `

                 onerror="this.style.opacity='.15'">

          </div>
          <button class="btn gold w" style="margin-bottom:8px" onclick="eseguiCenaVigiliaPalio('${tipoPalio}', true)">🍷 Organizza la cena (-${COSTO_CENA_VIGILIA} oro)</button>
          <button class="btn w" onclick="eseguiCenaVigiliaPalio('${tipoPalio}', false)">🚫 Non organizzare la cena</button>

            Spesa: <strong style="color:var(--ross)">-${COSTO_CENA_VIGILIA} oro</strong> · Guadagno: <strong style="color:var(--verde)">+${datiPalio.cenaVigilia.guadagno} oro</strong><br>
            Nervosismo del cavallo: <strong style="color:var(--verde)">-1</strong> · Empatia del fantino: <strong style="color:var(--verde)">+1</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>
          </div>` : `
          <div style="font-family:var(--fn);font-size:12px;color:var(--ross);line-height:1.7">
            🚫 La cena della vigilia non è stata organizzata.<br>
