}

/* ═══════════════════════════════════════════════
   ASSEGNAZIONE CAVALLI — fase 4 del Palio
   I 10 cavalli del lotto vengono abbinati a sorte alle
   10 contrade partecipanti: ad ogni estrazione la contrada
   sorteggiata viene assegnata al primo cavallo del lotto
   ancora privo di contrada. Si ripete finché tutti i 10
   cavalli non hanno una contrada assegnata.
═══════════════════════════════════════════════ */

function preparaAssegnazioneCavalli(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.lotto) return null;
  if (!datiPalio.assegnazione) {
    datiPalio.assegnazione = {
      assegnazioni: {},                                   // { nomeCavallo: nomeContrada }
      contradeRimanenti: datiPalio.partecipanti.slice(),  // pool da cui estrarre a sorte
      completata: false
    };
    salvaCorrente();
  }
  return datiPalio.assegnazione;
}

function estraiAssegnazioneCavallo(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.lotto) return;
  const assegnazione = preparaAssegnazioneCavalli(tipoPalio);
  if (!assegnazione) return;

  // Trova il primo cavallo del lotto ancora senza contrada assegnata
  const prossimo = datiPalio.lotto.find(e => !assegnazione.assegnazioni[e.cavallo.nome]);
  if (!prossimo || assegnazione.contradeRimanenti.length === 0) return;

  // Estrazione a sorte di una contrada tra quelle rimaste
  const idx = Math.floor(Math.random() * assegnazione.contradeRimanenti.length);
  const contradaEstratta = assegnazione.contradeRimanenti.splice(idx, 1)[0];
  assegnazione.assegnazioni[prossimo.cavallo.nome] = contradaEstratta;

  if (Object.keys(assegnazione.assegnazioni).length >= datiPalio.lotto.length) {
    assegnazione.completata = true;
    const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
    S.log.push(`Assegnazione dei cavalli completata per il Palio di ${nomePalio} ${S.anno}.`);
  }

  salvaCorrente();
  renderAssegnazioneCavalli(tipoPalio);
}

function renderAssegnazioneCavalli(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;

  const lotto = datiPalio.lotto;
  if (!lotto) { avanzaFasePalio(tipoPalio, 2); return; }

  const assegnazione = preparaAssegnazioneCavalli(tipoPalio);
  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 3;

  const progressHtml = FASI_PALIO.map((f, i) => `
    <div style="width:${100/FASI_PALIO.length - 1}%;height:4px;border-radius:2px;background:${i <= faseIdx ? 'var(--ocra)' : 'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  // Indice del primo cavallo ancora da assegnare (il prossimo su cui si può estrarre)
  const idxAttivo = lotto.findIndex(e => !assegnazione.assegnazioni[e.cavallo.nome]);

  const righeHtml = lotto.map((entry, idx) => {
    const nomeCavallo = entry.cavallo.nome;
    const nomeContrada = assegnazione.assegnazioni[nomeCavallo];
    const assegnato = !!nomeContrada;

    let boxDx;
    if (assegnato) {
      const cd = CONTRADE.find(c => c.nome === nomeContrada);
      boxDx = `
        <div style="width:58px;height:58px;border-radius:10px;background:rgba(46,92,26,.14);border:2px solid var(--verde);display:flex;align-items:center;justify-content:center;overflow:hidden">
          ${cd ? `<img src="${IMG_BASE}${cd.img}" alt="${nomeContrada}" style="width:42px;height:42px;object-fit:contain" onerror="this.style.opacity='.15'">` : '<span style="font-size:22px">🏛️</span>'}
        </div>
        <div style="font-family:var(--fn);font-size:10px;font-weight:700;color:var(--ocra-l);text-align:center;line-height:1.25;margin-top:4px;max-width:70px;overflow-wrap:break-word">${nomeContrada}</div>`;
    } else {
      boxDx = `
        <div style="width:58px;height:58px;border-radius:10px;background:rgba(200,153,30,.05);border:2px dashed ${eAttivo?'rgba(200,153,30,.55)':'rgba(200,153,30,.22)'};display:flex;align-items:center;justify-content:center">
          <span style="font-size:24px;opacity:${eAttivo?'1':'.45'}">❓</span>
        </div>
        ${eAttivo
          ? `<button class="btn gold" style="padding:5px 9px;min-height:0;font-size:10px;margin-top:5px;line-height:1.2" onclick="estraiAssegnazioneCavallo('${tipoPalio}')">🎲 Estrai</button>`
          : `<div style="font-family:var(--fn);font-size:9px;color:rgba(200,153,30,.25);text-align:center;margin-top:6px;font-style:italic">in attesa</div>`
        }`;
    }

    return `
    <div style="display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,#2C1208,#1A0A04);
                border:${assegnato?'1px solid rgba(46,92,26,.4)':eAttivo?'1px solid rgba(200,153,30,.45)':'1px solid rgba(200,153,30,.16)'};
                border-radius:13px;padding:11px 12px;margin-bottom:9px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,${assegnato?'var(--verde)':eAttivo?'var(--ocra)':'rgba(200,153,30,.12)'},transparent)"></div>
      <div style="flex:1;display:flex;align-items:center;gap:9px;min-width:0">
        <span style="font-size:18px;flex-shrink:0">🐎</span>
        <div style="min-width:0">
          <div style="font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ocra-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nomeCavallo}</div>
          <div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.38)">${entry.voti} voti nel lotto</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
        ${boxDx}
      </div>
    </div>`;
  }).join('');

  const nAssegnati = Object.keys(assegnazione.assegnazioni).length;
  const tutteAssegnate = nAssegnati >= lotto.length;

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx + 1}/${FASI_PALIO.length}</span>
    </div>
    <div class="pad fade-in">

      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">
        ${progressHtml}
      </div>

      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:40px;margin-bottom:6px">✅</div>
        <div class="screen-title">Assegnazione Cavalli</div>
        <div class="screen-sub" style="margin-bottom:0">Estrazione a sorte: una contrada per ogni cavallo del lotto</div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Come funziona</div>
        <div style="font-family:var(--fn);font-size:12px;color:var(--perg2);line-height:1.7">
          Tocca <strong style="color:var(--ocra)">Estrai</strong> per sorteggiare una delle 10 contrade partecipanti.
          La contrada estratta viene abbinata al primo cavallo del lotto ancora libero.
          Si ripete l'estrazione finché tutti i 10 cavalli non hanno una contrada.
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(200,153,30,.12);display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Assegnazioni completate</div>
          <div style="font-family:var(--fn);font-size:16px;font-weight:700;color:${tutteAssegnate?'var(--verde)':'var(--ocra-l)'}">${nAssegnati} / ${lotto.length}</div>
        </div>
      </div>

      ${righeHtml}

      ${tutteAssegnate ? `
      <button class="btn gold w" style="margin-top:4px" onclick="avanzaFasePalio('${tipoPalio}', 4)">
        ${FASI_PALIO[4].icona} ${FASI_PALIO[4].titolo} →
      </button>` : ''}
    </div>
  </div>
  `);
}

/* ═══════════════════════════════════════════════
   INGAGGIO DEL FANTINO — fase 5 del Palio
   Il giocatore tratta con i fantini del database (FANTINI_DB)
   per ingaggiarne uno per questo Palio. Nove fantini sono già
   stati presi a sorte dalle altre contrade partecipanti: resta
   un solo pool di fantini disponibili tra cui scegliere.
   Ogni fantino accetta o rifiuta l'offerta secondo una formula
   basata sulle sue statistiche, l'intesa col giocatore e il
   prestigio della contrada, con un fattore casuale 0.8–1.2.
═══════════════════════════════════════════════ */

function preparaIngaggioFantini(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return null;
  if (typeof FANTINI_DB === 'undefined' || !FANTINI_DB.length) return null;

  if (!S.intesaFantini) S.intesaFantini = {};
  FANTINI_DB.forEach(f => {
    if (S.intesaFantini[f.nome] === undefined) S.intesaFantini[f.nome] = Math.floor(Math.random() * 101);
  });

  if (!datiPalio.ingaggio) {
    datiPalio.ingaggio = {
      fantiniEsclusi: [],     // i 9 nomi finiti alle altre contrade (vuoto finché non scatta l'esclusione)
      esclusioneFatta: false, // diventa true non appena scatta l'esclusione dei 9 (dopo un ingaggio o un giro fallito)
      rifiutati: [],          // nomi che hanno rifiutato nel giro corrente
      ingaggiato: null,       // nome del fantino ingaggiato dal giocatore
      costoIngaggio: null
    };
    salvaCorrente();
  }
  return datiPalio.ingaggio;
}

/* Elenco dei fantini attualmente proponibili: tutti tranne quelli già finiti alle altre contrade */
function poolFantiniDisponibili(ing) {
  return FANTINI_DB.map(f => f.nome).filter(n => !ing.fantiniEsclusi.includes(n));
}

/* Assegna a sorte 9 fantini alle altre contrade partecipanti, escludendo (se presente) quello
   appena ingaggiato dal giocatore. Scatta una sola volta per Palio: o dopo il primo ingaggio
   riuscito, o dopo il primo giro in cui tutti i fantini disponibili hanno rifiutato. */
function assegnaNoveFantiniAltrove(ing, nomeDaEscludereSempre) {
  if (ing.esclusioneFatta) return;
  const candidati = FANTINI_DB.map(f => f.nome).filter(n => n !== nomeDaEscludereSempre);
  for (let i = candidati.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidati[i], candidati[j]] = [candidati[j], candidati[i]];
  }
  const n = Math.min(9, candidati.length);
  ing.fantiniEsclusi = candidati.slice(0, n);
  ing.esclusioneFatta = true;
}

/* Offerta suggerita: stessa formula della soglia di accettazione, ma con fattore fisso 1.3
   (più alto del massimo fattore casuale 1.2) così da avere buone probabilità di successo. */
function offertaSuggeritaFantino(f) {
  const intesa = (S.intesaFantini && S.intesaFantini[f.nome]) || 0;
  const prestigio = S.prestigio || 0;
  const media = (f.bravura + f.esperienza + f.gestione_mossa + f.empatia) / 4;
  return Math.max(50, Math.round((media * 800 - (intesa + prestigio) * 10) * 1.3));
}

function renderIngaggioFantino(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;

  const ing = preparaIngaggioFantini(tipoPalio);
  if (!ing) {
    renderStubCapitano('Ingaggia il Fantino', '🤝', 'Il database dei fantini non è stato trovato. Verifica che il file fantini_db.js sia presente.');
    return;
  }

  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 4;

  const progressHtml = FASI_PALIO.map((f, i) => `
    <div style="width:${100/FASI_PALIO.length - 1}%;height:4px;border-radius:2px;background:${i <= faseIdx ? 'var(--ocra)' : 'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  // ── Card di conferma se il fantino è già stato ingaggiato: la trattativa finisce qui ──
  if (ing.ingaggiato) {
    setMain(`
    <div>
      <div class="hdr">
        <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
        <span class="hdr-right" style="font-size:10px">${faseIdx + 1}/${FASI_PALIO.length}</span>
      </div>
      <div class="pad fade-in">

        <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">
          ${progressHtml}
        </div>

        <div style="text-align:center;margin-bottom:14px">
          <div style="font-size:40px;margin-bottom:6px">🤝</div>
          <div class="screen-title">Ingaggia il Fantino</div>
          <div class="screen-sub" style="margin-bottom:0">Accordo raggiunto</div>
        </div>

        <div class="card" style="text-align:center;padding:18px 14px;margin-bottom:14px;border:2px solid var(--verde);box-shadow:0 0 18px rgba(46,92,26,.22)">
          <div style="font-size:34px;margin-bottom:8px">🤝</div>
          <div style="font-family:var(--fs);font-size:18px;font-weight:700;color:var(--ocra);margin-bottom:4px">Fantino ingaggiato!</div>
          <div style="font-family:var(--fn);font-size:13px;color:var(--ocra-l);margin-bottom:6px">🏇 <strong>${ing.ingaggiato}</strong> correrà per la tua contrada</div>
          <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Cifra concordata: <strong style="color:var(--ocra)">${ing.costoIngaggio} oro</strong></div>
          <div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.35);margin-top:10px;line-height:1.6">
            Le altre contrade partecipanti si sono accordate con altri 9 fantini: la trattativa è chiusa.
          </div>
          <button class="btn gold w" style="margin-top:14px" onclick="avanzaFasePalio('${tipoPalio}', 5)">
            ${FASI_PALIO[5].icona} ${FASI_PALIO[5].titolo} →
          </button>
        </div>
      </div>
    </div>
    `);
    return;
  }

  const pool = poolFantiniDisponibili(ing);

  // ── Elenco dei fantini disponibili ──
  const boxFantini = pool.map((nomeFantino, idx) => {
    const f = FANTINI_DB.find(x => x.nome === nomeFantino);
    if (!f) return '';
    const intesa = S.intesaFantini[nomeFantino] || 0;
    const colore = coloreBarraGenerica(intesa);
    const rifiutato = ing.rifiutati.includes(nomeFantino);
    const suggerita = offertaSuggeritaFantino(f);

    return `
    <div class="card" style="margin-bottom:10px;${rifiutato ? 'opacity:.55' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--ocra-l)">🏇 ${nomeFantino}</div>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.55);font-weight:700">Intesa: ${intesa}</div>
      </div>

      <div style="width:100%;height:7px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid rgba(200,153,30,.15);margin-bottom:10px">
        <div style="height:100%;width:${intesa}%;background:${colore};border-radius:5px"></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.5);width:62px">Bravura</span>
          ${pallinistat(f.bravura)}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.5);width:62px">Esperienza</span>
          ${pallinistat(f.esperienza)}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.5);width:62px">Gest. mossa</span>
          ${pallinistat(f.gestione_mossa)}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.5);width:62px">Empatia</span>
          ${pallinistat(f.empatia)}
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-top:8px;border-top:1px solid rgba(200,153,30,.1)">
        <span style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.42)">Offerta suggerita</span>
        <span style="font-family:var(--fn);font-size:13px;font-weight:700;color:var(--ocra)">💰 ${suggerita} oro</span>
      </div>

      ${rifiutato ? `
        <div style="font-family:var(--fn);font-size:11px;color:var(--ross);text-align:center;padding:6px 0;font-style:italic">
          ✗ Ha rifiutato la tua offerta — non puoi riproporgliela in questo giro.
        </div>` : `
        <div style="display:flex;gap:8px">
          <input id="INP_OFF_${idx}" class="inp" type="number" min="1" max="${S.oro}" inputmode="numeric"
                 placeholder="es. ${suggerita}" style="flex:1;width:auto;min-width:0;padding:11px 12px;font-size:14px">
          <button class="btn gold" style="padding:11px 14px;min-height:0;flex-shrink:0"
                  onclick="faiOffertaFantino('${tipoPalio}', ${idx})">Fai un'offerta</button>
        </div>`
      }
    </div>`;
  }).join('');

  const testoEsclusione = ing.esclusioneFatta
    ? `Dopo il primo giro di trattative andato a vuoto, <strong style="color:var(--ocra)">9 fantini</strong> sono stati assegnati a sorte alle altre contrade partecipanti. Restano <strong style="color:var(--ocra)">${pool.length} fantini disponibili</strong>.`
    : `Sono disponibili <strong style="color:var(--ocra)">tutti i ${pool.length} fantini</strong> del registro. Se tutti rifiutano la tua offerta, 9 di loro verranno assegnati a sorte alle altre contrade e l'elenco verrà riproposto senza di essi.`;

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx + 1}/${FASI_PALIO.length}</span>
    </div>
    <div class="pad fade-in">

      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">
        ${progressHtml}
      </div>

      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:40px;margin-bottom:6px">🤝</div>
        <div class="screen-title">Ingaggia il Fantino</div>
        <div class="screen-sub" style="margin-bottom:0">Tratta una cifra con uno dei fantini disponibili</div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Trattativa</div>
        <div style="font-family:var(--fn);font-size:12px;color:var(--perg2);line-height:1.7">
          ${testoEsclusione}
          Scegli una cifra di oro da offrire (non superiore al tuo budget).
          Se il fantino rifiuta, non potrai riproporgli un'offerta finché non avranno rifiutato anche tutti gli altri — a quel punto l'elenco viene riproposto e potrai riprovare.
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(200,153,30,.12);display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Budget disponibile</div>
          <div style="font-family:var(--fn);font-size:16px;font-weight:700;color:var(--ocra)">💰 ${S.oro} oro</div>
        </div>
      </div>

      ${boxFantini}
    </div>
  </div>
  `);
}

/* Gestisce l'offerta del giocatore a un fantino del pool disponibile */
function faiOffertaFantino(tipoPalio, idx) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.ingaggio) return;
  const ing = datiPalio.ingaggio;
  if (ing.ingaggiato) return; // già ingaggiato un fantino per questo Palio

  const pool = poolFantiniDisponibili(ing);
  const nomeFantino = pool[idx];
  if (!nomeFantino || ing.rifiutati.includes(nomeFantino)) return;

  const f = (typeof FANTINI_DB !== 'undefined') ? FANTINI_DB.find(x => x.nome === nomeFantino) : null;
  if (!f) return;

  const inputEl = R(`INP_OFF_${idx}`);
  const offerta = Math.floor(Number(inputEl?.value));

  if (!offerta || offerta <= 0 || isNaN(offerta)) {
    mostraPopupErrore('Offerta non valida', 'Inserisci una cifra di oro maggiore di zero.');
    return;
  }
  if (offerta > S.oro) {
    mostraPopupErrore('Oro insufficiente', `Non puoi offrire più di quanto possiedi: ${S.oro} oro.`);
    return;
  }

  if (!S.intesaFantini) S.intesaFantini = {};
  const intesa = S.intesaFantini[nomeFantino] || 0;
  const prestigio = S.prestigio || 0;
  const media = (f.bravura + f.esperienza + f.gestione_mossa + f.empatia) / 4;
  const fattore = 0.8 + Math.random() * 0.4; // 0.8 – 1.2
  const soglia = (media * 800 - (intesa + prestigio) * 10) * fattore;
  const accetta = offerta >= soglia;

  if (accetta) {
    // Il fantino accetta: budget scalato, intesa con lui +5 (dopo l'accettazione), intesa con tutti gli altri -5
    S.oro -= offerta;
    S.intesaFantini[nomeFantino] = Math.min(100, intesa + 5);
    FANTINI_DB.forEach(altro => {
      if (altro.nome === nomeFantino) return;
      const att = (S.intesaFantini[altro.nome] !== undefined) ? S.intesaFantini[altro.nome] : 0;
      S.intesaFantini[altro.nome] = Math.max(0, att - 5);
    });
    ing.ingaggiato = nomeFantino;
    ing.costoIngaggio = offerta;
    S.log.push(`Ingaggiato il fantino ${nomeFantino} per il Palio di ${tipoPalio === 'luglio' ? 'Luglio' : 'Agosto'} ${S.anno}: -${offerta} oro.`);

    // Appena un fantino accetta, le altre 9 contrade si accordano a sorte con altri 9 fantini
    // (esclude sempre quello appena ingaggiato dal giocatore). Scatta solo se non era già successo.
    assegnaNoveFantiniAltrove(ing, nomeFantino);

    verificaObiettivi();
    salvaCorrente();
    renderIngaggioFantino(tipoPalio);
    return;
  }

  // Il fantino rifiuta: budget invariato, intesa con lui -10, non più proponibile in questo giro
  S.intesaFantini[nomeFantino] = Math.max(0, intesa - 10);
  ing.rifiutati.push(nomeFantino);
  S.log.push(`${nomeFantino} ha rifiutato l'offerta di ${offerta} oro (intesa ora ${S.intesaFantini[nomeFantino]}).`);

  // Se tutti i fantini del pool attuale hanno rifiutato in questo giro:
  // - se è il primo giro (nessuna esclusione ancora avvenuta), 9 fantini vengono assegnati a sorte
  //   alle altre contrade e tolti dal pool;
  // - in ogni caso l'elenco dei rifiuti si azzera e il giocatore può riprovare.
  const poolAttuale = poolFantiniDisponibili(ing);
  const tuttiRifiutati = poolAttuale.length > 0 && poolAttuale.every(n => ing.rifiutati.includes(n));
  if (tuttiRifiutati) {
    if (!ing.esclusioneFatta) {
      assegnaNoveFantiniAltrove(ing, null);
    }
    ing.rifiutati = [];
    salvaCorrente();
    mostraPopupErrore('Tutti i fantini hanno rifiutato', 'Nessun fantino disponibile ha accettato la tua offerta. L\'elenco viene riproposto: puoi provare a contattarli di nuovo.');
  } else {
    salvaCorrente();
  }
  renderIngaggioFantino(tipoPalio);
}

function toggleSelezioneCavallo(tipoPalio, nomeCavallo) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;
  if (!datiPalio.sceltaCavalli) datiPalio.sceltaCavalli = { selezionati: [] };
  const sel = datiPalio.sceltaCavalli.selezionati;
  const idx = sel.indexOf(nomeCavallo);
  if (idx >= 0) {
    sel.splice(idx, 1);
  } else {
    if (sel.length < 10) {
      sel.push(nomeCavallo);
    } else {
      // Già 10 selezionati: feedback visivo senza aggiungere
      // (mostra un popup leggero)
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2C1208;border:1px solid var(--ocra);border-radius:8px;padding:10px 18px;font-family:var(--fn);font-size:12px;color:var(--ocra-l);z-index:9999;pointer-events:none;opacity:1;transition:opacity .4s';
      toast.textContent = 'Hai già selezionato 10 cavalli. Deselezionane uno prima.';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 1800);
      return;
    }
  }
  salvaCorrente();
  renderSceltaCavalliPalio(tipoPalio);
}

function avanzaFasePalio(tipoPalio, nuovaFase) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;
  datiPalio.faseCorrente = nuovaFase;
  salvaCorrente();
  renderFasePalio(tipoPalio, nuovaFase);
}

/* ═══════════════════════════════════════════════
   CENA DELLA VIGILIA — fase 6 del Palio
   Il giocatore decide se organizzare o no la cena della vigilia.
   - Organizzata: costa 1000 oro. Guadagno = (morale contradaioli +
     condizioni maniero) × 10 × random(0.8–1.2). Inoltre, solo per
     questo Palio: nervosismo del cavallo -1, empatia del fantino +1
     (modifiche temporanee salvate in datiPalio.modificheTempPalio e
     valide fino alla fine di questo Palio).
   - Non organizzata: nessuna spesa, ma morale contradaioli -20 e
     intesa con il fantino ingaggiato -10.
═══════════════════════════════════════════════ */
function eseguiCenaVigiliaPalio(tipoPalio, organizza) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || datiPalio.cenaVigilia) return; // scelta già effettuata

  if (!S.maniero) S.maniero = { morale:50, condizioni:50, azioniUsateMese:{}, probabilitaImprevisti:PROBABILITA_IMPREVISTI_BASE, annoProbabilitaRidotta:null, annoProtezioneUsata:null };
  const m = S.maniero;
  const nomeFantino = datiPalio.ingaggio ? datiPalio.ingaggio.ingaggiato : null;

  if (organizza) {
    if (S.oro < COSTO_CENA_VIGILIA) {
      mostraPopupErrore('Oro insufficiente', `Organizzare la cena della vigilia costa ${COSTO_CENA_VIGILIA} oro. Al momento ne possiedi ${S.oro}.`);
      return;
    }
    S.oro -= COSTO_CENA_VIGILIA;
    const fattore = 0.8 + Math.random() * 0.4;
    const guadagno = Math.round((m.morale + m.condizioni) * 10 * fattore);
    S.oro += guadagno;

    // Modifiche temporanee valide solo fino alla fine di questo Palio
    if (!datiPalio.modificheTempPalio) datiPalio.modificheTempPalio = { nervosismoOffset:0, empatiaOffset:0 };
    datiPalio.modificheTempPalio.nervosismoOffset = (datiPalio.modificheTempPalio.nervosismoOffset || 0) - 1;
    datiPalio.modificheTempPalio.empatiaOffset = (datiPalio.modificheTempPalio.empatiaOffset || 0) + 1;

    datiPalio.cenaVigilia = { organizzata: true, guadagno };
    S.log.push(`Cena della vigilia organizzata: -${COSTO_CENA_VIGILIA} oro, +${guadagno} oro di guadagno, nervosismo cavallo -1 e empatia fantino +1 (fino a fine Palio).`);
    salvaCorrente();
    window._cenaVigiliaRitorno = { tipoPalio, faseIdx: datiPalio.faseCorrente };
    mostraPopupRisultatoManiero('🍷 Cena della Vigilia',
      `La cena è stata un successo: la contrada intera ha cenato insieme nella notte prima del Palio.<br><br>
      Spesa: <strong style="color:var(--ross)">-${COSTO_CENA_VIGILIA} oro</strong><br>
      Guadagno: <strong style="color:var(--verde)">+${guadagno} oro</strong><br>
      Nervosismo del cavallo: <strong style="color:var(--verde)">-1</strong> (fino a fine Palio)<br>
      Empatia del fantino: <strong style="color:var(--verde)">+1</strong> (fino a fine Palio)`,
      'tornaAllaCenaVigilia'
    );
  } else {
    m.morale = Math.max(0, m.morale - 20);
    if (nomeFantino) {
      if (!S.intesaFantini) S.intesaFantini = {};
      const attuale = (S.intesaFantini[nomeFantino] !== undefined) ? S.intesaFantini[nomeFantino] : 50;
      S.intesaFantini[nomeFantino] = Math.max(0, attuale - 10);
    }
    datiPalio.cenaVigilia = { organizzata: false };
    S.log.push(`Cena della vigilia non organizzata: morale contradaioli -20${nomeFantino ? `, intesa con ${nomeFantino} -10` : ''}.`);
    salvaCorrente();
    window._cenaVigiliaRitorno = { tipoPalio, faseIdx: datiPalio.faseCorrente };
    mostraPopupRisultatoManiero('🚫 Cena della Vigilia',
      `La contrada ha rinunciato alla cena della vigilia. I contradaioli sono delusi e il fantino si sente meno coinvolto.<br><br>
      Morale dei contradaioli: <strong style="color:var(--ross)">-20</strong><br>
      ${nomeFantino ? `Intesa con ${nomeFantino}: <strong style="color:var(--ross)">-10</strong>` : ''}`,
      'tornaAllaCenaVigilia'
    );
  }
}

/* Callback usata dal popup di esito della Cena della Vigilia per tornare alla schermata di fase */

   >80 = alleato, <20 = rivale, altrimenti neutrale. Lo stato è dinamico:
   non dipende dal rapporto storico ma dal valore attuale, come richiesto. */

  if(valore > 80) return 'alleato';
  if(valore < 20) return 'rivale';
  return 'neutrale';
}
function coloreBarraAmicizia(valore){
  if(valore > 80) return 'var(--verde)';
  if(valore < 20) return 'var(--ross)';
  return 'var(--ocra)';
}

/* ═══════════════════════════════════════════════
   ACCORDI AL PALIO — fase 7: il capitano propone accordi segreti
   alle 9 contrade che partecipano al Palio (esclude la propria).
   Ogni contrada può accettare o rifiutare in base a una formula:
   soglia = (1500 − amicizia×10) × random(0.8–1.2)
   Se offerta ≥ soglia → accetta → rallenta (velocità cavallo −2 solo per questo Palio)
                        → amicizia +5
   Se offerta < soglia → rifiuta → amicizia −10 → nessun rallentamento
   Cifra suggerita = (1500 − amicizia×10) × 1.3
═══════════════════════════════════════════════ */

function preparaAccordiPalio(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return null;
  if (!datiPalio.accordiPalio) {
    datiPalio.accordiPalio = {
      accettati:  [],   // nomi contrade che hanno accettato
      rifiutati:  [],   // nomi contrade che hanno rifiutato
      completato: false
    };
    salvaCorrente();
  }
  return datiPalio.accordiPalio;
}

function renderAccordiPalio(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;

  const acc = preparaAccordiPalio(tipoPalio);
  if (!acc) return;

  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 6; // indice di 'accordi' in FASI_PALIO

  const progressHtml = FASI_PALIO.map((f, i) => `
    <div style="width:${100/FASI_PALIO.length - 1}%;height:4px;border-radius:2px;background:${i <= faseIdx ? 'var(--ocra)' : 'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  // Le 9 contrade partecipanti (esclusa la nostra)
  const partecipanti = datiPalio.partecipanti.filter(n => n !== S.contrada.nome);

  // Recupera fantino assegnato a ogni contrada dall'assegnazione
  const assegnazioni = datiPalio.assegnazione ? datiPalio.assegnazione.assegnazioni : {}; // { nomeCavallo: nomeContrada }
  // Inverti: { nomeContrada: nomeCavallo }
  const contradaCavallo = {};
  const cavalloContrada = assegnazioni; // nomeCavallo → nomeContrada
  Object.entries(cavalloContrada).forEach(([cav, con]) => { contradaCavallo[con] = cav; });

  // Fantini assegnati alle altre contrade: dal pool ingaggiato; usiamo esclusioneFatta/fantiniEsclusi
  // Per semplicità generiamo fantini per ogni contrada avversaria all'inizializzazione
  if (!datiPalio.fantiniContrade) {
    // Il fantino ingaggiato dal giocatore non deve poter finire anche a un'altra contrada
    const nomeFantinoGiocatore = datiPalio.ingaggio ? datiPalio.ingaggio.ingaggiato : null;
    // Assegna un fantino casuale da FANTINI_DB a ogni contrada partecipante diversa dalla nostra,
    // escludendo sempre il fantino del giocatore dal pool disponibile per le altre contrade
    const fantiniPool = (typeof FANTINI_DB !== 'undefined')
      ? FANTINI_DB.filter(f => f.nome !== nomeFantinoGiocatore)
      : [];
    // Shuffle
    for (let i = fantiniPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [fantiniPool[i], fantiniPool[j]] = [fantiniPool[j], fantiniPool[i]];
    }
    datiPalio.fantiniContrade = {};
    if (fantiniPool.length > 0) {
      partecipanti.forEach((nc, idx) => {
        datiPalio.fantiniContrade[nc] = fantiniPool[idx % fantiniPool.length];
      });
    }
    salvaCorrente();
  }

  const boxContrade = partecipanti.map((nomeContrada, idx) => {
    const cd = CONTRADE.find(c => c.nome === nomeContrada);
    if (!cd) return '';
    const amicizia = (S.amicizia && S.amicizia[nomeContrada] !== undefined) ? S.amicizia[nomeContrada] : 50;
    const coloreAm = coloreBarraAmicizia(amicizia);
    const nomeCavallo = contradaCavallo[nomeContrada] || null;
    const cavalloObj = nomeCavallo && datiPalio.lotto ? datiPalio.lotto.find(e => e.cavallo.nome === nomeCavallo) : null;
    const fantinoObj = datiPalio.fantiniContrade ? datiPalio.fantiniContrade[nomeContrada] : null;

    const haAccettato = acc.accettati.includes(nomeContrada);
    const haRifiutato = acc.rifiutati.includes(nomeContrada);
    const giaCoinvolta = haAccettato || haRifiutato;

    const cifraBase = Math.max(50, Math.round((1500 - amicizia * 10)));
    const cifraConsigliata = Math.round(cifraBase * 1.3);

    // Dati cavallo (risultati tratta e corse)
    let cavalloHtml = '';
    if (nomeCavallo) {
      const voti = cavalloObj ? cavalloObj.voti : '—';
      const scoreAnno = S.scoreCavalliAnno ? S.scoreCavalliAnno[nomeCavallo] : null;
      let corseHtml = '';
      if (scoreAnno && scoreAnno.corse > 0) {
        corseHtml = `<div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.5);margin-top:3px">
          Corse in prov.: ${scoreAnno.corse} | Vittorie: ${scoreAnno.vittorie||0} | Punti: ${scoreAnno.punti||0}
        </div>`;
      }
      cavalloHtml = `
        <div style="padding:8px 0 4px;border-top:1px solid rgba(200,153,30,.1);margin-top:6px">
          <div style="font-family:var(--fn);font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(200,153,30,.38);margin-bottom:4px">🐎 Cavallo assegnato</div>
          <div style="font-family:var(--fn);font-size:12px;font-weight:700;color:var(--ocra-l)">${nomeCavallo} <span style="font-weight:400;color:rgba(200,153,30,.45)">· ${voti} voti lotto</span></div>
          ${corseHtml}
        </div>`;
    }

    // Dati fantino
    let fantinoHtml = '';
    if (fantinoObj) {
      fantinoHtml = `
        <div style="padding:8px 0 4px;border-top:1px solid rgba(200,153,30,.1);margin-top:6px">
          <div style="font-family:var(--fn);font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(200,153,30,.38);margin-bottom:5px">🏇 Fantino</div>

function faiOffertaAccordoPalio(tipoPalio, nomeContrada, idx) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.accordiPalio) return;
  const acc = datiPalio.accordiPalio;

  if (acc.accettati.includes(nomeContrada) || acc.rifiutati.includes(nomeContrada)) return;

  const inputEl = document.getElementById(`INP_ACC_${idx}`);
  const cifra = parseInt(inputEl ? inputEl.value : '0', 10);

  if (!cifra || cifra <= 0) {
    mostraPopupErrore('Cifra non valida', 'Inserisci una cifra in oro da offrire.');
    return;
  }
  if (cifra > S.oro) {
    mostraPopupErrore('Oro insufficiente', `Non hai abbastanza oro. Budget disponibile: ${S.oro} oro.`);
    return;
  }

  const amicizia = (S.amicizia && S.amicizia[nomeContrada] !== undefined) ? S.amicizia[nomeContrada] : 50;
  const base = 1500 - amicizia * 10;
  const fattore = 0.8 + Math.random() * 0.4;
  const soglia = Math.max(0, Math.round(base * fattore));

  if (cifra >= soglia) {
    // Accetta
    S.oro -= cifra;
    acc.accettati.push(nomeContrada);
    if (!S.amicizia) S.amicizia = {};
    S.amicizia[nomeContrada] = Math.min(100, (S.amicizia[nomeContrada] || 50) + 5);
    // Salva il rallentamento temporaneo nel datiPalio
    if (!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
    datiPalio.velocitaOffsetContrade[nomeContrada] = -2;
    S.log.push(`Accordo con ${nomeContrada} al Palio: -${cifra} oro. Rallenterebbe durante la corsa. Amicizia +5 (ora ${S.amicizia[nomeContrada]}).`);
    salvaCorrente();
    mostraPopupRisultatoAccordoPalio('✅ Accordo accettato!',
      `<strong style="color:var(--ocra)">${nomeContrada}</strong> ha accettato l'offerta di <strong style="color:var(--ocra)">${cifra} oro</strong>.<br><br>
      Durante la Carriera il suo fantino rallenterà per lasciarti passare.<br>
      <span style="color:var(--verde)">Amicizia +5</span>`,
      tipoPalio
    );
  } else {
    // Rifiuta — i soldi non vengono scalati
    acc.rifiutati.push(nomeContrada);
    if (!S.amicizia) S.amicizia = {};
    S.amicizia[nomeContrada] = Math.max(0, (S.amicizia[nomeContrada] || 50) - 10);
    S.log.push(`${nomeContrada} ha rifiutato l'accordo al Palio. Amicizia -10 (ora ${S.amicizia[nomeContrada]}).`);
    salvaCorrente();
    mostraPopupRisultatoAccordoPalio('✗ Offerta rifiutata',
      `<strong style="color:var(--ocra)">${nomeContrada}</strong> ha rifiutato l'offerta di <strong style="color:var(--ocra)">${cifra} oro</strong>.<br><br>
      Il tuo oro è rimasto intatto, ma l'amicizia con la contrada è calata.<br>
      <span style="color:var(--ross)">Amicizia −10</span>`,
      tipoPalio
    );
  }
}

function mostraPopupRisultatoAccordoPalio(titolo, corpo, tipoPalio) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
  <div class="popup">
    <div class="popup-icon">${titolo.startsWith('✅') ? '🤝' : '🚫'}</div>
    <div class="popup-title">${titolo}</div>
    <div class="popup-body">${corpo}</div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove();renderAccordiPalio('${tipoPalio}')">Continua</button>
  </div>`;
  R('APP').appendChild(ov);
}

function saltoAccordiPalio(tipoPalio) {
  avanzaFasePalio(tipoPalio, 7);
}

        <div style="height:100%;width:${intesa}%;background:${coloreIntesa};border-radius:5px"></div>

function scegliTatticaPalio(tipoPalio, idTattica) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || datiPalio.tattica) return;

  const t = TATTICHE_PALIO.find(x => x.id === idTattica);
  if (!t) return;

  const nomeFantino = datiPalio.ingaggio ? datiPalio.ingaggio.ingaggiato : null;
  const intesa = (nomeFantino && S.intesaFantini) ? (S.intesaFantini[nomeFantino] || 0) : 0;
  const bonusTattica = S.contrada?.bonusKey === 'bonus_tattica' ? S.contrada.bonusVal : 0;
  const accetta = (Math.random() * 100) < (intesa + bonusTattica);

  if (accetta) {
    if (!datiPalio.modificheTempPalio) datiPalio.modificheTempPalio = {};
    Object.entries(t.modifiche).forEach(([stat, delta]) => {
      datiPalio.modificheTempPalio[stat] = (datiPalio.modificheTempPalio[stat] || 0) + delta;
    });
    if (t.nemiciAnche) {
      if (!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
      if (!datiPalio.resistenzaOffsetContrade) datiPalio.resistenzaOffsetContrade = {};
      const nemici = (datiPalio.partecipanti || []).filter(n => {
        if (n === S.contrada.nome) return false;
        const am = (S.amicizia && S.amicizia[n] !== undefined) ? S.amicizia[n] : 50;
        return am < 20;
      });
      nemici.forEach(nc => {
        datiPalio.velocitaOffsetContrade[nc] = (datiPalio.velocitaOffsetContrade[nc] || 0) - 2;
        datiPalio.resistenzaOffsetContrade[nc] = (datiPalio.resistenzaOffsetContrade[nc] || 0) - 2;
      });
    }
    datiPalio.tattica = { id: idTattica, accettata: true };
    S.log.push(`Tattica "${t.titolo}" accettata dal fantino ${nomeFantino||'—'}.`);
    salvaCorrente();
    mostraPopupTatticaPalio(true, nomeFantino, t, tipoPalio);
  } else {
    if (nomeFantino && S.intesaFantini) {
      S.intesaFantini[nomeFantino] = Math.max(0, (S.intesaFantini[nomeFantino] || 0) - 10);
    }
    datiPalio.tattica = { id: idTattica, accettata: false };
    S.log.push(`Tattica "${t.titolo}" rifiutata dal fantino ${nomeFantino||'—'}. Intesa −10.`);
    salvaCorrente();
    mostraPopupTatticaPalio(false, nomeFantino, t, tipoPalio);
  }
}

function mostraPopupTatticaPalio(accetta, nomeFantino, t, tipoPalio) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const bodyAccetta = `<strong style="color:var(--ocra)">${nomeFantino || 'Il fantino'}</strong> annuisce e stringe il morso.<br><br><em style="color:var(--ocra-l)">"Sarà fatto, capitano."</em><br><br>${t.dettaglio}${t.nemiciAnche ? '<br><br><span style="color:var(--ross)">Tenterà di ostacolare la contrada nemica.</span>' : ''}`;
  const bodyRifiuto = `<strong style="color:var(--ocra)">${nomeFantino || 'Il fantino'}</strong> ti guarda e scuote la testa.<br><br><em style="color:rgba(200,153,30,.6)">"Capitano, ho la mia testa."</em><br><br>Le istruzioni non verranno seguite.<br><span style="color:var(--ross)">Intesa con ${nomeFantino||'il fantino'} −10</span>`;
  ov.innerHTML = `
  <div class="popup">
    <div class="popup-icon">${accetta ? '🤝' : '😤'}</div>
    <div class="popup-title" style="color:${accetta ? 'var(--verde)' : 'var(--ross)'}">${accetta ? 'Tattica Accettata' : 'Tattica Rifiutata'}</div>
    <div class="popup-body" style="text-align:left;padding:0 2px">${accetta ? bodyAccetta : bodyRifiuto}</div>
    <button class="btn gold w" style="margin-top:14px" onclick="this.closest('.overlay').remove();renderTatticaPalio('${tipoPalio}')">Continua</button>
  </div>`;
  R('APP').appendChild(ov);
}

/* ═══════════════════════════════════════════════
   ESTRAZIONE AL CANAPO — fase (indice 8)
   Le 10 contrade partecipanti vengono sorteggiate una ad una e
   piazzate, in ordine, nei 10 box della mossa: dalla posizione 1
   alla posizione 9, poi nell'ultimo box "di rincorsa".
   Effetti (modifiche temporanee valide fino a fine Palio):
   - La contrada estratta "di rincorsa" subisce Velocità −1.
   - Se la contrada del giocatore finisce in una posizione adiacente
     a quella di una contrada nemica (es. posizione 4 e 3 o 5),
     il cavallo del giocatore subisce Nervosismo +2 per ogni
     contrada nemica adiacente trovata.
═══════════════════════════════════════════════ */

function preparaCanapoPalio(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.partecipanti) return null;
  if (!datiPalio.canapo) {
    datiPalio.canapo = {
      assegnazioni: {},                                   // { posizione (1-10): nomeContrada }
      contradeRimanenti: datiPalio.partecipanti.slice(),  // pool da cui estrarre a sorte
      effetti: [],                                         // log testuale degli effetti applicati durante il sorteggio
      completata: false
    };
    salvaCorrente();
  }
  return datiPalio.canapo;
}

/* Le posizioni adiacenti esistono solo tra 1 e 9: la "rincorsa" (10) non ha vicini al canape */
function posizioniAdiacentiCanapo(pos) {
  if (pos < 1 || pos > 9) return [];
  const adiacenti = [];
  if (pos > 1) adiacenti.push(pos - 1);
  if (pos < 9) adiacenti.push(pos + 1);
  return adiacenti;
}

function estraiCanapoPalio(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;
  const canapo = preparaCanapoPalio(tipoPalio);
  if (!canapo || canapo.completata) return;

  // Trova la prossima posizione libera, in ordine: 1,2,...,9, poi "di rincorsa" (10)
  let prossimaPos = null;
  for (let p = 1; p <= 10; p++) {
    if (!canapo.assegnazioni[p]) { prossimaPos = p; break; }
  }
  if (prossimaPos === null || canapo.contradeRimanenti.length === 0) return;

  // Estrazione a sorte di una contrada tra quelle rimaste
  const idx = Math.floor(Math.random() * canapo.contradeRimanenti.length);
  const contradaEstratta = canapo.contradeRimanenti.splice(idx, 1)[0];
  canapo.assegnazioni[prossimaPos] = contradaEstratta;

  const labelPos = prossimaPos <= 9 ? `posizione ${prossimaPos}` : 'di rincorsa';
  S.log.push(`Estrazione al canapo: ${contradaEstratta} sorteggiata ${labelPos}.`);

  // Effetto 1 — la contrada "di rincorsa" subisce un calo di velocità (-1, fino a fine Palio)
  if (prossimaPos === 10) {
    if (!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
    datiPalio.velocitaOffsetContrade[contradaEstratta] = (datiPalio.velocitaOffsetContrade[contradaEstratta] || 0) - 1;
    canapo.effetti.push(`🐎 <strong style="color:var(--ocra-l)">${contradaEstratta}</strong> parte di rincorsa: Velocità <strong style="color:var(--ross)">−1</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>`);
    S.log.push(`${contradaEstratta} parte di rincorsa: velocità -1 (fino a fine Palio).`);
  }

  // Effetto 2 — posizione adiacente tra la contrada del giocatore e un'altra già piazzata:
  // se nemica: nervosismo cavallo +2; se alleata: nervosismo cavallo -1 (fino a fine Palio)
  posizioniAdiacentiCanapo(prossimaPos).forEach(p => {
    const vicina = canapo.assegnazioni[p];
    if (!vicina) return;
    const coinvolgeGiocatore = (contradaEstratta === S.contrada.nome && vicina !== S.contrada.nome)
      || (vicina === S.contrada.nome && contradaEstratta !== S.contrada.nome);
    if (!coinvolgeGiocatore) return;
    const altra = (contradaEstratta === S.contrada.nome) ? vicina : contradaEstratta;
    const amiciziaAltra = (S.amicizia && S.amicizia[altra] !== undefined) ? S.amicizia[altra] : 50;
    const eAlleata = amiciziaAltra > 80;
    const eNemica = amiciziaAltra < 20;
    if (!datiPalio.modificheTempPalio) datiPalio.modificheTempPalio = {};
    if (eAlleata) {
      datiPalio.modificheTempPalio.nervosismoOffset = (datiPalio.modificheTempPalio.nervosismoOffset || 0) - 1;
      canapo.effetti.push(`😌 <strong style="color:var(--ocra-l)">${S.contrada.nome}</strong> è adiacente all'alleata <strong style="color:var(--verde)">${altra}</strong> al canape: Nervosismo del cavallo <strong style="color:var(--verde)">−1</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>`);
      S.log.push(`Posizione adiacente tra ${S.contrada.nome} e l'alleata ${altra} al canape: nervosismo cavallo -1 (fino a fine Palio).`);
    } else if (eNemica) {
      datiPalio.modificheTempPalio.nervosismoOffset = (datiPalio.modificheTempPalio.nervosismoOffset || 0) + 2;
      canapo.effetti.push(`😬 <strong style="color:var(--ocra-l)">${S.contrada.nome}</strong> è adiacente alla nemica <strong style="color:var(--ross)">${altra}</strong> al canape: Nervosismo del cavallo <strong style="color:var(--ross)">+2</strong> <span style="color:rgba(200,153,30,.4)">(fino a fine Palio)</span>`);
      S.log.push(`Posizione adiacente tra ${S.contrada.nome} e la nemica ${altra} al canape: nervosismo cavallo +2 (fino a fine Palio).`);
    }
  });

  if (Object.keys(canapo.assegnazioni).length >= 10) {
    canapo.completata = true;
    S.log.push('Estrazione al canapo completata: tutte le 10 posizioni sono state stabilite.');
  }

  salvaCorrente();
  renderCanapoPalio(tipoPalio);
}

function renderCanapoPalio(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;

        </div>
        <div style="font-family:var(--fn);font-size:9px;font-weight:700;color:${eIoGiocatore?'var(--ocra)':'var(--ocra-l)'};text-align:center;line-height:1.2;margin-top:4px;overflow-wrap:break-word">${nomeContrada}</div>`;
    } else {

  const effettiHtml = (canapo.effetti && canapo.effetti.length)
    ? `<div class="card" style="margin-top:12px">

      </div>`
    : '';

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx + 1}/${FASI_PALIO.length}</span>
    </div>
    <div class="pad fade-in">

      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">
        ${progressHtml}
      </div>

      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:40px;margin-bottom:6px">🎯</div>
        <div class="screen-title">Estrazione al Canapo</div>
        <div class="screen-sub" style="margin-bottom:0">Il sorteggio stabilisce la posizione alla mossa di ogni contrada</div>

/* ═══════════════════════════════════════════════
   ACCORDO — paga 300 oro per +10 amicizia con una contrada (non rivale)
═══════════════════════════════════════════════ */
const COSTO_ACCORDO = 300;
const BONUS_ACCORDO = 10;

function renderAccordoContrade(){
  if(!S) return;
  const altre = CONTRADE.filter(c=>c.nome !== S.contrada.nome);

  const righeHtml = altre.map(c=>{
    const valore = (S.amicizia[c.nome] !== undefined) ? S.amicizia[c.nome] : 50;
    const stato = statoRelazione(valore);
    const eRivale = stato === 'rivale';
    return `
    <button class="sec-btn" ${eRivale?'disabled':''} onclick="confermaAccordoContrade('${escJs(c.nome)}')">
      <img src="${IMG_BASE}${c.img}" alt="${c.nome}"
           style="width:26px;height:26px;object-fit:contain;border-radius:4px;background:rgba(0,0,0,.2);flex-shrink:0"
           onerror="this.style.opacity='.15'">
      <div>
        <div class="sec-btn-label">${c.nome}${eRivale?' · <span style="color:var(--ross)">rivale, accordo impossibile</span>':''}</div>
        <div class="sec-btn-sub">Amicizia attuale: ${valore}</div>
      </div>
      <span class="sec-btn-chev">${eRivale?'✕':'›'}</span>
    </button>`;
  }).join('');

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderInfoContrade()">‹</button>
      <span class="hdr-title">Accordo</span>
      <span class="hdr-right" style="font-size:10px">💰 ${S.oro}</span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🤝 Stringi un Accordo</div>
      <div class="screen-sub">Paga ${COSTO_ACCORDO} oro per ottenere +${BONUS_ACCORDO} di amicizia. Non è possibile stringere accordi con le contrade rivali.</div>
      <div class="card">
        <div class="card-title">Scegli la Contrada</div>
        ${righeHtml}
      </div>
    </div>
  </div>
  `);
}

function confermaAccordoContrade(nomeContrada){
  if(!S) return;
  const valore = (S.amicizia[nomeContrada] !== undefined) ? S.amicizia[nomeContrada] : 50;
  if(statoRelazione(valore) === 'rivale'){
    mostraPopupErrore('Accordo impossibile', `${nomeContrada} è una contrada rivale: non è possibile stringere accordi diplomatici.`);
    return;
  }
  if(S.oro < COSTO_ACCORDO){
    mostraPopupErrore('Oro insufficiente', `Per stringere un accordo servono ${COSTO_ACCORDO} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🤝</div>
    <div class="popup-title">Confermi l'accordo?</div>
    <div class="popup-body">Pagherai <strong style="color:var(--ocra)">${COSTO_ACCORDO} oro</strong> per ottenere <strong style="color:var(--ocra)">+${BONUS_ACCORDO}</strong> di amicizia con <strong style="color:var(--ocra)">${nomeContrada}</strong>.</div>
    <div style="display:flex;gap:8px">
      <button class="btn w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove()">Annulla</button>
      <button class="btn gold w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove();eseguiAccordoContrade('${nomeContrada}')">Conferma</button>
    </div>
  </div>`;
  R('APP').appendChild(ov);
}

function eseguiAccordoContrade(nomeContrada){
  if(!S) return;
  S.oro -= COSTO_ACCORDO;
  const attuale = (S.amicizia[nomeContrada] !== undefined) ? S.amicizia[nomeContrada] : 50;
  S.amicizia[nomeContrada] = Math.min(100, attuale + BONUS_ACCORDO);
  S.log.push(`Accordo diplomatico con ${nomeContrada}: -${COSTO_ACCORDO} oro, +${BONUS_ACCORDO} amicizia (ora ${S.amicizia[nomeContrada]}).`);
  verificaObiettivi();
  salvaCorrente();
  renderAccordoContrade();
}

/* ═══════════════════════════════════════════════
   SCHERZO — selezione vittima + minigioco "ripeti la sequenza"
═══════════════════════════════════════════════ */
const EMOJI_SCHERZO = ['🍏','🍎','⚡','🥕','🐎','🏇'];
const LUNGHEZZA_SEQUENZA_SCHERZO = 6;
const MULTA_SCHERZO_FALLITO = 300;

/* ── Spionaggio: parametri del minigioco labirinto ── */
const LABIRINTO_DIM = 20;
const NUM_GUARDIE = 3;
const MULTA_SPIONAGGIO_FALLITO = 500;
const VELOCITA_GUARDIA_INIZIALE_MS = 1100; // ms tra una mossa e l'altra della guardia, all'inizio
const VELOCITA_GUARDIA_MINIMA_MS = 420;   // velocità massima (intervallo minimo) raggiungibile col tempo
const TEMPO_PER_AUMENTO_VELOCITA_MS = 7000; // ogni quanto le guardie accelerano

function renderScherzoContrade(){
  if(!S) return;

/* ── Minigioco Scherzo: memorizza e ripeti una sequenza di 6 emoji ── */
function avviaMinigiocoScherzo(nomeVittima){
  if(!S) return;
  // Civetta: sequenza più corta (4 invece di 6)
  const lunghezza = S.contrada?.bonusKey === 'scherzo_facile' ? 4 : LUNGHEZZA_SEQUENZA_SCHERZO;
  const sequenza = [];
  for(let i=0;i<lunghezza;i++){
    sequenza.push(EMOJI_SCHERZO[Math.floor(Math.random()*EMOJI_SCHERZO.length)]);
  }
  window._scherzoState = { nomeVittima, sequenza, inputGiocatore:[], faseMostrando:true };
  renderMinigiocoScherzo();
  setTimeout(()=>{
    if(window._scherzoState){
      window._scherzoState.faseMostrando = false;
      renderMinigiocoScherzo();
    }
  }, 1800 + lunghezza*650);
}

function inserisciEmojiScherzo(emoji){
  if(!S || !window._scherzoState) return;
  const st = window._scherzoState;
  if(st.faseMostrando) return;
  st.inputGiocatore.push(emoji);

  // Controllo immediato di correttezza progressiva
  const idx = st.inputGiocatore.length - 1;
  const corretto = (st.inputGiocatore[idx] === st.sequenza[idx]);

  if(!corretto){
    concludiMinigiocoScherzo(false);
    return;
  }
  if(st.inputGiocatore.length === st.sequenza.length){
    concludiMinigiocoScherzo(true);
    return;
  }
  renderMinigiocoScherzo();
}

    const rivaleVittima = (rel && rel.rivali.length) ? rel.rivali[0] : null;

    if(rivaleVittima){

      S.amicizia[rivaleVittima] = Math.min(100, attuale + 10);

    const attuale = (S.amicizia[nomeVittima]!==undefined) ? S.amicizia[nomeVittima] : 50;
    S.amicizia[nomeVittima] = Math.max(0, attuale - 10);
    S.log.push(`Scherzo fallito a ${nomeVittima}: multa -${MULTA_SCHERZO_FALLITO} oro, morale -10, amicizia con ${nomeVittima} -10.`);
    corpoPopup = `Lo scherzo a <strong style="color:var(--ocra)">${nomeVittima}</strong> è stato scoperto sul fatto!<br><br>Multa: <strong style="color:var(--ross)">-${MULTA_SCHERZO_FALLITO} oro</strong><br>Morale: <strong style="color:var(--ross)">-10</strong><br>Amicizia con ${nomeVittima}: <strong style="color:var(--ross)">-10</strong> (ora ${S.amicizia[nomeVittima]})`;
  }

  verificaObiettivi();
  salvaCorrente();
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`

    <div class="popup-icon">${successo?'🎭':'😬'}</div>

/* ── Generazione labirinto 20×20 con percorso garantito (recursive backtracker su stanze) ── */
function generaLabirinto(){
  const rooms = LABIRINTO_DIM / 2;
  const visited = Array.from({length:rooms}, ()=>Array(rooms).fill(false));
  const openN = Array.from({length:rooms}, ()=>Array(rooms).fill(false));
  const openS = Array.from({length:rooms}, ()=>Array(rooms).fill(false));
  const openE = Array.from({length:rooms}, ()=>Array(rooms).fill(false));
  const openO = Array.from({length:rooms}, ()=>Array(rooms).fill(false));

  function vicini(r,c){
    const out = [];
    if(r>0) out.push(['N',r-1,c]);
    if(r<rooms-1) out.push(['S',r+1,c]);
    if(c<rooms-1) out.push(['E',r,c+1]);
    if(c>0) out.push(['O',r,c-1]);
    for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
    return out;
  }

  const stack = [[0,0]];
  visited[0][0] = true;
  while(stack.length){
    const [r,c] = stack[stack.length-1];
    const nonVisitati = vicini(r,c).filter(([d,rr,cc])=>!visited[rr][cc]);
    if(!nonVisitati.length){ stack.pop(); continue; }
    const [d,rr,cc] = nonVisitati[0];
    if(d==='N'){ openN[r][c]=true; openS[rr][cc]=true; }
    if(d==='S'){ openS[r][c]=true; openN[rr][cc]=true; }
    if(d==='E'){ openE[r][c]=true; openO[rr][cc]=true; }
    if(d==='O'){ openO[r][c]=true; openE[rr][cc]=true; }
    visited[rr][cc] = true;
    stack.push([rr,cc]);
  }

  const size19 = 2*rooms - 1;
  const grid19 = Array.from({length:size19}, ()=>Array(size19).fill(1));
  for(let r=0;r<rooms;r++) for(let c=0;c<rooms;c++) grid19[2*r][2*c] = 0;
  for(let r=0;r<rooms;r++) for(let c=0;c<rooms;c++){
    if(openE[r][c] && c+1<rooms) grid19[2*r][2*c+1] = 0;
    if(openS[r][c] && r+1<rooms) grid19[2*r+1][2*c] = 0;
  }

  const size = LABIRINTO_DIM;
  const grid = Array.from({length:size}, ()=>Array(size).fill(1));
  for(let r=0;r<size19;r++) for(let c=0;c<size19;c++) grid[r][c] = grid19[r][c];
  for(let c=0;c<size19;c++) grid[size19][c] = grid19[size19-1][c];
  for(let r=0;r<size19;r++) grid[r][size19] = grid19[r][size19-1];
  grid[size19][size19] = grid19[size19-1][size19-1];
  return grid;
}

/* BFS: distanza di ogni cella libera raggiungibile dalla partenza, per posizionare le guardie lontano */
function celleLibereRaggiungibili(grid, partenza){
  const size = grid.length;
  const visitate = new Set([partenza.r+','+partenza.c]);
  const coda = [[partenza.r, partenza.c, 0]];
  const distanze = {};
  distanze[partenza.r+','+partenza.c] = 0;
  let idx = 0;
  while(idx < coda.length){
    const [r,c,d] = coda[idx++];
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=r+dr, nc=c+dc, key=nr+','+nc;
      if(nr>=0 && nr<size && nc>=0 && nc<size && grid[nr][nc]===0 && !visitate.has(key)){
        visitate.add(key);
        distanze[key] = d+1;
        coda.push([nr,nc,d+1]);
      }
    }
  }
  return distanze;
}

/* ═══════════════════════════════════════════════
   GAME LOOP — riscritto con requestAnimationFrame + sessionId
   per evitare in modo definitivo qualsiasi accumulo di timer:
   ogni sessione di gioco ha un proprio id incrementale; il loop
   precedente, anche se per qualche motivo fosse ancora "vivo",
   si auto-interrompe al primo controllo perché il suo id non
   corrisponde più a quello corrente. Nessun setTimeout ricorsivo:
   un solo requestAnimationFrame attivo per volta, sempre cancellato
   esplicitamente con cancelAnimationFrame prima di uscire o ripartire.
═══════════════════════════════════════════════ */
let _spioSessionId = 0;       // incrementato ad ogni avvio: invalida i loop precedenti
let _spioRafHandle = null;    // handle dell'unico requestAnimationFrame attivo
let _spioUltimoInputMs = 0;   // per il debounce dei tasti (anti key-repeat aggressivo)
const SPIO_DEBOUNCE_INPUT_MS = 90; // intervallo minimo tra due mosse del giocatore

function avviaMinigiocoSpionaggio(nomeVittima){
  if(!S) return;

  // Ferma in modo definitivo qualsiasi loop precedente prima di iniziarne uno nuovo
  fermaLoopSpionaggio();
  _spioSessionId++;
  const sessionId = _spioSessionId;

  const grid = generaLabirinto();
  const giocatore = { r:0, c:0 };
  const distanze = celleLibereRaggiungibili(grid, giocatore);

  const celleOrdinate = Object.keys(distanze).map(k=>{
    const [r,c] = k.split(',').map(Number);
    return {r,c,d:distanze[k]};
  }).sort((a,b)=>b.d-a.d);
  const guardie = celleOrdinate.slice(0, NUM_GUARDIE).map(p=>({r:p.r, c:p.c}));

  window._spionaggioState = {
    sessionId,
    nomeVittima,
    grid,
    giocatore,
    guardie,
    uscita: { r:LABIRINTO_DIM-1, c:LABIRINTO_DIM-1 },
    inizioTempo: performance.now(),
    ultimoTickGuardie: performance.now(),
    concluso: false
  };

  renderMinigiocoSpionaggio(); // costruisce lo scheletro DOM una sola volta
  aggiornaPosizioniSpionaggio(); // posiziona guardie/giocatore iniziali

  _spioRafHandle = requestAnimationFrame(loopSpionaggio);
}

function fermaLoopSpionaggio(){
  if(_spioRafHandle !== null){
    cancelAnimationFrame(_spioRafHandle);
    _spioRafHandle = null;
  }
}

function velocitaGuardiaAttuale(st){
  const trascorso = performance.now() - st.inizioTempo;
  const passiAumento = Math.floor(trascorso / TEMPO_PER_AUMENTO_VELOCITA_MS);
  const intervallo = VELOCITA_GUARDIA_INIZIALE_MS - passiAumento*30;
  // Giraffa: guardie ancora più lente (intervallo moltiplicato ×1.6, minimo più alto)
  const bonusGiraffa = S && S.contrada?.bonusKey === 'spionaggio_facile';
  const base = Math.max(VELOCITA_GUARDIA_MINIMA_MS, intervallo);
  return bonusGiraffa ? Math.max(VELOCITA_GUARDIA_MINIMA_MS * 1.8, base * 1.6) : base;
}

/* Unico loop di gioco: un frame alla volta, con guardia del sessionId per
   auto-disattivarsi se una nuova partita è stata avviata nel frattempo. */
function loopSpionaggio(now){
  const st = window._spionaggioState;
  // Se lo stato è stato azzerato, o appartiene a una sessione precedente, il loop si ferma da sé
  if(!st || st.sessionId !== _spioSessionId || st.concluso){
    _spioRafHandle = null;
    return;
  }

  const intervalloAttuale = velocitaGuardiaAttuale(st);
  if(now - st.ultimoTickGuardie >= intervalloAttuale){
    st.ultimoTickGuardie = now;
    muoviGuardie(st);
    if(controllaCatturaGiocatore(st)){
      concludiMinigiocoSpionaggio(false);
      return; // non richiedere un altro frame: la partita è conclusa
    }
    aggiornaPosizioniSpionaggio();
  }

  _spioRafHandle = requestAnimationFrame(loopSpionaggio);
}

/* Calcola, per ogni cella libera, la distanza reale (numero di passi nei corridoi) dal giocatore.
   Serve come "mappa di calore" che le guardie seguono in discesa per inseguire davvero
   attraverso il labirinto, invece di usare la distanza in linea d'aria (che spesso le portava
   a restare bloccate contro un muro, dando l'impressione che si muovessero poco). */
function calcolaMappaDistanzeDalGiocatore(st){
  const size = LABIRINTO_DIM;
  const dist = Array.from({length:size}, ()=>Array(size).fill(Infinity));
  dist[st.giocatore.r][st.giocatore.c] = 0;
  const coda = [[st.giocatore.r, st.giocatore.c]];
  let idx = 0;
  while(idx < coda.length){
    const [r,c] = coda[idx++];
    const d = dist[r][c];
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=r+dr, nc=c+dc;
      if(nr>=0 && nr<size && nc>=0 && nc<size && st.grid[nr][nc]===0 && dist[nr][nc]===Infinity){
        dist[nr][nc] = d+1;
        coda.push([nr,nc]);
      }
    }
  }
  return dist;
}

/* Ogni guardia segue la "mappa di calore" verso il giocatore, scegliendo sempre la cella
   vicina con distanza reale minore: questo le fa inseguire davvero attraverso i corridoi,
   con molto più movimento effettivo verso il giocatore rispetto a una semplice euristica
   in linea d'aria. Una piccola probabilità di mossa casuale evita che siano perfettamente
   prevedibili o che restino "incollate" l'una all'altra sullo stesso percorso. */
function muoviGuardie(st){
  const size = LABIRINTO_DIM;
  const mappaDistanze = calcolaMappaDistanzeDalGiocatore(st);

  st.guardie.forEach(g=>{
    const direzioni = [[-1,0],[1,0],[0,-1],[0,1]].filter(([dr,dc])=>{
      const nr=g.r+dr, nc=g.c+dc;
      return nr>=0 && nr<size && nc>=0 && nc<size && st.grid[nr][nc]===0;
    });
    if(!direzioni.length) return;

    let scelta;
    if(Math.random() < 0.22){
      // mossa casuale più frequente: le guardie sono meno precise nell'inseguire
      scelta = direzioni[Math.floor(Math.random()*direzioni.length)];
    } else {
      // segue la discesa della mappa di distanze reali: insegue sempre lungo i corridoi giusti
      direzioni.sort((a,b)=>{
        const distA = mappaDistanze[g.r+a[0]][g.c+a[1]];
        const distB = mappaDistanze[g.r+b[0]][g.c+b[1]];
        return distA - distB;
      });
      scelta = direzioni[0];
    }
    g.r += scelta[0];
    g.c += scelta[1];
  });
}

function controllaCatturaGiocatore(st){
  return st.guardie.some(g=>g.r===st.giocatore.r && g.c===st.giocatore.c);
}

function muoviGiocatoreSpionaggio(dr,dc){
  const st = window._spionaggioState;
  if(!st || st.concluso || st.sessionId !== _spioSessionId) return;

  // Debounce: ignora mosse troppo ravvicinate (es. key-repeat del sistema operativo)
  const ora = performance.now();
  if(ora - _spioUltimoInputMs < SPIO_DEBOUNCE_INPUT_MS) return;
  _spioUltimoInputMs = ora;

  const size = LABIRINTO_DIM;
  const nr = st.giocatore.r+dr, nc = st.giocatore.c+dc;
  if(nr<0 || nr>=size || nc<0 || nc>=size) return;
  if(st.grid[nr][nc] !== 0) return;
  st.giocatore.r = nr;
  st.giocatore.c = nc;
  aggiornaPosizioniSpionaggio();

  if(controllaCatturaGiocatore(st)){
    concludiMinigiocoSpionaggio(false);
    return;
  }
  if(st.giocatore.r === st.uscita.r && st.giocatore.c === st.uscita.c){
    concludiMinigiocoSpionaggio(true);
    return;
  }
}

/* Gestione tasti freccia/WASD da tastiera, attiva solo mentre il minigioco è in corso.
   Ignora gli eventi di key-repeat generati dal browser mentre un tasto resta premuto:
   l'evento nativo "keydown" può ripetersi a raffica (e.repeat === true), e gestirli
   tutti — sommato al loop delle guardie — era una delle cause del freeze percepito. */
function gestoreTastieraSpionaggio(e){
  if(!window._spionaggioState || window._spionaggioState.concluso) return;
  if(e.repeat) return;
  const mappa = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1],
                   w:[-1,0], s:[1,0], a:[0,-1], d:[0,1] };
  if(mappa[e.key]){
    e.preventDefault();
    muoviGiocatoreSpionaggio(mappa[e.key][0], mappa[e.key][1]);
  }
}
document.addEventListener('keydown', gestoreTastieraSpionaggio);

/* Costruisce lo scheletro DOM del labirinto UNA SOLA VOLTA: muri statici (mai più toccati)
   e tre elementi mobili (uscita, guardie, giocatore) identificati da id fissi.
   Da qui in avanti il movimento aggiorna solo lo style.transform di questi elementi,
   senza più richiamare setMain(): evita di rigenerare ~400 div ad ogni mossa/tick,
   che era la causa principale del freeze percepito durante il minigioco. */
function renderMinigiocoSpionaggio(){

/* Muove solo gli elementi mobili tramite transform, senza toccare il resto del DOM. */
function aggiornaPosizioniSpionaggio(){
  const st = window._spionaggioState;
  if(!st) return;
  const cellPx = 14;
  const uscitaEl = R('spio-uscita');
  if(uscitaEl) uscitaEl.style.transform = `translate(${st.uscita.c*cellPx}px, ${st.uscita.r*cellPx}px)`;
  st.guardie.forEach((g,i)=>{
    const el = R('spio-guardia-'+i);
    if(el) el.style.transform = `translate(${g.c*cellPx+1}px, ${g.r*cellPx+1}px)`;
  });
  const giocatoreEl = R('spio-giocatore');
  if(giocatoreEl) giocatoreEl.style.transform = `translate(${st.giocatore.c*cellPx+1}px, ${st.giocatore.r*cellPx+1}px)`;
}

function annullaMinigiocoSpionaggio(){
  fermaLoopSpionaggio();
  window._spionaggioState = null;
  renderSpionaggioContrade();
}

function concludiMinigiocoSpionaggio(successo){
  if(!S || !window._spionaggioState) return;
  const st = window._spionaggioState;
  st.concluso = true;
  fermaLoopSpionaggio();
  const nomeVittima = st.nomeVittima;

  if(!S.amicizia) S.amicizia = {};
  if(!S.maniero) S.maniero = { morale:50, condizioni:50, azioniUsateMese:{}, probabilitaImprevisti:PROBABILITA_IMPREVISTI_BASE, annoProbabilitaRidotta:null, annoProtezioneUsata:null };

  let corpoPopup;
  if(successo){
    let fantinoScoperto = null;
    if(typeof FANTINI_DB !== 'undefined' && FANTINI_DB.length){
      fantinoScoperto = FANTINI_DB[Math.floor(Math.random()*FANTINI_DB.length)].nome;
    }
    S.log.push(`Spionaggio riuscito su ${nomeVittima}: scoperta intesa con il fantino ${fantinoScoperto||'sconosciuto'}.`);
    corpoPopup = `La tua spia è tornata sana e salva con un'informazione preziosa.<br><br>La Contrada del <strong style="color:var(--ocra)">${nomeVittima}</strong> ha la maggiore intesa con il fantino <strong style="color:var(--ocra)">${fantinoScoperto||'sconosciuto'}</strong>.`;
  } else {
    S.oro = Math.max(0, S.oro - MULTA_SPIONAGGIO_FALLITO);
    S.maniero.morale = Math.max(0, S.maniero.morale - 20);
    const attuale = (S.amicizia[nomeVittima]!==undefined) ? S.amicizia[nomeVittima] : 50;
    S.amicizia[nomeVittima] = Math.max(0, attuale - 20);
    S.log.push(`Spionaggio fallito su ${nomeVittima}: multa -${MULTA_SPIONAGGIO_FALLITO} oro, morale -20, amicizia -20.`);
    corpoPopup = `La tua spia è stata catturata dalle guardie della Contrada del <strong style="color:var(--ocra)">${nomeVittima}</strong>!<br><br>Multa: <strong style="color:var(--ross)">-${MULTA_SPIONAGGIO_FALLITO} oro</strong><br>Morale: <strong style="color:var(--ross)">-20</strong><br>Amicizia con ${nomeVittima}: <strong style="color:var(--ross)">-20</strong> (ora ${S.amicizia[nomeVittima]})`;
  }

  window._spionaggioState = null;
  verificaObiettivi();
  salvaCorrente();
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">${successo?'🕵️':'🚨'}</div>
    <div class="popup-title">${successo?'Spionaggio Riuscito!':'Spionaggio Fallito'}</div>
    <div class="popup-body">${corpoPopup}</div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove();renderInfoContrade()">Torna a Info Contrade</button>
  </div>`;
  R('APP').appendChild(ov);
}

/* ── Organizza una cena: costo 200, guadagno = (morale+condizioni) × 5 × random(0.8–1.2) ── */
function eseguiCenaManiero(){
  if(!S || !S.maniero) return;
  const m = S.maniero;
  if(m.azioniUsateMese.cena) return;
  const costoCena = S.contrada?.bonusKey === 'cena_economica' ? S.contrada.bonusVal : MANIERO_AZIONI.cena.costo;
  if(S.oro < costoCena){
    mostraPopupErrore('Oro insufficiente', `Organizzare una cena costa ${costoCena} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  S.oro -= costoCena;
  const fattore = 0.8 + Math.random()*0.4;
  const guadagno = Math.round((m.morale + m.condizioni) * 5 * fattore);
  S.oro += guadagno;
  m.azioniUsateMese.cena = true;
  if(!S._storicoAzioni) S._storicoAzioni = {};
  S._storicoAzioni.cena = true;
  S.log.push(`Cena organizzata nel maniero: -${costoCena} oro di spesa, +${guadagno} oro di guadagno.`);
  verificaObiettivi();
  salvaCorrente();
  mostraPopupRisultatoManiero('🍷 Cena Organizzata', `La cena è stata un successo tra i contradaioli.<br><br>Spesa: <strong style="color:var(--ross)">-${costoCena} oro</strong><br>Guadagno: <strong style="color:var(--verde)">+${guadagno} oro</strong>`, 'renderManiero');
}

/* ── Vendita gadget: guadagno = morale × 2 × random(0.8–1.2) ── */
function eseguiGadgetManiero(){
  if(!S || !S.maniero) return;
  const m = S.maniero;
  if(m.azioniUsateMese.gadget) return;
  const fattore = 0.8 + Math.random()*0.4;
  const moltiplicatore = S.contrada?.bonusKey === 'gadget_triplo' ? S.contrada.bonusVal : 2;
  const guadagno = Math.round(m.morale * moltiplicatore * fattore);
  S.oro += guadagno;
  m.azioniUsateMese.gadget = true;
  if(!S._storicoAzioni) S._storicoAzioni = {};
  S._storicoAzioni.gadget = true;
  S.log.push(`Vendita di gadget di contrada: +${guadagno} oro di guadagno.`);
  verificaObiettivi();
  salvaCorrente();
  mostraPopupRisultatoManiero('🎁 Gadget Venduti', `I gadget della contrada sono andati a ruba in piazza.<br><br>Guadagno: <strong style="color:var(--verde)">+${guadagno} oro</strong>`, 'renderManiero');
}

/* ── Organizza un evento: costo 300, condizioni -5, morale +random(5–20) ── */
function eseguiEventoManiero(){
  if(!S || !S.maniero) return;
  const m = S.maniero;
  if(m.azioniUsateMese.evento) return;
  if(S.oro < MANIERO_AZIONI.evento.costo){
    mostraPopupErrore('Oro insufficiente', `Organizzare un evento costa ${MANIERO_AZIONI.evento.costo} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  S.oro -= MANIERO_AZIONI.evento.costo;
  const aumentoMorale = 5 + Math.floor(Math.random()*16); // 5–20
  m.condizioni = Math.max(0, m.condizioni - 5);
  m.morale = Math.min(100, m.morale + aumentoMorale);
  m.azioniUsateMese.evento = true;
  if(!S._storicoAzioni) S._storicoAzioni = {};
  S._storicoAzioni.evento = true;
  S.log.push(`Evento organizzato per la contrada: -${MANIERO_AZIONI.evento.costo} oro, -5 condizioni maniero, +${aumentoMorale} morale.`);
  verificaObiettivi();
  salvaCorrente();
  mostraPopupRisultatoManiero('🎉 Evento Organizzato', `I contradaioli hanno festeggiato con entusiasmo.<br><br>Spesa: <strong style="color:var(--ross)">-${MANIERO_AZIONI.evento.costo} oro</strong><br>Morale: <strong style="color:var(--verde)">+${aumentoMorale}</strong><br>Condizioni maniero: <strong style="color:var(--ross)">-5</strong>`, 'renderManiero');
}

/* ── Manutenzione: costo 500 (400 per Onda), condizioni +20, morale +5 ── */
function eseguiManutenzioneManiero(){
  if(!S || !S.maniero) return;
  const m = S.maniero;
  if(m.azioniUsateMese.manutenzione) return;
  const costoMan = S.contrada?.bonusKey === 'manutenzione_400' ? S.contrada.bonusVal : MANIERO_AZIONI.manutenzione.costo;
  if(S.oro < costoMan){
    mostraPopupErrore('Oro insufficiente', `La manutenzione del maniero costa ${costoMan} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  S.oro -= costoMan;
  m.condizioni = Math.min(100, m.condizioni + 20);
  m.morale = Math.min(100, m.morale + 5);
  m.azioniUsateMese.manutenzione = true;
  S.log.push(`Manutenzione del maniero: -${costoMan} oro, +20 condizioni, +5 morale.`);
  verificaObiettivi();
  salvaCorrente();
  renderManiero();
}

/* ── Proteggiti dagli scherzi: costo 500, riduce probabilità imprevisti 30%→20% per l'anno corrente, una volta all'anno ── */
function eseguiProtezioneManiero(){
  if(!S || !S.maniero) return;
  const m = S.maniero;
  if(m.annoProtezioneUsata === S.anno) return; // già usata quest'anno
  if(S.oro < MANIERO_AZIONI.protezione.costo){
    mostraPopupErrore('Oro insufficiente', `Proteggersi dagli scherzi costa ${MANIERO_AZIONI.protezione.costo} oro. Al momento ne possiedi ${S.oro}.`);
    return;
  }
  S.oro -= MANIERO_AZIONI.protezione.costo;
  m.probabilitaImprevisti = PROBABILITA_IMPREVISTI_RIDOTTA;
  m.annoProbabilitaRidotta = S.anno;
  m.annoProtezioneUsata = S.anno;
  S.log.push(`Protezione dagli scherzi attivata per l'anno ${S.anno}: -${MANIERO_AZIONI.protezione.costo} oro, probabilità imprevisti mensili dal 30% al 20%.`);
  salvaCorrente();
  renderManiero();
}

/* ── Helper: pallini statistica da 1 a 5, colorati in base al valore ── */
function pallinistat(valore){
  let d='';
  for(let i=1;i<=5;i++){
    const attivo = i<=valore;
    const colore = !attivo ? 'rgba(200,153,30,.12)'
                 : valore>=5 ? 'var(--verde)'
                 : valore>=3 ? 'var(--ocra)'
                 : 'var(--ross)';
    d += `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colore};border:1px solid ${attivo?colore:'rgba(200,153,30,.18)'};margin-right:3px"></span>`;
  }
  return d;
}
