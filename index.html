          </div>`}
        </div>` : ''}
        ${(fase.id !== 'cena_vigilia' || datiPalio.cenaVigilia) ? (!isUltima ? btnAvanti : '') : ''}
      </div>

      ${corpoExtra}
    </div>
  </div>
  `);
}

/* ═══════════════════════════════════════════════
   LA TRATTA — schermata dedicata con prove
   Cavalli ammessi: quelli con ≥2 corse in provincia nell'anno.
   Se non abbastanza dati (giocatore non ha fatto corse), si assegnano
   12 cavalli casuali senza mostrare statistiche di gara.
   I cavalli ammessi vengono divisi in gruppi da 5-6 e si gareggia
   sulla pista "senese" (con le due curve a 90°). Ad ogni cavallo
   si assegna un fantino rispettando il vincolo: lo stesso fantino
   non può montare due cavalli nella stessa prova.
═══════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════
   IL PALIO — CORSA IN PIAZZA DEL CAMPO
   Circuito "Piazza del Campo" = pista senese (2 curve a 90°).
   10 contrade corrono insieme, 3 giri del circuito.
   Il giocatore vede la classifica giro per giro.
   Il vincitore reale viene determinato dalla simulazione
   (non più pre-calcolato): calcolaVincitorePalio viene
   mantenuto per compatibilità ma non è più usato nella corsa.
═══════════════════════════════════════════════ */

const PISTA_CAMPO = PISTE_PROVINCIA.senese; // "Piazza del Campo" usa lo stesso layout senese
const NUM_GIRI_PALIO = 3;

const PREMI_ORO_PALIO = [5000,4000,3000,2000,1500,1000,750,500,250,0];
/* Premi in oro per la Carriera Fantino: solo i primi tre classificati vengono pagati.
   Gli altri effetti (fama, intesa, statistiche) sono gestiti a parte in renderVincitorePalioFantino. */
const PREMI_ORO_PALIO_FANTINO = [3000,2000,1000,0,0,0,0,0,0,0];

/* Prepara la simulazione del Palio: assegna cavallo e fantino a ogni contrada partecipante,
   poi simula giro per giro con il motore esistente (simulaCorsaCoppia modificato per 1 giro). */
function preparaCorsaPalio(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return null;
  if (datiPalio.corsaSimulata) return datiPalio.corsaSimulata;

  const partecipanti = datiPalio.partecipanti;

  /* Cavalli: usa le assegnazioni della fase "assegnazione" se presenti;
     altrimenti assegna cavalli casuali dal db. */
  const assegnazioni = datiPalio.assegnazione ? datiPalio.assegnazione.assegnazioni : {};
  // assegnazioni = { nomeCavallo: nomeContrada } — invertiamo
  const contradaCavallo = {}; // { nomeContrada: nomeCavallo }
  Object.entries(assegnazioni).forEach(([cav, con]) => { contradaCavallo[con] = cav; });

  const trovaCavallo = (nomeContrada) => {
    const nomeCav = contradaCavallo[nomeContrada];
    if (nomeCav && typeof CAVALLI_DB !== 'undefined') {
      const c = CAVALLI_DB.find(x => x.nome === nomeCav);
      if (c) return c;
    }
    // fallback: cavallo generico
    if (typeof CAVALLI_DB !== 'undefined' && CAVALLI_DB.length) {
      return CAVALLI_DB[Math.floor(Math.random() * CAVALLI_DB.length)];
    }
    return { nome:'Cavallo', velocita:3, resistenza:3, accelerazione:3, tenuta_curva:3, nervosismo:2 };
  };

  /* Fantino: il fantino del giocatore è quello ingaggiato; per le altre contrade
     usa fantiniContrade se già generato (fase accordi), altrimenti genera. */
  const nomeFantinoGiocatore = datiPalio.ingaggio ? datiPalio.ingaggio.ingaggiato : null;
  const fantiniContrade = datiPalio.fantiniContrade || {};

  const trovaFantino = (nomeContrada) => {
    if (nomeContrada === S.contrada.nome && nomeFantinoGiocatore && typeof FANTINI_DB !== 'undefined') {
      const f = FANTINI_DB.find(x => x.nome === nomeFantinoGiocatore);
      if (f) return f;
    }
    const fObj = fantiniContrade[nomeContrada];
    if (fObj) return fObj;
    if (typeof FANTINI_DB !== 'undefined' && FANTINI_DB.length) {
      return FANTINI_DB[Math.floor(Math.random() * FANTINI_DB.length)];
    }
    return { nome:'Fantino', bravura:3, esperienza:3, gestione_mossa:3, empatia:3 };
  };

  /* Applica modifiche temporanee al cavallo/fantino del giocatore dalla tattica e cena vigilia */
  const modTemp = datiPalio.modificheTempPalio || {};
  const velOffsets = datiPalio.velocitaOffsetContrade || {};
  const resOffsets = datiPalio.resistenzaOffsetContrade || {};

  /* Costruisce le coppie con statistiche "effettive" per la corsa */
  const coppie = partecipanti.map(nomeContrada => {
    const cavBase = trovaCavallo(nomeContrada);
    let fan = trovaFantino(nomeContrada);
    const isMe = nomeContrada === S.contrada.nome;

    // Clona il cavallo per applicare i modificatori
    const cav = Object.assign({}, cavBase);

    // Offset da accordi (velocità ridotta per chi ha accettato accordi nemici)
    if (velOffsets[nomeContrada]) cav.velocita = Math.max(1, (cav.velocita || 3) + velOffsets[nomeContrada]);
    if (resOffsets[nomeContrada]) cav.resistenza = Math.max(1, (cav.resistenza || 3) + resOffsets[nomeContrada]);

    // Offset dalla tattica e cena vigilia (solo per il giocatore)
    if (isMe) {
      if (modTemp.velocita)        cav.velocita    = Math.max(1, (cav.velocita    || 3) + modTemp.velocita);
      if (modTemp.resistenza)      cav.resistenza  = Math.max(1, (cav.resistenza  || 3) + modTemp.resistenza);
      if (modTemp.accelerazione)   cav.accelerazione = Math.max(1,(cav.accelerazione||3) + modTemp.accelerazione);
      if (modTemp.tenuta_curva)    cav.tenuta_curva = Math.max(1,(cav.tenuta_curva||3) + modTemp.tenuta_curva);
      if (modTemp.nervosismoOffset) cav.nervosismo = Math.max(1, (cav.nervosismo || 2) + modTemp.nervosismoOffset);
      // Bonus contrada temporanei al Palio
      if (S.contrada?.bonusKey === 'vel_palio')   cav.velocita      = (cav.velocita    || 3) + S.contrada.bonusVal;
      if (S.contrada?.bonusKey === 'acc_palio')   cav.accelerazione = (cav.accelerazione|| 3) + S.contrada.bonusVal;
      if (S.contrada?.bonusKey === 'curva_palio') cav.tenuta_curva  = (cav.tenuta_curva || 3) + S.contrada.bonusVal;
      // Selva: fantino clonato con bravura +1 (non modifica il DB permanente)
      if (S.contrada?.bonusKey === 'bravura_palio') {
        fan = Object.assign({}, fan, { bravura: (fan.bravura || 3) + S.contrada.bonusVal });
      }
    }

    return { nomeContrada, cavallo: cav, fantino: fan, isMe };
  });

  /* Simula giro per giro usando simulaCorsaCoppia con NUM_GIRI_CORSA=1 per giro.
     Usiamo la funzione esistente con un wrapper che sovrascrive NUM_GIRI_CORSA temporaneamente. */
  const tempiGiri = coppie.map(cp => {
    // Simula 3 giri separati per costruire una classifica progressiva
    const giri = [];
    let tempoCumulativo = 0;
    for (let g = 0; g < NUM_GIRI_PALIO; g++) {
      // Override temporaneo del numero di giri
      const origGiri = NUM_GIRI_CORSA;
      // Simuliamo giro singolo chiamando direttamente la logica interna
      const res = simulaGiroSingoloPalio(cp.cavallo, cp.fantino, PISTA_CAMPO, g, tempoCumulativo);
      tempoCumulativo += res.tempo;
      giri.push({ tempo: res.tempo, cumulativo: tempoCumulativo, caduta: res.caduta });
      if (res.caduta) {
        // aggiunge penalità per i giri rimanenti
        for (let gg = g + 1; gg < NUM_GIRI_PALIO; gg++) {
          tempoCumulativo += 800 + Math.random() * 200;
          giri.push({ tempo: 800, cumulativo: tempoCumulativo, caduta: false });
        }
        break;
      }
    }
    return { nomeContrada: cp.nomeContrada, isMe: cp.isMe, giri, tempoCumulativo };
  });

  /* Classifica finale per tempo cumulativo */
  const classifica = tempiGiri.slice().sort((a, b) => a.tempoCumulativo - b.tempoCumulativo);
  const classificaGiri = [];
  for (let g = 0; g < NUM_GIRI_PALIO; g++) {
    const alGiro = tempiGiri.map(e => ({
      nomeContrada: e.nomeContrada,
      isMe: e.isMe,
      cumulativo: e.giri[g] ? e.giri[g].cumulativo : Infinity,
      caduta: e.giri[g] ? e.giri[g].caduta : false
    })).sort((a, b) => a.cumulativo - b.cumulativo);
    classificaGiri.push(alGiro);
  }

  const corsaSimulata = {
    coppie: coppie.map(cp => ({ nomeContrada: cp.nomeContrada, isMe: cp.isMe, coloreCavallo: estraiColoreCavalloDB(cp.cavallo) })),
    classificaGiri,
    classificaFinale: classifica.map(e => e.nomeContrada),
    giroMostrato: 0,   // quanti giri ha già visto il giocatore (0 = nessuno)
    conclusa: false
  };

  datiPalio.corsaSimulata = corsaSimulata;
  // Salva il vincitore ufficiale
  datiPalio.vincitore = classifica[0].nomeContrada;
  datiPalio.corsaClassifica = classifica.map(e => e.nomeContrada);
  salvaCorrente();
  return corsaSimulata;
}

/* ═══════════════════════════════════════════════
   PREPARAZIONE CORSA — Carriera Fantino
   Stessa logica di preparaCorsaPalio (motore di simulazione condiviso), ma con le
   fonti dati proprie della Carriera Fantino: la contrada per cui si corre è
   datiPalio.contradaFantino (non S.contrada.nome), il fantino del giocatore è
   costruito dalle sue statistiche personali (S.bravura, S.esperienza, ecc.) e i
   fantini rivali vengono presi da datiPalio.fantiniRivaliAccordi. Il bonus di
   velocità ottenuto nel minigioco della Mossa (datiPalio.bonusMossaFantino) si
   applica solo alla coppia del giocatore, tramite lo stesso meccanismo già usato
   nelle corse in provincia (bonusVelocitaMossa in simulaGiroSingoloPalio).
═══════════════════════════════════════════════ */
function preparaCorsaPalioFantino(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.contradaFantino) return null;
  if (datiPalio.corsaSimulataFantino) return datiPalio.corsaSimulataFantino;

  const partecipanti = datiPalio.partecipanti;
  const contradaGiocatore = datiPalio.contradaFantino;

  const assegnazioni = datiPalio.assegnazione ? datiPalio.assegnazione.assegnazioni : {};
  const contradaCavallo = {};
  Object.entries(assegnazioni).forEach(([cav, con]) => { contradaCavallo[con] = cav; });

  const trovaCavallo = (nomeContrada) => {
    const nomeCav = contradaCavallo[nomeContrada];
    if (nomeCav && nomeContrada === contradaGiocatore && S.cavalliPosseduti && S.cavalliPosseduti.includes(nomeCav)) {
      const st = statoVivoCavallo(nomeCav);
      if (st) return Object.assign({ nome: nomeCav }, st);
    }
    if (nomeCav && typeof CAVALLI_DB !== 'undefined') {
      const c = CAVALLI_DB.find(x => x.nome === nomeCav);
      if (c) return c;
    }
    if (typeof CAVALLI_DB !== 'undefined' && CAVALLI_DB.length) {
      return CAVALLI_DB[Math.floor(Math.random() * CAVALLI_DB.length)];
    }
    return { nome:'Cavallo', velocita:3, resistenza:3, accelerazione:3, tenuta_curva:3, nervosismo:2 };
  };

  const fantiniRivali = datiPalio.fantiniRivaliAccordi || {};
  const trovaFantino = (nomeContrada) => {
    if (nomeContrada === contradaGiocatore) {
      return { nome:'Tu', bravura:S.bravura||1, esperienza:S.esperienza||1, gestione_mossa:S.gestioneMossa||1, empatia:S.empatia||1 };
    }
    const nomeFan = fantiniRivali[nomeContrada];
    if (nomeFan && typeof FANTINI_DB !== 'undefined') {
      const f = FANTINI_DB.find(x => x.nome === nomeFan);
      if (f) return f;
    }
    if (typeof FANTINI_DB !== 'undefined' && FANTINI_DB.length) {
      return FANTINI_DB[Math.floor(Math.random() * FANTINI_DB.length)];
    }
    return { nome:'Fantino', bravura:3, esperienza:3, gestione_mossa:3, empatia:3 };
  };

  const velOffsets = datiPalio.velocitaOffsetContrade || {};
  const resOffsets = datiPalio.resistenzaOffsetContrade || {};
  const accOffsets = datiPalio.accelerazioneOffsetContrade || {};
  const modTemp = datiPalio.modificheTempPalio || {};
  const bonusMossa = datiPalio.bonusMossaFantino || 1;

  const coppie = partecipanti.map(nomeContrada => {
    const cavBase = trovaCavallo(nomeContrada);
    const fan = trovaFantino(nomeContrada);
    const isMe = nomeContrada === contradaGiocatore;

    const cav = Object.assign({}, cavBase);
    if (velOffsets[nomeContrada]) cav.velocita = Math.max(1, (cav.velocita || 3) + velOffsets[nomeContrada]);
    if (resOffsets[nomeContrada]) cav.resistenza = Math.max(1, (cav.resistenza || 3) + resOffsets[nomeContrada]);
    // Offset di accelerazione dall'atteggiamento di gara scelto prima della Mossa (es. D'Attacco)
    if (accOffsets[nomeContrada]) cav.accelerazione = Math.max(1, (cav.accelerazione || 3) + accOffsets[nomeContrada]);

    // Il nervosismo modificato dagli effetti del canape si applica solo al cavallo del giocatore
    if (isMe && modTemp.nervosismoOffset) {
      cav.nervosismo = Math.max(1, (cav.nervosismo || 2) + modTemp.nervosismoOffset);
    }

    return { nomeContrada, cavallo: cav, fantino: fan, isMe };
  });

  const tempiGiri = coppie.map(cp => {
    const giri = [];
    let tempoCumulativo = 0;
    for (let g = 0; g < NUM_GIRI_PALIO; g++) {
      const res = simulaGiroSingoloPalio(cp.cavallo, cp.fantino, PISTA_CAMPO, g, tempoCumulativo, cp.isMe ? bonusMossa : 1);
      tempoCumulativo += res.tempo;
      giri.push({ tempo: res.tempo, cumulativo: tempoCumulativo, caduta: res.caduta });
      if (res.caduta) {
        for (let gg = g + 1; gg < NUM_GIRI_PALIO; gg++) {
          tempoCumulativo += 800 + Math.random() * 200;
          giri.push({ tempo: 800, cumulativo: tempoCumulativo, caduta: false });
        }
        break;
      }
    }
    return { nomeContrada: cp.nomeContrada, isMe: cp.isMe, giri, tempoCumulativo };
  });

  const classifica = tempiGiri.slice().sort((a, b) => a.tempoCumulativo - b.tempoCumulativo);
  const classificaGiri = [];
  for (let g = 0; g < NUM_GIRI_PALIO; g++) {
    const alGiro = tempiGiri.map(e => ({
      nomeContrada: e.nomeContrada,
      isMe: e.isMe,
      cumulativo: e.giri[g] ? e.giri[g].cumulativo : Infinity,
      caduta: e.giri[g] ? e.giri[g].caduta : false
    })).sort((a, b) => a.cumulativo - b.cumulativo);
    classificaGiri.push(alGiro);
  }

  const corsaSimulata = {
    coppie: coppie.map(cp => ({ nomeContrada: cp.nomeContrada, isMe: cp.isMe, coloreCavallo: estraiColoreCavalloDB(cp.cavallo) })),
    classificaGiri,
    classificaFinale: classifica.map(e => e.nomeContrada),
    giroMostrato: 0,
    conclusa: false
  };

  datiPalio.corsaSimulataFantino = corsaSimulata;
  datiPalio.vincitoreFantino = classifica[0].nomeContrada;
  datiPalio.corsaClassificaFantino = classifica.map(e => e.nomeContrada);
  salvaCorrente();
  return corsaSimulata;
}

/* Simula un singolo giro della pista campo per una coppia.
   È una versione ridotta di simulaCorsaCoppia che fa girare il loop solo 1 volta.
   bonusVelocitaMossa: moltiplicatore opzionale dal minigioco della Mossa (1 = nessun effetto,
   usato dalla Carriera Fantino; la Carriera Capitano non lo passa mai, quindi resta 1). */
function simulaGiroSingoloPalio(cavallo, fantino, pista, numeroGiro, tempoPrecedente, bonusVelocitaMossa) {
  bonusVelocitaMossa = bonusVelocitaMossa || 1;
  const nervEff = nervosismoEffettivo(cavallo, fantino);
  const resistenzaEff = Math.max(0.5, cavallo.resistenza - (nervEff-1)*0.3);
  const velocitaMax = (cavallo.velocita + fantino.bravura*0.15) * bonusVelocitaMossa;
  const accelerazione = cavallo.accelerazione + fantino.gestione_mossa*0.3;
  const tenutaCurvaEff = cavallo.tenuta_curva + fantino.esperienza*0.2;

  const segmentiGiro = pista.segmento;
  const lunghezzaGiro = segmentiGiro.reduce((tot,s)=>tot+s.lunghezza,0);
  const distanzaTotale = lunghezzaGiro * NUM_GIRI_PALIO;

  let velocitaAttuale = 0.3;
  let distanzaPercorsa = 0;
  let tempo = 0;
  let caduta = false;
  const passo = 2.0;
  let iterazioniMax = 8000;

  for(const seg of segmentiGiro){
    let distSeg = 0;
    while(distSeg < seg.lunghezza && iterazioniMax-->0){
      let vTarget;
      if(seg.tipo === 'curva'){
        const fattoreCurva = Math.min(1.0, 0.45 + tenutaCurvaEff*0.09) / seg.severita;
        vTarget = velocitaMax * fattoreCurva;
        const rischioCaduta = Math.max(0, (seg.severita*1.3 - tenutaCurvaEff) * 0.012);
        // Chiocciola: rischio caduta dimezzato per il fantino del giocatore
        const fattoreCaduta = (S && S.contrada?.bonusKey === 'stabilita') ? 0.5 : 1.0;
        if(Math.random() < rischioCaduta * fattoreCaduta){ caduta = true; break; }
      } else {
        vTarget = velocitaMax;
      }
      const frazioneGara = (distanzaPercorsa + numeroGiro * lunghezzaGiro) / distanzaTotale;
      const caloResistenza = frazioneGara * (1.5 / resistenzaEff);
      vTarget = Math.max(0.2, vTarget - caloResistenza);
      if(velocitaAttuale < vTarget){
        velocitaAttuale = Math.min(vTarget, velocitaAttuale + accelerazione*0.08);
      } else {
        velocitaAttuale = Math.max(vTarget, velocitaAttuale - 0.15);
      }
      const avanzamento = velocitaAttuale * passo;
      distSeg += avanzamento;
      distanzaPercorsa += avanzamento;
      tempo += passo;
    }
    if(caduta) break;
  }
  if(caduta) tempo += 500 + Math.random()*300;
  tempo *= (0.97 + Math.random()*0.06);
  return { tempo, caduta };
}

/* ═══════════════════════════════════════════════
   COLORI CONTRADE — pallini araldici per la simulazione grafica
   Ogni funzione disegna il pallino su un <canvas> 2D
═══════════════════════════════════════════════ */
const COLORI_CONTRADE = {
  'Aquila':      { tipo:'cerchi', sfondo:'#E8C830', cerchi:[{r:.38,col:'#1A3A9C'},{r:.20,col:'#111111'}] },
  'Bruco':       { tipo:'quadrantie', q1:'#E8C830', q2:'#2E7A2E', centro:{r:.28,col:'#1A3A9C'} },
  'Chiocciola':  { tipo:'quadrantie', q1:'#E8C830', q2:'#CC2222', centro:{r:.28,col:'#1A3A9C'} },
  'Civetta':     { tipo:'quadrantie', q1:'#CC2222', q2:'#111111', centro:{r:.28,col:'#FFFFFF'} },
  'Drago':       { tipo:'quadrantie', q1:'#CC2222', q2:'#2E7A2E', centro:{r:.28,col:'#E8C830'} },
  'Giraffa':     { tipo:'quadrantie', q1:'#FFFFFF', q2:'#CC2222', centro:null },
  'Istrice':     { tipo:'istrice', sfondo:'#FFFFFF', interno:'#111111', raggi:['#1A3A9C','#CC2222','#111111'] },
  'Leocorno':    { tipo:'quadrantie', q1:'#FFFFFF', q2:'#E87020', centro:{r:.28,col:'#1A3A9C'} },
  'Lupa':        { tipo:'quadrantie', q1:'#FFFFFF', q2:'#111111', centro:{r:.28,col:'#E87020'} },
  'Nicchio':     { tipo:'cerchi', sfondo:'#1A3A9C', cerchi:[{r:.38,col:'#E8C830'},{r:.20,col:'#CC2222'}] },
  'Oca':         { tipo:'quadrantie', q1:'#FFFFFF', q2:'#2E7A2E', centro:{r:.28,col:'#CC2222'} },
  'Onda':        { tipo:'quadrantie', q1:'#FFFFFF', q2:'#7ABCDC', centro:null },
  'Pantera':     { tipo:'quadrantie', q1:'#1A3A9C', q2:'#CC2222', centro:{r:.28,col:'#FFFFFF'} },
  'Selva':       { tipo:'quadrantie', q1:'#E87020', q2:'#2E7A2E', centro:{r:.28,col:'#FFFFFF'} },
  'Tartuca':     { tipo:'quadrantie', q1:'#E8C830', q2:'#1A3A9C', centro:null },
  'Torre':       { tipo:'cerchi', sfondo:'#6B1020', cerchi:[{r:.38,col:'#FFFFFF'},{r:.20,col:'#1A3A9C'}] },
  'Valdimontone':{ tipo:'quadrantie', q1:'#E8C830', q2:'#CC2222', centro:{r:.28,col:'#FFFFFF'} },
};

function disegnaPallinoPalio(ctx, x, y, r, nomeCon) {
  // Cerca sia nome esatto sia corrispondenza parziale
  let def = COLORI_CONTRADE[nomeCon];
  if (!def) {
    const k = Object.keys(COLORI_CONTRADE).find(k => nomeCon && nomeCon.toLowerCase().includes(k.toLowerCase()));
    def = k ? COLORI_CONTRADE[k] : null;
  }
  if (!def) {
    // Fallback: pallino arancio generico
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle='#C8991E'; ctx.fill();
    return;
  }

  const tipo = def.tipo;

  if (tipo === 'cerchi') {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = def.sfondo; ctx.fill();
    def.cerchi.forEach(c => {
      ctx.beginPath(); ctx.arc(x,y,r*c.r,0,Math.PI*2);
      ctx.fillStyle = c.col; ctx.fill();
    });

  } else if (tipo === 'quadrantie') {
    // 4 quadranti: alto-sin e basso-dx = q1, alto-dx e basso-sin = q2
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
    // alto-sin (q1)
    ctx.fillStyle = def.q1;
    ctx.fillRect(x-r, y-r, r, r);
    // basso-dx (q1)
    ctx.fillRect(x, y, r, r);
    // alto-dx (q2)
    ctx.fillStyle = def.q2;
    ctx.fillRect(x, y-r, r, r);
    // basso-sin (q2)
    ctx.fillRect(x-r, y, r, r);
    ctx.restore();
    if (def.centro) {
      ctx.beginPath(); ctx.arc(x,y,r*def.centro.r,0,Math.PI*2);
      ctx.fillStyle = def.centro.col; ctx.fill();
    }

  } else if (tipo === 'istrice') {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = def.sfondo; ctx.fill();
    // Raggi alternati
    const colori = def.raggi;
    const nRaggi = 12;
    for (let i=0; i<nRaggi; i++) {
      const ang = (i/nRaggi)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(ang)*r*0.26, y + Math.sin(ang)*r*0.26);
      ctx.lineTo(x + Math.cos(ang)*r*0.92, y + Math.sin(ang)*r*0.92);
      ctx.strokeStyle = colori[i % colori.length];
      ctx.lineWidth = r*0.13;
      ctx.stroke();
    }
    // Pallino nero centrale con pallino bianco
    ctx.beginPath(); ctx.arc(x,y,r*0.32,0,Math.PI*2);
    ctx.fillStyle = def.interno; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r*0.14,0,Math.PI*2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
  }

  // Bordo sottile per leggibilità
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.stroke();
}

/* ═══════════════════════════════════════════════
   CAVALLO VISTO DALL'ALTO — disegno realistico e animato
   Corpo centrale (col fantino/pallino sopra), collo con criniera,
   testa con orecchie, coda. Il tutto animato in base alla fase di
   galoppo (legata alla distanza percorsa, non al tempo assoluto:
   così un cavallo più veloce "corre" visivamente più veloce).
   x,y  = posizione del centro del cavallo sulla pista (coord. canvas)
   r    = raggio di riferimento (stessa unità usata per il pallino)
   nomeCon = nome della contrada (colori del fantino)
   angolo  = direzione di marcia in radianti (atan2, coerente col canvas)
   fase    = fase di galoppo continua (radianti), cresce con la distanza
   palette = { chiaro, medio, scuro, colloA, colloB, testaA, testaB }
             tonalità derivate dal colore/mantello del cavallo preso dal
             database esterno (CAVALLI_DB); se assente si usa il bruno
             di default (retrocompatibilità con dati senza colore)
═══════════════════════════════════════════════ */

// Colore di mantello di default (usato se il cavallo non ha un colore nel DB)
const PALETTE_CAVALLO_DEFAULT = {
  chiaro: '#8a5a34', medio: '#6b4222', scuro: '#4a2c14',
  colloA: '#6b4222', colloB: '#7a4d28',
  testaA: '#7a4d28', testaB: '#4a2c14'
};

/* Estrae la stringa colore/mantello di un cavallo dal database esterno,
   provando i possibili nomi di campo usati in cavalli_db.js */
function estraiColoreCavalloDB(cav) {
  if (!cav) return null;
  const candidati = [cav.colore, cav.color, cav.mantello, cav.colorePelo, cav.coloreManto, cav.colorMantello];
  const trovato = candidati.find(v => typeof v === 'string' && v.trim().length > 0);
  return trovato ? trovato.trim() : null;
}

/* Normalizza una qualsiasi stringa colore CSS valida (nome, hex, rgb...)
   nell'equivalente esadecimale, usando un canvas 1x1 come "interprete"
   ufficiale dei colori del browser. Ritorna null se il colore non è valido. */
function normalizzaColoreHex(colorStr) {
  if (!colorStr) return null;
  try {
    if (!window._coloreProbeCanvas) {
      window._coloreProbeCanvas = document.createElement('canvas');
      window._coloreProbeCanvas.width = 1;
      window._coloreProbeCanvas.height = 1;
    }
    const cx = window._coloreProbeCanvas.getContext('2d');
    cx.clearRect(0, 0, 1, 1);
    cx.fillStyle = '#000000';
    cx.fillStyle = colorStr; // se non valido, il browser ignora l'assegnazione
    const provaFill = cx.fillStyle;
    cx.fillRect(0, 0, 1, 1);
    const d = cx.getImageData(0, 0, 1, 1).data;
    if (provaFill === '#000000' && colorStr.toLowerCase() !== 'black' && colorStr.toLowerCase() !== '#000' && colorStr.toLowerCase() !== '#000000') {
      return null; // colore non riconosciuto dal browser
    }
    return '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return null;
  }
}

/* Schiarisce (percent > 0) o scurisce (percent < 0) un colore esadecimale */
function sfumaColoreHex(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
  const amt = Math.round(2.55 * percent);
  r = Math.min(255, Math.max(0, r + amt));
  g = Math.min(255, Math.max(0, g + amt));
  b = Math.min(255, Math.max(0, b + amt));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* Costruisce la palette di tonalità (corpo/collo/testa) a partire dal
   colore grezzo del cavallo preso dal database. Se il colore manca o non
   è valido, ricade sulla palette bruna di default. */
function costruisciPaletteCavallo(colorStrGrezzo) {
  const hex = normalizzaColoreHex(colorStrGrezzo);
  if (!hex) return PALETTE_CAVALLO_DEFAULT;
  return {
    chiaro: sfumaColoreHex(hex, 20),
    medio:  hex,
    scuro:  sfumaColoreHex(hex, -32),
    colloA: sfumaColoreHex(hex, -6),
    colloB: sfumaColoreHex(hex, 10),
    testaA: sfumaColoreHex(hex, 10),
    testaB: sfumaColoreHex(hex, -32)
  };
}

function disegnaCavalloPalio(ctx, x, y, r, nomeCon, angolo, fase, palette) {
  const pal = palette || PALETTE_CAVALLO_DEFAULT;
  const corpoL = r * 2.95;  // lunghezza corpo centrale (più raccolto)
  const corpoW = r * 2.05;  // larghezza corpo centrale (meno massiccio, più snello)
  const colloL = r * 1.15;  // collo leggermente allungato
  const testaL = r * 1.45;  // testa più allungata (muso più definito)
  const codaL  = r * 0.85;  // coda ancora più corta

  // Falcata: due gruppi di zampe in fase opposta (anteriori/posteriori)
  const fA = fase;
  const fP = fase + Math.PI;
  // Leggero "sobbalzo" della falcata (variazione di scala longitudinale,
  // poiché la vista è dall'alto e non possiamo mostrare il salto verticale)
  const sobbalzo = Math.sin(fase * 2) * 0.05;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angolo);

  // ── Ombra portata a terra (dà rilievo, corpo "sollevato" sulle zampe) ──
  ctx.beginPath();
  ctx.ellipse(r*0.15, r*0.28, corpoL*0.50, corpoW*0.48, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.fill();

  // ── Zampe: forme piene e affusolate (non più semplici linee "a stecchino"),
  // più larghe verso l'attacco al corpo e rastremate verso lo zoccolo, con
  // una leggera flessione a metà (ginocchio) che simula il movimento del
  // galoppo in modo più realistico ──
  ctx.lineCap = 'round';
  const disegnaZampa = (baseX, baseY, faseZampa) => {
    const segno = Math.sign(baseY);
    const estensione = Math.sin(faseZampa) * corpoL * 0.30;
    const apertura = (Math.cos(faseZampa) * 0.5 + 0.5) * r * 0.55; // si allarga a metà falcata
    const ginocchioX = baseX + estensione * 0.55;
    const ginocchioY = baseY + segno * apertura * 0.32;
    const zoccoloX = baseX + estensione;
    const zoccoloY = baseY + segno * apertura * 0.6;

    const wBase  = r * 1.00; // larga all'attacco (spalla/anca)
    const wMed   = r * 0.62; // si assottiglia al "ginocchio"
    const wPunta = r * 0.34; // stretta allo zoccolo, come una vera zampa

    ctx.beginPath();
    ctx.moveTo(baseX, baseY - wBase*0.5);
    ctx.quadraticCurveTo(ginocchioX, ginocchioY - wMed*0.5, zoccoloX, zoccoloY - wPunta*0.5);
    ctx.lineTo(zoccoloX, zoccoloY + wPunta*0.5);
    ctx.quadraticCurveTo(ginocchioX, ginocchioY + wMed*0.5, baseX, baseY + wBase*0.5);
    ctx.closePath();
    const gradZampa = ctx.createLinearGradient(baseX, 0, zoccoloX, 0);
    gradZampa.addColorStop(0, '#5a3a1e');
    gradZampa.addColorStop(1, '#2c1a0d');
    ctx.fillStyle = gradZampa;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(0.4, r*0.03); ctx.stroke();

    // Zoccolo: piccola capsula scura e lucida in punta
    ctx.beginPath();
    ctx.ellipse(zoccoloX, zoccoloY, r*0.22, r*0.16, 0, 0, Math.PI*2);
    ctx.fillStyle = '#120a05';
    ctx.fill();
  };
  // Anteriori (vicino al collo)
  disegnaZampa(corpoL*0.30,  corpoW*0.34, fA);
  disegnaZampa(corpoL*0.30, -corpoW*0.34, fA + 0.35);
  // Posteriori (vicino alla coda)
  disegnaZampa(-corpoL*0.28,  corpoW*0.34, fP);
  disegnaZampa(-corpoL*0.28, -corpoW*0.34, fP + 0.35);

  // ── Coda: corta e folta, oscilla lateralmente seguendo il movimento del corpo ──
  const codaOsc = Math.sin(fase * 0.55) * r * 0.45;
  ctx.beginPath();
  ctx.moveTo(-corpoL*0.48, 0);
  ctx.quadraticCurveTo(-corpoL*0.48 - codaL*0.55, codaOsc*0.55, -corpoL*0.48 - codaL, codaOsc);
  ctx.strokeStyle = '#1e130a';
  ctx.lineWidth = Math.max(2.0, r*0.62);
  ctx.stroke();
  // Ciuffo finale della coda (folto)
  ctx.beginPath();
  ctx.arc(-corpoL*0.48 - codaL, codaOsc, r*0.32, 0, Math.PI*2);
  ctx.fillStyle = '#1e130a';
  ctx.fill();

  // ── Corpo centrale: leggera "respirazione" muscolare ──
  const flexCorpo = 1 + sobbalzo;
  ctx.beginPath();
  ctx.ellipse(0, 0, corpoL*0.5*flexCorpo, corpoW*0.5, 0, 0, Math.PI*2);
  const gradCorpo = ctx.createLinearGradient(0, -corpoW*0.5, 0, corpoW*0.5);
  gradCorpo.addColorStop(0,   pal.chiaro);
  gradCorpo.addColorStop(0.5, pal.medio);
  gradCorpo.addColorStop(1,   pal.scuro);
  ctx.fillStyle = gradCorpo;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.40)'; ctx.lineWidth = 0.7; ctx.stroke();

  // Linee del dorso muscolare: si flettono leggermente col ritmo del galoppo
  ctx.strokeStyle = 'rgba(0,0,0,.16)';
  ctx.lineWidth = Math.max(0.6, r*0.08);
  [-1, 1].forEach(lato => {
    ctx.beginPath();
    ctx.moveTo(-corpoL*0.32, lato*corpoW*0.24);
    ctx.quadraticCurveTo(0, lato*corpoW*0.24 + Math.sin(fase)*r*0.10, corpoL*0.32, lato*corpoW*0.24);
    ctx.stroke();
  });

  // ── Collo: si protende in avanti con una leggera ondulazione ──
  // Base del collo spostata più dentro il corpo per una giunzione morbida e continua
  const oscCollo = Math.sin(fase * 0.55 + Math.PI/4) * r * 0.30;
  const colloBaseX = corpoL*0.30;
  const colloPuntaX = colloBaseX + colloL;
  const colloPuntaY = oscCollo * 0.45;

  // Raccordo garrese: piccola sella morbida che fonde corpo e collo senza soluzione di continuità
  ctx.beginPath();
  ctx.ellipse(colloBaseX, 0, corpoW*0.30, corpoW*0.42, 0, 0, Math.PI*2);
  ctx.fillStyle = pal.colloA;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(colloBaseX - r*0.3, -corpoW*0.30);
  ctx.quadraticCurveTo(colloBaseX + colloL*0.5, -r*0.15 + oscCollo, colloPuntaX, colloPuntaY - r*0.55);
  ctx.lineTo(colloPuntaX, colloPuntaY + r*0.55);
  ctx.quadraticCurveTo(colloBaseX + colloL*0.5, r*0.15 + oscCollo, colloBaseX - r*0.3, corpoW*0.30);
  ctx.closePath();
  const gradCollo = ctx.createLinearGradient(colloBaseX, 0, colloPuntaX, 0);
  gradCollo.addColorStop(0, pal.colloA);
  gradCollo.addColorStop(1, pal.colloB);
  ctx.fillStyle = gradCollo;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.40)'; ctx.lineWidth = 0.7; ctx.stroke();

  // Criniera: banda continua e uniforme che corre centrata sulla linea
  // dorsale del collo (non più spostata lateralmente su un solo lato),
  // simmetrica rispetto all'asse del collo, con bordo morbido e
  // oscillazione leggera e regolare
  const nCrin = 10;
  const centroCrin = [];
  const bordoSupCrin = [];
  const bordoInfCrin = [];
  for (let i = 0; i <= nCrin; i++) {
    const t = i / nCrin;
    const cx = colloBaseX + (colloPuntaX - colloBaseX) * t;
    const cy = oscCollo * t * 0.8; // centrata sull'asse del collo
    const sventola = Math.sin(fase * 1.2 + t * 1.8) * r * 0.08; // ondulazione più regolare
    const spessore = r * 0.34 * (1 - t * 0.30); // si assottiglia dolcemente verso la testa
    centroCrin.push({ x: cx, y: cy });
    bordoSupCrin.push({ x: cx + sventola*0.25, y: cy - spessore + sventola });
    bordoInfCrin.push({ x: cx + sventola*0.25, y: cy + spessore + sventola });
  }
  ctx.beginPath();
  ctx.moveTo(bordoSupCrin[0].x, bordoSupCrin[0].y);
  for (let i = 1; i < bordoSupCrin.length; i++) {
    const p0 = bordoSupCrin[i-1], p1 = bordoSupCrin[i];
    ctx.quadraticCurveTo(p0.x, p0.y, (p0.x+p1.x)/2, (p0.y+p1.y)/2);
  }
  ctx.lineTo(bordoSupCrin[bordoSupCrin.length-1].x, bordoSupCrin[bordoSupCrin.length-1].y);
  ctx.lineTo(bordoInfCrin[bordoInfCrin.length-1].x, bordoInfCrin[bordoInfCrin.length-1].y);
  for (let i = bordoInfCrin.length - 2; i >= 0; i--) {
    const p0 = bordoInfCrin[i+1], p1 = bordoInfCrin[i];
    ctx.quadraticCurveTo(p0.x, p0.y, (p0.x+p1.x)/2, (p0.y+p1.y)/2);
  }
  ctx.lineTo(bordoInfCrin[0].x, bordoInfCrin[0].y);
  ctx.closePath();
  const gradCrin = ctx.createLinearGradient(colloBaseX, 0, colloPuntaX, 0);
  gradCrin.addColorStop(0, '#241509');
  gradCrin.addColorStop(1, '#160d06');
  ctx.fillStyle = gradCrin;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 0.6; ctx.stroke();

  // ── Testa: forma affusolata con muso ben definito, sovrapposta al collo
  // per un attacco morbido e continuo (nessuna cesura visibile) ──
  const testaBaseX = colloPuntaX - testaL*0.30;
  const testaBaseY = colloPuntaY;
  const testaPuntaX = testaBaseX + testaL;
  ctx.beginPath();
  ctx.moveTo(testaBaseX, testaBaseY - r*0.56);
  ctx.quadraticCurveTo(testaBaseX + testaL*0.58, testaBaseY - r*0.48, testaPuntaX, testaBaseY - r*0.13);
  ctx.quadraticCurveTo(testaPuntaX + r*0.14, testaBaseY, testaPuntaX, testaBaseY + r*0.13);
  ctx.quadraticCurveTo(testaBaseX + testaL*0.58, testaBaseY + r*0.48, testaBaseX, testaBaseY + r*0.56);
  ctx.closePath();
  const gradTesta = ctx.createLinearGradient(testaBaseX, 0, testaPuntaX, 0);
  gradTesta.addColorStop(0, pal.testaA);
  gradTesta.addColorStop(1, pal.testaB);
  ctx.fillStyle = gradTesta;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.40)'; ctx.lineWidth = 0.7; ctx.stroke();

  // Profilo del muso (linea del labbro/mascella)
  ctx.beginPath();
  ctx.moveTo(testaBaseX + testaL*0.35, testaBaseY - r*0.30);
  ctx.quadraticCurveTo(testaBaseX + testaL*0.80, testaBaseY - r*0.10, testaPuntaX - r*0.05, testaBaseY);
  ctx.strokeStyle = 'rgba(0,0,0,.22)';
  ctx.lineWidth = Math.max(0.6, r*0.06);
  ctx.stroke();

  // Narice
  ctx.beginPath();
  ctx.ellipse(testaPuntaX - r*0.16, testaBaseY + r*0.10, r*0.10, r*0.06, 0.4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fill();

  // Orecchie: forma a "petalo" morbida e simmetrica, base solida e punta
  // arrotondata (non più spigolosa/a triangolo), con leggera ombreggiatura
  // interna che dà volume; ben piantate sulla nuca, in leggero movimento
  const orecchioMov = Math.sin(fase * 1.6) * 0.07;
  const orBaseX = testaBaseX + testaL*0.07;
  [1, -1].forEach(lato => {
    const baseY = testaBaseY + lato*r*0.28;
    const tipX  = orBaseX + testaL*0.06;
    const tipY  = testaBaseY + lato*(r*0.90 + orecchioMov*r);
    const outX  = orBaseX - testaL*0.05;   // controllo bordo esterno (dorso dell'orecchio)
    const outY  = testaBaseY + lato*r*0.64;
    const inX   = orBaseX + testaL*0.13;   // controllo bordo interno (pancia dell'orecchio)
    const inY   = testaBaseY + lato*r*0.48;

    ctx.beginPath();
    ctx.moveTo(orBaseX - testaL*0.02, baseY);
    ctx.quadraticCurveTo(outX, outY, tipX, tipY);
    ctx.quadraticCurveTo(inX, inY, orBaseX + testaL*0.09, baseY);
    ctx.closePath();
    const gradOr = ctx.createLinearGradient(orBaseX, testaBaseY, tipX, tipY);
    gradOr.addColorStop(0, '#4a2c14');
    gradOr.addColorStop(1, '#241509');
    ctx.fillStyle = gradOr;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(0.4, r*0.03); ctx.stroke();

    // Interno orecchio: forma più piccola e sfumata, per dare profondità
    ctx.beginPath();
    ctx.moveTo(orBaseX + testaL*0.01, baseY - lato*r*0.02);
    ctx.quadraticCurveTo(orBaseX + testaL*0.005, testaBaseY + lato*r*0.52,
                          orBaseX + testaL*0.04, testaBaseY + lato*(r*0.70 + orecchioMov*r));
    ctx.quadraticCurveTo(orBaseX + testaL*0.085, testaBaseY + lato*r*0.52,
                          orBaseX + testaL*0.065, baseY - lato*r*0.02);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.fill();
  });

  ctx.restore();

  // ── Il fantino: pallino coi colori della contrada, sopra il centro del corpo ──
  // (disegnato fuori dalla rotazione, così i colori araldici restano sempre dritti e leggibili)
  disegnaPallinoPalio(ctx, x, y, r, nomeCon);
}

/* ─────────────────────────────────────────────
   PERCORSO REALE PIAZZA DEL CAMPO
   Forma fedele alla pista del Palio:
   - Rettilineo in alto leggermente curvo (da Mossa verso destra)
   - Curva a 90° San Martino (basso-destra), raggio stretto
   - Rettilineo inferiore (da destra a sinistra)
   - Curva a 90° Casato (basso-sinistra), raggio stretto
   - Rettilineo sinistro di risalita verso la Mossa
   Senso di marcia: antiorario (come nel Palio reale)
───────────────────────────────────────────── */
function calcolaPercorsoCampo(W, H) {
  // Piazza del Campo: forma "a conchiglia" fedele alla pianta reale,
  // disegnata come UNA SOLA spline chiusa e continua (Catmull-Rom) attraverso
  // i punti di controllo. Una curva continua evita spigoli vivi e quindi
  // le "spaccature" che si vedevano nel rendering della fascia con offset.
  // Senso di marcia: antiorario.

  // Punti di controllo normalizzati (0..1), in ordine lungo il percorso.
  // Dorso superiore arrotondato, fianchi leggermente svasati, base ampia
  // e dolcemente ondulata. Negli angoli (San Martino, Casato) sono stati
  // aggiunti punti intermedi per allargare il raggio di curvatura ed
  // evitare auto-intersezioni nella fascia (che causavano le "spaccature").
  // Punto 0 = MOSSA/BANDIERINO sul rettilineo sinistro, parte alta.
  // Percorso antiorario senza inversioni di direzione.
  const ctrl = [
    {x:0.148, y:0.420}, // MOSSA/BANDIERINO — rettilineo sinistro alto
    {x:0.185, y:0.370}, // raccordo verso la spalla sinistra
    {x:0.255, y:0.340}, // spalla sinistra / inizio dorso
    {x:0.370, y:0.312}, // dorso sinistro
    {x:0.500, y:0.305}, // sommità dorso
    {x:0.630, y:0.312}, // dorso destro
    {x:0.745, y:0.340}, // spalla destra / inizio discesa
    {x:0.825, y:0.395}, // raccordo verso fianco destro
    {x:0.858, y:0.500}, // fianco destro medio-alto
    {x:0.875, y:0.630}, // fianco destro medio-basso
    {x:0.875, y:0.720}, // avvicinamento San Martino
    {x:0.875, y:0.800}, // San Martino verticale
    {x:0.820, y:0.830}, // San Martino uscita orizzontale
    {x:0.700, y:0.830}, // base destra
    {x:0.500, y:0.830}, // base centrale
    {x:0.300, y:0.830}, // base sinistra
    {x:0.180, y:0.830}, // Casato uscita orizzontale
    {x:0.125, y:0.800}, // Casato verticale
    {x:0.125, y:0.720}, // avvicinamento Casato
    {x:0.125, y:0.620}, // fianco sinistro basso
    {x:0.135, y:0.520}, // fianco sinistro medio
  ];

  const pts = [];
  const n = ctrl.length;
  const PUNTI_PER_TRATTO = 18;

  // Catmull-Rom centripeta semplice (uniforme) su poligono di controllo chiuso
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t*t, t3 = t2*t;
    const x = 0.5 * ((2*p1.x) + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
    const y = 0.5 * ((2*p1.y) + (-p0.y+p2.y)*t + (2*p0.y-5*p1.y+4*p2.y-p3.y)*t2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
    return { x, y };
  }

  for (let i = 0; i < n; i++) {
    const p0 = ctrl[(i-1+n)%n];
    const p1 = ctrl[i];
    const p2 = ctrl[(i+1)%n];
    const p3 = ctrl[(i+2)%n];
    for (let j = 0; j < PUNTI_PER_TRATTO; j++) {
      const t = j / PUNTI_PER_TRATTO;
      const p = catmullRom(p0, p1, p2, p3, t);
      pts.push({ x: p.x * W, y: p.y * H });
    }
  }

  return pts;
}



function lunghezzaPercorso(pts) {
  let L = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    L += Math.hypot(b.x-a.x, b.y-a.y);
  }
  return L;
}

function posizioneAlPercorso(pts, fraz) {
  // fraz in [0,1]: posizione lungo la pista
  const L = lunghezzaPercorso(pts);
  let target = fraz * L, acc = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    const seg = Math.hypot(b.x-a.x, b.y-a.y);
    if (acc + seg >= target) {
      const t = (target - acc) / seg;
      return { x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t };
    }
    acc += seg;
  }
  return pts[0];
}

function angoloAlPercorso(pts, fraz) {
  // Direzione di marcia (radianti, convenzione atan2/canvas) nel punto a
  // frazione `fraz` del percorso: usata per orientare il cavallo nel verso
  // in cui sta correndo.
  const eps = 0.004;
  const f1 = (((fraz - eps) % 1) + 1) % 1;
  const f2 = (((fraz + eps) % 1) + 1) % 1;
  const p1 = posizioneAlPercorso(pts, f1);
  const p2 = posizioneAlPercorso(pts, f2);
  return Math.atan2(p2.y - p1.y, p2.x - p1.x);
}

/* ─────────────────────────────────────────────
   MOTORE DI ANIMAZIONE CANVAS
───────────────────────────────────────────── */
window._palioAnim = null; // handle animationFrame

function inizializzaCanvasPalio(corsaJSON) {
  const canvas = document.getElementById('CANVAS_PALIO');
  if (!canvas) return;

  // Dimensioni: larghezza del contenitore, altezza maggiorata per una pista
  // più allungata in verticale (il Campo reale è meno "schiacciato" di un ovale largo)
  const W = canvas.offsetWidth || 340;
  const H = Math.round(W * 0.95);
  canvas.width = W;
  canvas.height = H;

  const ctx = canvas.getContext('2d');
  const corsa = JSON.parse(corsaJSON);
  const percorso = calcolaPercorsoCampo(W, H);

  // Recupera i nomi delle contrade nell'ordine di partenza (NON la classifica finale:
  // usarla qui spoilerebbe il risultato del Palio prima ancora di vedere la corsa).
  // corsa.coloriCavalli è stato costruito da corsa.coppie, che mantiene l'ordine dei
  // partecipanti al canapo, e le chiavi di un oggetto JS ne preservano l'ordine di inserimento.
  const contrade = (corsa.coloriCavalli && Object.keys(corsa.coloriCavalli).length)
    ? Object.keys(corsa.coloriCavalli)
    : corsa.classificaFinale;
  const nGiocatore = corsa.nomeGiocatore;
  const tipoPalio = corsa.tipoPalio;
  const modalita = corsa.modalita || 'capitano';

  // Palette di colori (corpo/collo/testa) per ciascuna contrada, derivata dal
  // colore del cavallo assegnato preso dal database esterno (CAVALLI_DB).
  // Calcolata una sola volta qui (non ad ogni frame) per efficienza.
  const paletteCavalli = {};
  contrade.forEach(nc => {
    const coloreGrezzo = corsa.coloriCavalli ? corsa.coloriCavalli[nc] : null;
    paletteCavalli[nc] = costruisciPaletteCavallo(coloreGrezzo);
  });

  // Stato interno dell'animazione
  window._palioAnimState = {
    canvas, ctx, percorso, corsa, contrade, nGiocatore, tipoPalio, modalita,
    W, H,
    paletteCavalli,
    fase: 'attesa',       // 'attesa' | 'correndo' | 'fine'
    giroCorrente: 0,      // 0-based
    totalGiri: 3,
    progresso: {},        // { nomeContrada: frazione [0,1] per giro corrente }
    velocita: {},         // velocità istantanee (random basate su classifica)
    posizioniFinali: {},  // progressi cumulativi (0..totalGiri)
    frame: 0,
    classificaGiri: corsa.classificaGiri,
    classificaFinale: corsa.classificaFinale,
    inizioGiro: null,
    durataGiroMs: 10500,  // ms indicativi per animare ogni giro (cavallo medio)
  };

  // Inizializza progressi (tutti al via, sparpagliati di poco per il canapo)
  contrade.forEach((nc, i) => {
    window._palioAnimState.progresso[nc] = -i * 0.012; // scarto iniziale simulando l'ordine al canapo
    window._palioAnimState.velocita[nc] = 1;
    window._palioAnimState.posizioniFinali[nc] = 0;
  });

  // Disegna schermata di attesa
  disegnaPistaVuota(ctx, percorso, W, H);
  costruisciLegenda(contrade, nGiocatore);
}

function costruisciLegenda(contrade, nGiocatore) {
  const div = document.getElementById('LEGENDA_CONTRADE');
  if (!div) return;
  div.innerHTML = contrade.map(nc => {
    const isMe = nc === nGiocatore;
    // Crea mini-canvas per il pallino
    const id = 'pal_' + nc.replace(/\s/g,'_');
    return `<div style="display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.22);border-radius:6px;padding:3px 7px 3px 3px;border:${isMe?'1px solid rgba(200,153,30,.5)':'1px solid rgba(200,153,30,.12)'}">
      <canvas id="${id}" width="18" height="18" style="border-radius:50%;flex-shrink:0"></canvas>
      <span style="font-family:var(--fn);font-size:9px;color:${isMe?'var(--ocra)':'var(--ocra-l)'};font-weight:${isMe?'700':'400'}">${nc}${isMe?' ★':''}</span>
    </div>`;
  }).join('');
  // Disegna i mini pallini
  contrade.forEach(nc => {
    const c = document.getElementById('pal_'+nc.replace(/\s/g,'_'));
    if (!c) return;
    const x = c.getContext('2d');
    disegnaPallinoPalio(x, 9, 9, 8, nc);
  });
}

function disegnaPistaVuota(ctx, percorso, W, H) {
  ctx.clearRect(0,0,W,H);

  // Sfondo: terra del Campo (color ocra scura, leggermente sfumato)
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0, '#241006');
  bgGrad.addColorStop(1, '#170A03');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  const bandW = Math.max(14, W * 0.085); // larghezza pista proporzionale al canvas
  const n = percorso.length;

  // ─── Calcola normali smussate per ogni punto (media tra il segmento entrante e uscente) ───
  // Questo evita spigoli vivi/fessure nei punti d'angolo del percorso.
  const normali = [];
  for (let i = 0; i < n; i++) {
    const prev = percorso[(i-1+n)%n];
    const curr = percorso[i];
    const next = percorso[(i+1)%n];
    const a1 = Math.atan2(curr.y-prev.y, curr.x-prev.x);
    const a2 = Math.atan2(next.y-curr.y, next.x-curr.x);
    // media degli angoli (gestendo il wrap-around)
    let da = a2 - a1;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    const aMed = a1 + da/2 + Math.PI/2;
    normali.push({ x: Math.cos(aMed), y: Math.sin(aMed) });
  }

  // ─── Auto-correzione del verso delle normali ───
  // In base al senso di percorrenza (orario/antiorario) la normale calcolata
  // con +90° può puntare verso il centro invece che verso l'esterno: qui lo
  // verifichiamo con l'area con segno (shoelace) e invertiamo se necessario,
  // così "esterni" è SEMPRE il bordo davvero più esterno (niente più scambi
  // che causavano sovrapposizioni/spaccature tra fascia e prato interno).
  let areaSegno = 0;
  for (let i = 0; i < n; i++) {
    const a = percorso[i], b = percorso[(i+1)%n];
    areaSegno += a.x*b.y - b.x*a.y;
  }
  if (areaSegno > 0) {
    // poligono orario in coordinate canvas: la normale +90° punta verso il centro -> invertiamo
    for (let i = 0; i < n; i++) { normali[i].x *= -1; normali[i].y *= -1; }
  }

  // ─── Punti del bordo esterno e interno (un solo poligono continuo, niente giunture) ───
  const esterni = percorso.map((pt,i) => ({ x: pt.x + normali[i].x*bandW/2, y: pt.y + normali[i].y*bandW/2 }));
  const interni = percorso.map((pt,i) => ({ x: pt.x - normali[i].x*bandW/2, y: pt.y - normali[i].y*bandW/2 }));
  const centroPista = percorso.map((pt,i) => ({ x: pt.x, y: pt.y }));

  function traccia(pts, chiudi) {
    ctx.beginPath();
    pts.forEach((p,i) => { if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    if (chiudi) ctx.closePath();
  }

  // ─── Ombra proiettata sotto la pista (dà rilievo rispetto al prato interno) ───
  ctx.save();
  traccia(esterni, true);
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = Math.max(4, bandW*0.25);
  ctx.shadowOffsetY = Math.max(2, bandW*0.10);
  ctx.fillStyle = 'rgba(0,0,0,.001)'; // quasi invisibile, serve solo a proiettare l'ombra
  ctx.fill();
  ctx.restore();

  // ─── Fascia pista: un unico riempimento (esterno + interno invertito) ───
  ctx.beginPath();
  esterni.forEach((p,i) => { if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  for (let i = interni.length-1; i >= 0; i--) {
    const p = interni[i];
    if (i === interni.length-1) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
  ctx.fillStyle = '#8F4A1C';
  ctx.fill('evenodd');

  // ─── Striature radiali leggere (texture "a spina di pesce" del tufo senese) ───
  ctx.save();
  traccia(esterni, true);
  for (let i = interni.length-1; i >= 0; i--) {
    const p = interni[i];
    if (i === interni.length-1) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
  ctx.clip('evenodd');
  const passoStriscia = Math.max(3, Math.round(n/110));
  for (let i = 0; i < n; i += passoStriscia) {
    const c = centroPista[i];
    const nr = normali[i];
    ctx.beginPath();
    ctx.moveTo(c.x + nr.x*bandW/2, c.y + nr.y*bandW/2);
    ctx.lineTo(c.x - nr.x*bandW/2, c.y - nr.y*bandW/2);
    ctx.strokeStyle = (i % (passoStriscia*2) === 0) ? 'rgba(255,200,140,.05)' : 'rgba(0,0,0,.06)';
    ctx.lineWidth = bandW*0.16;
    ctx.stroke();
  }
  ctx.restore();

  // ─── Sfumatura d'insieme per dare profondità (più chiara verso il centro, più scura ai lati) ───
  ctx.save();
  traccia(esterni, true);
  for (let i = interni.length-1; i >= 0; i--) {
    const p = interni[i];
    if (i === interni.length-1) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
  ctx.clip('evenodd');
  const cx = W*0.5, cy = H*0.5;
  const grad = ctx.createRadialGradient(cx, cy*0.58, H*0.18, cx, cy*0.58, H*0.95);
  grad.addColorStop(0, 'rgba(255,205,140,.10)');
  grad.addColorStop(0.7, 'rgba(0,0,0,.04)');
  grad.addColorStop(1, 'rgba(0,0,0,.16)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  // ─── Piazza interna: mattone rosso senese (non verde) ───
  ctx.save();
  traccia(interni, true);
  const pratoGrad = ctx.createRadialGradient(W*0.5, H*0.58, H*0.04, W*0.5, H*0.58, H*0.52);
  pratoGrad.addColorStop(0, '#7A3010');
  pratoGrad.addColorStop(0.6, '#5C200A');
  pratoGrad.addColorStop(1, '#3D1206');
  ctx.fillStyle = pratoGrad;
  ctx.fill();
  ctx.restore();

  // ─── Bordo esterno ocra (un'unica polilinea continua, smussata) ───
  traccia(esterni, true);
  ctx.strokeStyle='rgba(220,175,70,.90)'; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.stroke();

  // ─── Bordo interno (un'unica polilinea continua, smussata) ───
  traccia(interni, true);
  ctx.strokeStyle='rgba(220,175,70,.55)'; ctx.lineWidth=1.2; ctx.lineJoin='round'; ctx.stroke();

  // ─── Sbandierino di Mossa/Arrivo — su percorso[0], bordo interno, drappo verso il centro ───
  const p0Flag = percorso[0];
  const nrmFlag = normali[0];
  // Il bordo interno è nella direzione -nrmFlag (verso il centro del campo)
  // Piazziamo la base dell'asta esattamente sul bordo interno
  const astaBaseX = p0Flag.x - nrmFlag.x * bandW * 0.50;
  const astaBaseY = p0Flag.y - nrmFlag.y * bandW * 0.50;
  const astaH = Math.max(18, bandW * 1.0);
  const astaW = Math.max(1.5, bandW * 0.07);
  const astaTopX = astaBaseX;
  const astaTopY = astaBaseY - astaH;
  // Asta
  ctx.beginPath();
  ctx.moveTo(astaBaseX, astaBaseY);
  ctx.lineTo(astaTopX, astaTopY);
  ctx.strokeStyle = 'rgba(220,175,70,0.95)';
  ctx.lineWidth = astaW;
  ctx.stroke();
  // Drappo: si apre sempre verso il centro della pista (direzione +nrmFlag = verso l'esterno)
  // Sul rettilineo sinistro la normale punta a sinistra (fuori pista), quindi +nrmFlag
  // punta fuori: usiamo -nrmFlag per andare verso il centro (destra)
  // Calcoliamo la direzione orizzontale verso il centro della pista
  const versoInterno = { x: -nrmFlag.x, y: -nrmFlag.y }; // verso il prato interno
  // Vogliamo che il drappo si apra verso il centro → usiamo +nrmFlag (verso esterno/muro)
  // In realtà sul lato sinistro nrmFlag punta verso sinistra (esterno),
  // quindi apriamo il drappo verso destra usando -nrmFlag
  const dW = Math.max(10, bandW * 0.60);
  const dH = Math.max(8, bandW * 0.40);
  const dX = astaTopX;
  const dY = astaTopY;
  // Punta del drappo nella direzione verso il centro (verso destra sul lato sinistro)
  const puntaX = dX + versoInterno.x * dW;
  const puntaY = dY + dH * 0.5;
  // Triangolo bianco (metà superiore)
  ctx.beginPath();
  ctx.moveTo(dX, dY);
  ctx.lineTo(puntaX, puntaY);
  ctx.lineTo(dX, dY + dH * 0.5);
  ctx.closePath();
  ctx.fillStyle = '#F4F4F0';
  ctx.fill();
  // Triangolo nero (metà inferiore)
  ctx.beginPath();
  ctx.moveTo(dX, dY + dH * 0.5);
  ctx.lineTo(puntaX, puntaY);
  ctx.lineTo(dX, dY + dH);
  ctx.closePath();
  ctx.fillStyle = '#141414';
  ctx.fill();
  // Contorno
  ctx.beginPath();
  ctx.moveTo(dX, dY);
  ctx.lineTo(puntaX, puntaY);
  ctx.lineTo(dX, dY + dH);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

function disegnaFramePalio() {
  const st = window._palioAnimState;
  if (!st) return;
  const { ctx, percorso, contrade, nGiocatore, W, H } = st;

  disegnaPistaVuota(ctx, percorso, W, H);

  // Posizioni con offset per evitare sovrapposizione
  const posXY = {};
  contrade.forEach(nc => {
    const cum = st.progresso[nc] || 0;
    // Chi ha già completato i 3 giri resta fermo al traguardo (frazione 0)
    const fraz = cum >= st.totalGiri ? 0 : ((cum % 1) + 1) % 1;
    const pt = posizioneAlPercorso(percorso, fraz);
    posXY[nc] = pt;
  });

  // Dimensione pallini/cavalli: proporzionali alla larghezza pista (piccoli, realistici)
  const r = Math.max(4, W * 0.016);

  // Frequenza del galoppo: cicli di falcata per giro di pista. Legata alla
  // distanza percorsa (progresso cumulativo) e non al tempo assoluto, così
  // un cavallo più veloce mostra visivamente zampe, collo e coda muoversi
  // più rapidamente, e i cavalli fermi al traguardo restano immobili.
  const FREQ_GALOPPO = 46;

  // Disegna i cavalli (il giocatore sopra tutti)
  const ordineDisegno = [...contrade.filter(n => n !== nGiocatore), nGiocatore];
  ordineDisegno.forEach(nc => {
    const pt = posXY[nc];
    if (!pt) return;
    const isMe = nc === nGiocatore;
    const cum = st.progresso[nc] || 0;
    const fraz = cum >= st.totalGiri ? 0 : ((cum % 1) + 1) % 1;
    const angolo = angoloAlPercorso(percorso, fraz);
    const fase = cum * FREQ_GALOPPO;

    // Alone per il cavallo del giocatore, orientato come il cavallo
    if (isMe) {
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(angolo);
      ctx.beginPath();
      ctx.ellipse(0, 0, r*2.3, r*1.35, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,153,30,.35)';
      ctx.fill();
      ctx.restore();
    }
    disegnaCavalloPalio(ctx, pt.x, pt.y, r, nc, angolo, fase, st.paletteCavalli && st.paletteCavalli[nc]);
  });
}

window.avviaSimulazionePalio = function() {
  const st = window._palioAnimState;
  if (!st || st.fase !== 'attesa') return;

  const btn = document.getElementById('BTN_CORSA');
  if (btn) btn.style.display = 'none';

  st.fase = 'correndo';
  st.giroCorrente = 0;
  st.ultimoTS = null;
  // Progressi cumulativi: 0 = inizio, 3.0 = fine (3 giri completi)
  // Inizializza con piccolo offset per l'ordine al canapo
  st.contrade.forEach((nc,i)=>{ st.progresso[nc] = -i*0.008; });

  aggiornaVelocitaGiro(st, 0);

  function tick(ts) {
    if (!window._palioAnimState || window._palioAnimState.fase === 'fine') return;
    const s = window._palioAnimState;

    const dt = s.ultimoTS ? Math.min(ts - s.ultimoTS, 50) : 16; // ms elapsed, capped
    s.ultimoTS = ts;

    // Velocità base: 1 giro completo in ~9 secondi per il cavallo medio
    const velBase = 0.000095;

    // Progresso leader attuale (per anti-doppiaggio)
    const progressoLeader = s.contrade.reduce((max, nc) => Math.max(max, s.progresso[nc] || 0), 0);

    s.contrade.forEach(nc => {
      let vel = s.velocita[nc];

      // Anti-doppiaggio robusto: mantieni tutti entro 0.5 giri dal leader.
      // Oltre quella soglia la velocità viene forzata a un multiplo crescente,
      // garantendo che nessun pallino venga mai doppiato visivamente.
      const distacco = progressoLeader - (s.progresso[nc] || 0);
      if (distacco > 0.50) {
        // Boost forte e proporzionale al ritardo: da 1.5× fino a 3×
        const velMin = 1.5 + Math.min(1.5, (distacco - 0.50) * 3.0);
        vel = Math.max(vel, velMin);
      }

      const step = velBase * vel * dt;
      s.progresso[nc] = (s.progresso[nc] || 0) + step;
    });

    // Giro corrente (per etichetta): basato sul leader
    const leader = s.contrade.reduce((a,b)=>(s.progresso[a]||0)>(s.progresso[b]||0)?a:b);
    const giroLeader = Math.floor(Math.max(0, s.progresso[leader]));
    if (giroLeader !== s.giroCorrente && giroLeader < s.totalGiri) {
      s.giroCorrente = giroLeader;
      aggiornaVelocitaGiro(s, Math.min(giroLeader, s.classificaGiri.length-1));
      const stato = document.getElementById('STATO_CORSA');
      if (stato) stato.textContent = giroLeader === 1 ? 'Giro 2 — Il ritmo si fa serrato!' : 'ULTIMO GIRO! 🔥';
    }

    // Fine corsa: TUTTE le contrade devono completare i 3 giri (come nel Palio reale,
    // dove la corsa prosegue visivamente fino in fondo per tutti i cavalli)
    const tuttiArrivati = s.contrade.every(nc => (s.progresso[nc] || 0) >= s.totalGiri);
    if (tuttiArrivati) {
      s.fase = 'fine';
      // Allinea le posizioni finali esattamente alla classifica simulata
      const n = s.contrade.length;
      s.classificaFinale.forEach((nc, i) => {
        s.progresso[nc] = s.totalGiri + (n-i)*0.002;
      });
      disegnaFramePalio();
      mostraRisultatoFinale(s);
      return;
    }

    disegnaFramePalio();
    aggiornaClassificaLive(s);
    window._palioAnimRAF = requestAnimationFrame(tick);
  }

  const stato = document.getElementById('STATO_CORSA');
  if (stato) stato.textContent = 'Giro 1 — Partenza!';
  window._palioAnimRAF = requestAnimationFrame(tick);
};

function aggiornaVelocitaGiro(st, giroIdx) {
  // Assegna velocità in base alla posizione in classifica a fine di questo giro
  const classGiro = st.classificaGiri[giroIdx];
  const n = st.contrade.length;
  classGiro.forEach((entry, posizioneZero) => {
    // Primo in classifica = velocità più alta, ultimo = più bassa
    const v = 1.0 + (n - 1 - posizioneZero) * (0.6 / Math.max(1, n-1));
    st.velocita[entry.nomeContrada] = v + (Math.random() * 0.12 - 0.06);
  });
}

function aggiornaClassificaLive(st) {
  const div = document.getElementById('CLASSIFICA_LIVE');
  if (!div) return;

  // Ordina per progresso (chi è più avanti)
  const ord = [...st.contrade].sort((a,b) => (st.progresso[b]||0) - (st.progresso[a]||0));

  div.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px">` +
    ord.slice(0,5).map((nc, i) => {
      const isMe = nc === st.nGiocatore;
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}°`;
      const id = 'ml_' + nc.replace(/\s/g,'_');
      return `<div style="display:flex;align-items:center;gap:6px;padding:2px 0">
        <span style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.45);width:20px">${medal}</span>
        <canvas id="${id}" width="14" height="14" style="border-radius:50%;flex-shrink:0"></canvas>
        <span style="font-family:var(--fn);font-size:11px;color:${isMe?'var(--ocra)':'var(--ocra-l)'};font-weight:${isMe?'700':'400'}">${nc}${isMe?' ★':''}</span>
      </div>`;
    }).join('') +
    (ord.length > 5 ? `<div style="font-family:var(--fn);font-size:9px;color:rgba(200,153,30,.3);padding:2px 0 0 26px">…altri ${ord.length-5}</div>` : '') +
    `</div>`;

  // Disegna pallini nella legenda live
  ord.slice(0,5).forEach(nc => {
    const c = document.getElementById('ml_'+nc.replace(/\s/g,'_'));
    if (!c) return;
    const x = c.getContext('2d');
    disegnaPallinoPalio(x, 7, 7, 6, nc);
  });
}

function mostraGiroCorsa(tipoPalio, nuovoGiro) {
  // Compatibilità — non più usata nella versione animata, ma manteniamo per sicurezza
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.corsaSimulata) return;
  datiPalio.corsaSimulata.giroMostrato = nuovoGiro;
  if (nuovoGiro >= NUM_GIRI_PALIO) datiPalio.corsaSimulata.conclusa = true;
  salvaCorrente();
  renderCorsaPalio(tipoPalio);
}

function preparaTrattaPalio(tipoPalio) {
  /* Ritorna l'oggetto tratta già preparato (se esiste) o lo genera e lo salva */
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (datiPalio.tratta) return datiPalio.tratta; // già preparata

  if (typeof CAVALLI_DB === 'undefined' || typeof FANTINI_DB === 'undefined') return null;

  /* 1. Determina i cavalli ammessi */
  const score = S.scoreCavalliAnno || {};
  let cavalliAmmessi = CAVALLI_DB.filter(c => (score[c.nome]?.corse || 0) >= 2);

  /* 2. Se meno di 5 cavalli hanno le corse (giocatore non ha giocato le province),
        si usano 12 cavalli casuali senza mostrare le statistiche individuali */
  let modalitaSegreta = false;
  if (cavalliAmmessi.length < 5) {
    modalitaSegreta = true;
    // Prendi 12 casuali dal db (o tutti se meno di 12)
    const copia = CAVALLI_DB.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    cavalliAmmessi = copia.slice(0, Math.min(12, copia.length));
  }

  /* 3. Dividi in gruppi da 5-6 (preferendo gruppi più grandi) */
  const nCavalli = cavalliAmmessi.length;
  // Calcola quante gare da 5 e quante da 6
  // n = 5a + 6b, con a+b = ceil(n/5.5) circa
  // Semplice: usa divisione per 5, e metti gli extra nell'ultima gara
  const gareDa5 = [];
  const shuffled = cavalliAmmessi.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  // Suddividi cercando gruppi il più possibile uguali tra 5 e 6
  const nGare = Math.ceil(nCavalli / 6);
  const gruppi = [];
  let offset = 0;
  for (let g = 0; g < nGare; g++) {
    // distribuisci i rimanenti: se ci sono abbastanza cavalli per tutti i gruppi rimanenti da 5, usa 5; altrimenti 6
    const rimCavalli = nCavalli - offset;
    const rimGare = nGare - g;
    const dimGruppo = Math.ceil(rimCavalli / rimGare);
    gruppi.push(shuffled.slice(offset, offset + dimGruppo));
    offset += dimGruppo;
  }

  /* 4. Assegna fantini a ogni gruppo rispettando il vincolo:
        stesso fantino non può montare due cavalli nella stessa prova */
  let fantini = (typeof FANTINI_DB !== 'undefined') ? FANTINI_DB.slice() : [];
  // Se il giocatore ha scelto un fantino esistente, lo esclude dalla lista dei rivali
  if(S && S.tipo === 'fantino' && S.sottotipo === 'esistente' && (S.dbId !== undefined || S.nome)){
    fantini = fantini.filter(f=>{
      if(S.dbId !== undefined && f.id !== undefined && f.id === S.dbId) return false;
      const nomeFan = f.soprannome || f.nome || '';
      return nomeFan !== S.nome;
    });
  }

  const miniGare = gruppi.map((cavalli, gIdx) => {
    // Shuffle dei fantini per questa gara
    const fantiniGara = fantini.slice();
    for (let i = fantiniGara.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [fantiniGara[i], fantiniGara[j]] = [fantiniGara[j], fantiniGara[i]];
    }
    // Assegna un fantino diverso a ogni cavallo della gara (ciclo se fantini < cavalli in questa gara)
    const coppie = cavalli.map((c, i) => ({
      cavallo: c,
      fantino: fantiniGara[i % fantiniGara.length]
    }));
    return {
      numero: gIdx + 1,
      coppie,
      risultato: null,  // popolato dopo la simulazione
      completata: false
    };
  });

  const tratta = {
    modalitaSegreta,
    nCavalliAmmessi: nCavalli,
    miniGare,
    garaCorrente: 0,    // indice della prossima gara da disputare
    tutteComplete: false
  };

  datiPalio.tratta = tratta;
  salvaCorrente();
  return tratta;
}

function renderTrattaPalio(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio) return;

  const tratta = preparaTrattaPalio(tipoPalio);
  if (!tratta) {
    // Fallback: nessun db disponibile
    avanzaFasePalio(tipoPalio, 1);
    return;
  }

  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 0;
  const progressHtml = FASI_PALIO.map((f, i) => `
    <div style="width:${100/FASI_PALIO.length - 1}%;height:4px;border-radius:2px;background:${i <= faseIdx ? 'var(--ocra)' : 'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  const pista = PISTE_PROVINCIA.senese; // sempre pista senese per la Tratta

  /* Costruisci le card delle prove */
  let gareHtml = '';

  tratta.miniGare.forEach((gara, gIdx) => {
    const eProssima = (gIdx === tratta.garaCorrente && !gara.completata);
    const giaFatta = gara.completata;

    let righePartecipanti = gara.coppie.map(cp => `
      <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(200,153,30,.08)">
        <div style="flex:1">
          <span style="font-family:var(--fn);font-size:12px;font-weight:700;color:var(--ocra-l)">🐎 ${cp.cavallo.nome}</span>
          <span style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.45)"> — 🏇 ${cp.fantino.nome}</span>
        </div>
      </div>`).join('');

    let righeRisultato = '';
    if (giaFatta && gara.risultato) {
      righeRisultato = gara.risultato.map((r, i) => `
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(200,153,30,.08)">
          <div style="font-family:var(--fn);font-size:13px;font-weight:700;color:${i===0?'var(--ocra)':'rgba(200,153,30,.45)'};width:22px">${i+1}°</div>
          <div style="flex:1">
            <span style="font-family:var(--fn);font-size:12px;font-weight:${i===0?'700':'400'};color:${i===0?'var(--ocra-l)':'var(--perg2)'}">🐎 ${r.cavallo.nome}</span>
            <span style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.4)"> — 🏇 ${r.fantino.nome}</span>
            ${r.caduta ? '<span style="font-family:var(--fn);font-size:10px;color:var(--ross);margin-left:4px">(caduta)</span>' : ''}
          </div>
        </div>`).join('');
    }

    gareHtml += `
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Prova ${gara.numero} · ${gara.coppie.length} cavalli</div>

      ${!giaFatta ? `
        <div style="margin-bottom:10px">${righePartecipanti}</div>
        ${eProssima
          ? `<button class="btn gold w" onclick="disputaMiniGaraTratta('${tipoPalio}', ${gIdx})">🏁 Corri la Gara ${gara.numero}</button>`

        ${righeRisultato}

  const btnAvanti = tratta.tutteComplete ? `
    <button class="btn gold w" style="margin-top:4px" onclick="avanzaFasePalio('${tipoPalio}', 1)">
      ${FASI_PALIO[1].icona} ${FASI_PALIO[1].titolo} →
    </button>` : '';

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">1/${FASI_PALIO.length}</span>
    </div>
    <div class="pad fade-in">

      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">
        ${progressHtml}
      </div>

      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:48px;margin-bottom:8px">🎲</div>
        <div class="screen-title">La Tratta</div>
        <div class="screen-sub" style="margin-bottom:0">Selezione e prova dei cavalli in Piazza del Campo</div>

            ? `Sono stati selezionati <strong style="color:var(--ocra)">${tratta.nCavalliAmmessi} cavalli</strong> per questa Tratta. Le prove vengono disputate su pista senese (3 giri) con prove da 5-6 cavalli.`
            : `<strong style="color:var(--ocra)">${tratta.nCavalliAmmessi} cavalli</strong> hanno superato la selezione con almeno 2 corse in provincia. Vengono ora divisi in <strong style="color:var(--ocra)">${tratta.miniGare.length} prove</strong> da 5-6 cavalli sulla pista senese (3 giri con le due curve a 90°).`

}

function disputaMiniGaraTratta(tipoPalio, garaIdx) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.tratta) return;
  const tratta = datiPalio.tratta;
  const gara = tratta.miniGare[garaIdx];
  if (!gara || gara.completata) return;

  const pista = PISTE_PROVINCIA.senese;
  gara.risultato = simulaGara(gara.coppie, pista);
  gara.completata = true;
  tratta.garaCorrente = garaIdx + 1;

  // Verifica se tutte le gare sono complete
  tratta.tutteComplete = tratta.miniGare.every(g => g.completata);

  salvaCorrente();
  renderTrattaPalio(tipoPalio);
}

/* Conclude l'annata (da Agosto) e passa a Gennaio dell'anno successivo */
/* ═══════════════════════════════════════════════
   SCELTA DEI CAVALLI — fase 2 del Palio
   Mostra tutti i cavalli della Tratta con:
   - Posizione d'arrivo in ogni prova della Tratta
   - Statistiche corse in provincia (se non modalità segreta)
   - Stella preferita (se assegnata dal giocatore)
   Il giocatore deve selezionare esattamente 10 cavalli per procedere.
═══════════════════════════════════════════════ */

function renderSceltaCavalliPalio(tipoPalio) {
  if (!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (!datiPalio || !datiPalio.tratta) { avanzaFasePalio(tipoPalio, 2); return; }

  const tratta = datiPalio.tratta;
  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 1;

  // Selezione corrente (persistita in datiPalio per sopravvivere ai re-render)
  if (!datiPalio.sceltaCavalli) datiPalio.sceltaCavalli = { selezionati: [] };
  const sel = datiPalio.sceltaCavalli.selezionati; // array di nomi cavallo

  // Raccoglie tutti i cavalli della Tratta con i loro risultati
  // Struttura: { cavallo, posizioneGara: [{gara, pos}], score }
  const cavalliTratta = [];
  tratta.miniGare.forEach((gara, gIdx) => {
    if (!gara.risultato) return;
    gara.risultato.forEach((r, posIdx) => {
      // Cerca se questo cavallo è già nell'elenco (non dovrebbe esserci, ma per sicurezza)
      let entry = cavalliTratta.find(e => e.cavallo.nome === r.cavallo.nome);
      if (!entry) {
        entry = { cavallo: r.cavallo, risultatiTratta: [], score: S.scoreCavalliAnno?.[r.cavallo.nome] || null };
        cavalliTratta.push(entry);
      }
      entry.risultatiTratta.push({ gara: gIdx + 1, pos: posIdx + 1, caduta: r.caduta });
    });
  });

  // Ordina per miglior posizione in Tratta (chi è arrivato 1° prima)
  cavalliTratta.sort((a, b) => {
    const bestA = Math.min(...a.risultatiTratta.map(r => r.pos));
    const bestB = Math.min(...b.risultatiTratta.map(r => r.pos));
    return bestA - bestB;
  });

  const progressHtml = FASI_PALIO.map((f, i) => `
    <div style="width:${100/FASI_PALIO.length - 1}%;height:4px;border-radius:2px;background:${i <= faseIdx ? 'var(--ocra)' : 'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  const boxHtml = cavalliTratta.map(entry => {
    const nome = entry.cavallo.nome;
    const isSelected = sel.includes(nome);
    const hasStar = !!(S.stelline && S.stelline[nome]);
    const score = entry.score;

    // Risultati Tratta
    const righeTratta = entry.risultatiTratta.map(r => `
      <span style="font-family:var(--fn);font-size:11px;color:${r.pos===1?'var(--ocra)':r.caduta?'var(--ross)':'rgba(200,153,30,.5)'};margin-right:6px">
        Gara ${r.gara}: <strong>${r.pos}°</strong>${r.caduta?' 💥':''}
      </span>`).join('');

    // Statistiche province (solo se non modalità segreta)
    let statsProvinciaHtml = '';
    if (!tratta.modalitaSegreta && score) {
      statsProvinciaHtml = `
      <div style="margin-top:7px;padding-top:7px;border-top:1px solid rgba(200,153,30,.1)">
        <div style="font-family:var(--fn);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(200,153,30,.32);margin-bottom:4px">Corse in Provincia</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <span style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.55)">🏁 Corse: <strong style="color:var(--ocra-l)">${score.corse}</strong></span>
          <span style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.55)">🥇 Batterie vinte: <strong style="color:var(--ocra-l)">${score.batterieVinte}</strong></span>
          <span style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.55)">🏆 Finali vinte: <strong style="color:var(--ocra-l)">${score.finaliVinte}</strong></span>
        </div>

    return `

                border:${isSelected ? '2px solid var(--ocra)' : '1px solid rgba(200,153,30,.2)'};
                border-radius:13px;padding:14px;margin-bottom:10px;cursor:pointer;
                position:relative;overflow:hidden;
                box-shadow:${isSelected ? '0 0 16px rgba(200,153,30,.18)' : 'none'};
                transition:all .12s">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,${isSelected?'var(--ocra)':'rgba(200,153,30,.15)'},transparent)"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:18px">🐎</span>
          <span style="font-family:var(--fn);font-size:14px;font-weight:700;color:${isSelected?'var(--ocra)':'var(--ocra-l)'}">
            ${nome}
          </span>
          ${hasStar ? '<span style="color:var(--ocra);font-size:14px" title="Cavallo preferito">★</span>' : ''}
        </div>
        <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${isSelected?'var(--ocra)':'rgba(200,153,30,.25)'};
                    background:${isSelected?'var(--ocra)':'transparent'};
                    display:flex;align-items:center;justify-content:center;flex-shrink:0">
          ${isSelected ? '<span style="font-size:11px;color:#1A0A04;font-weight:900">✓</span>' : ''}
        </div>
      </div>

      <div style="font-family:var(--fn);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(200,153,30,.32);margin-bottom:5px">Risultati Tratta</div>
      <div style="display:flex;flex-wrap:wrap;gap:2px">${righeTratta}</div>

  const nSel = sel.length;

  setMain(`

        <div class="screen-sub" style="margin-bottom:0">Seleziona 10 cavalli per il Palio</div>
      </div>

      <div style="position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--mat) 80%,transparent);padding:8px 0 10px;margin-bottom:4px">

          <div>
            <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5);margin-bottom:2px">Cavalli selezionati</div>

              ${nSel} / 10
            </div>
          </div>
          <button class="btn gold" ${pronto?'':'disabled'} style="padding:10px 16px" onclick="avanzaFasePalio('${tipoPalio}', 2)">
            ${FASI_PALIO[2].icona} ${FASI_PALIO[2].titolo} →
          </button>
        </div>
        ${nSel > 10 ? `<div style="font-family:var(--fn);font-size:11px;color:var(--ross);text-align:center;margin-top:6px">Hai selezionato troppi cavalli — deselezionane ${nSel-10}.</div>` : ''}
      </div>

      <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.38);margin-bottom:10px">
        ${cavalliTratta.length} cavalli hanno partecipato alla Tratta. Tocca un cavallo per selezionarlo o deselezionarlo.
        ${tratta.modalitaSegreta ? '<br><span style="color:rgba(200,153,30,.25)">Le statistiche delle corse in provincia non sono disponibili (non hai disputato le gare).</span>' : ''}
      </div>

    </div>
  </div>
  `);
}

/* ═══════════════════════════════════════════════
   PRESENTAZIONE DEL LOTTO — fase 3 del Palio
   Calcola i 10 cavalli del lotto sommando:
   - I voti del giocatore (sceltaCavalli.selezionati)
   - I voti random di ognuna delle altre 9 contrade partecipanti
     (ognuna sceglie 10 cavalli casuali tra quelli della Tratta)
   I 10 cavalli con più voti entrano nel lotto.
   In caso di parità si sceglie a caso tra i pareggianti.
═══════════════════════════════════════════════ */

function calcolaLottoPalio(tipoPalio) {
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if (datiPalio.lotto) return datiPalio.lotto; // già calcolato

  const tratta = datiPalio.tratta;
  if (!tratta) return null;

  // Elenco di tutti i cavalli della Tratta
  const tuttiCavalli = [];
  tratta.miniGare.forEach(gara => {
    if (!gara.risultato) return;
    gara.risultato.forEach(r => {
      if (!tuttiCavalli.find(c => c.nome === r.cavallo.nome)) {
        tuttiCavalli.push(r.cavallo);
      }
    });
  });

  if (tuttiCavalli.length === 0) return null;

  // Conteggio voti per ogni cavallo
  const voti = {};
  tuttiCavalli.forEach(c => { voti[c.nome] = 0; });

  // 1. Voti del giocatore
  const selGiocatore = datiPalio.sceltaCavalli?.selezionati || [];
  selGiocatore.forEach(nome => { if (voti[nome] !== undefined) voti[nome]++; });

  // 2. Voti delle altre 9 contrade (una per ogni partecipante eccetto il giocatore)
  const nomeContradaGiocatore = S.contrada ? S.contrada.nome : null; // null nella Carriera Fantino
  const altreContrade = datiPalio.partecipanti.filter(c => c !== nomeContradaGiocatore);
  altreContrade.forEach(() => {
    // Ogni contrada sceglie 10 cavalli random dall'elenco della Tratta
    const pool = tuttiCavalli.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const scelta = pool.slice(0, Math.min(10, pool.length));
    scelta.forEach(c => { voti[c.nome]++; });
  });

  // Ordina per voti decrescenti
  const ordinati = tuttiCavalli
    .map(c => ({ cavallo: c, voti: voti[c.nome] }))
    .sort((a, b) => b.voti - a.voti);

  // Prendi i primi 10 gestendo i pareggi al confine
  // Trova il valore minimo dei top-10
  const soglia10 = ordinati.length >= 10 ? ordinati[9].voti : 0;
  const sicuri = ordinati.filter(e => e.voti > soglia10);
  const inPareggio = ordinati.filter(e => e.voti === soglia10);

  // Riempie fino a 10 pescando random dai pareggianti
  const lottoCandidati = sicuri.slice();
  for (let i = inPareggio.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [inPareggio[i], inPareggio[j]] = [inPareggio[j], inPareggio[i]];
  }
  const daAggiungere = 10 - lottoCandidati.length;
  lottoCandidati.push(...inPareggio.slice(0, daAggiungere));

  // Salva nel lotto anche i voti per visualizzazione
  const lotto = lottoCandidati.map(e => ({
    cavallo: e.cavallo,
    voti: e.voti
  }));

  // Ordina il lotto per voti decrescenti (per la presentazione)
  lotto.sort((a, b) => b.voti - a.voti);

  datiPalio.lotto = lotto;
  datiPalio.votiTratta = voti; // conserva tutti i voti per riferimento
  salvaCorrente();
  return lotto;
}

      <div style="width:100%;height:6px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden;border:1px solid rgba(200,153,30,.1)">
        <div style="height:100%;width:${barraLarghezza}%;background:${hasStar?'var(--ocra)':'linear-gradient(90deg,var(--ocra-d),var(--ocra))'};border-radius:4px;transition:width .3s"></div>

  setMain(`

    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx + 1}/${FASI_PALIO.length}</span>
    </div>
    <div class="pad fade-in">
