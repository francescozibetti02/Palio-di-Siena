          :
          `<button class="btn gold w" onclick="estraiCanapoPalioFantino('${tipoPalio}')">🎯 Estrazione (${nAssegnate+1}/10)</button>`
        }
      </div>
    </div>
  </div>
  `);
}

/* ═══════════════════════════════════════════════
   LA MOSSA — Carriera Fantino
   Schermata che precede il minigioco "Ferma la barra" (lo stesso motore già
   usato per Tratta e Corse in Provincia, esteso con il nuovo contesto
   'corsaFantino'). Prima di partire ricorda al giocatore l'eventuale accordo
   segreto preso nella fase "Accordi con le Contrade" per sbagliare
   apposta la mossa (datiPalio.accordoMossaFantino). A mossa conclusa,
   verifica se il patto è stato rispettato (mossa pessima) o tradito
   (qualsiasi altro esito) e assegna ±intesa di conseguenza; il bonus di
   velocità ottenuto viene salvato in datiPalio.bonusMossaFantino, pronto per
   essere usato dal motore di corsa quando la fase "Il Palio" sarà
   implementata per la Carriera Fantino.
═══════════════════════════════════════════════ */
function renderMossaPalioFantino(tipoPalio){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.contradaFantino){ avanzaFasePalioFantino(tipoPalio, 6); return; }
  if(!datiPalio.canapoFantino || !datiPalio.canapoFantino.completata){ avanzaFasePalioFantino(tipoPalio, 7); return; }
  if(datiPalio.mossaFantino){ renderEsitoMossaFantino(tipoPalio); return; } // mossa già disputata

  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 8;

  const progressHtml = FASI_PALIO_FANTINO.map((f,i) => `
    <div style="width:${100/FASI_PALIO_FANTINO.length - 1}%;height:4px;border-radius:2px;background:${i<=faseIdx?'var(--ocra)':'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  const contradaAccordo = datiPalio.accordoMossaFantino || null;
  const accordoHtml = contradaAccordo ? `
    <div class="card" style="margin-bottom:14px;border-color:rgba(200,60,50,.4)">
      <div class="card-title">⚠️ Accordo segreto in corso</div>
      <div style="font-family:var(--fn);font-size:12px;color:var(--perg2);line-height:1.7">
        Hai accettato oro dalla Contrada del <strong style="color:var(--ross)">${contradaAccordo}</strong> per sbagliare apposta la mossa.
        Se fermerai la barra <strong style="color:var(--ocra)">lontano dall'obiettivo</strong> manterrai la parola: intesa con la Contrada del ${contradaAccordo} <strong style="color:var(--verde)">+15</strong>.
        Se invece la mossa risulterà buona, l'accordo sarà tradito: intesa con la Contrada del ${contradaAccordo} <strong style="color:var(--ross)">−20</strong>.
      </div>
    </div>` : `
    <div class="card" style="margin-bottom:14px">
      <div class="card-title">Nessun accordo in corso</div>
      <div style="font-family:var(--fn);font-size:12px;color:rgba(200,153,30,.45)">Non hai preso impegni segreti per questa mossa: sei libero di partire al meglio delle tue possibilità.</div>
    </div>`;

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx+1}/${FASI_PALIO_FANTINO.length}</span>
    </div>
    <div class="pad fade-in">
      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">${progressHtml}</div>
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:40px;margin-bottom:6px">🚩</div>
        <div class="screen-title">La Mossa</div>
        <div class="screen-sub" style="margin-bottom:0">Il momento della partenza: tutto si decide in un istante</div>
      </div>
      ${accordoHtml}
      <div class="card" style="text-align:center">
        <div style="font-family:var(--fn);font-size:12px;color:var(--perg2);line-height:1.7;margin-bottom:12px">
          Tocca per fermare la barra mobile il più vicino possibile all'obiettivo. Più sei preciso, maggiore sarà il bonus di velocità alla partenza.
        </div>
        <button class="btn gold w" onclick="renderAtteggiamentoGaraFantino('${tipoPalio}')">🚩 Vai alla Mossa</button>
      </div>
    </div>
  </div>
  `);
}

/* ═══════════════════════════════════════════════
   ATTEGGIAMENTO DI GARA — Carriera Fantino
   Schermata intermedia, mostrata solo nella Carriera Fantino subito prima di
   avviare il minigioco della Mossa ("Ferma la barra"), che permette al
   giocatore di scegliere come affrontare mossa e Carriera. La scelta viene
   salvata in datiPalio.atteggiamentoGaraFantino (una sola volta per Palio) e
   applica modificatori al cavallo del giocatore (e, per "Scambio di
   nerbate", anche al cavallo della contrada storicamente nemica, presa da
   RAPPORTI_CONTRADE indipendentemente dai rapporti/amicizia correnti) tramite
   gli stessi offset già usati da accordi e canapo (velocitaOffsetContrade,
   accelerazioneOffsetContrade). La difficoltà del minigioco Mossa viene
   inoltre modulata direttamente in avviaMossaCorsaFantino. */
const ATTEGGIAMENTI_GARA_FANTINO = [
  {
    id: 'attacco',
    icona: '⚔️',
    titolo: "D'Attacco",
    descrizione: "Scatta con decisione dalla mossa e prova a comandare la Carriera fin dal primo giro.",
    dettaglio: 'Cavallo: Accelerazione <span style="color:var(--verde)">+1</span><br>Mossa: zona verde dimezzata, barra più veloce <span style="color:var(--ross)">(minigioco più difficile)</span>'
  },
  {
    id: 'rimonta',
    icona: '🛡️',
    titolo: 'Di Rimonta',
    descrizione: "Parti coperto e lascia agli altri il comando: recupererai terreno nelle curve.",
    dettaglio: 'Mossa più semplice da gestire <span style="color:var(--verde)">(minigioco più facile)</span><br>Cavallo: Velocità <span style="color:var(--ross)">−1</span>'
  },
  {
    id: 'nerbate',
    icona: '🗡️',
    titolo: 'Scambio di nerbate',
    descrizione: "Dimentica la vittoria: l'obiettivo è restare a ridosso della contrada nemica per ostacolarla per tutti e tre i giri.",
    dettaglio: 'Cavallo tuo: Velocità <span style="color:var(--ross)">−2</span><br>Cavallo della contrada nemica: Velocità <span style="color:var(--ross)">−2</span>'
  }
];

function renderAtteggiamentoGaraFantino(tipoPalio){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.contradaFantino) return;
  if(datiPalio.mossaFantino){ renderEsitoMossaFantino(tipoPalio); return; }

  // Se l'atteggiamento è già stato scelto (es. rientro nella schermata), salta
  // direttamente al minigioco senza permettere di sceglierne un altro.
  if(datiPalio.atteggiamentoGaraFantino){ avviaMossaCorsaFantino(tipoPalio); return; }

  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const faseIdx = 8;

  const progressHtml = FASI_PALIO_FANTINO.map((f,i) => `
    <div style="width:${100/FASI_PALIO_FANTINO.length - 1}%;height:4px;border-radius:2px;background:${i<=faseIdx?'var(--ocra)':'rgba(200,153,30,.15)'};display:inline-block;margin:0 0.5%"></div>
  `).join('');

  const contradaGiocatore = datiPalio.contradaFantino;
  const rapp = RAPPORTI_CONTRADE[contradaGiocatore];
  const nemicaStorica = (rapp && rapp.rivali && rapp.rivali.length) ? rapp.rivali[0] : null;
  const nemicaPresente = !!(nemicaStorica && (datiPalio.partecipanti||[]).includes(nemicaStorica));

  const cardsHtml = ATTEGGIAMENTI_GARA_FANTINO.map(a => {
    const disabilitato = (a.id === 'nerbate') && !nemicaPresente;
    const notaHtml = (a.id === 'nerbate' && nemicaStorica)
      ? (nemicaPresente
          ? `<div style="font-family:var(--fn);font-size:10px;color:rgba(200,153,30,.45);margin-top:6px">Contrada nemica al Palio: <strong style="color:var(--ross)">${nemicaStorica}</strong></div>`
          : `<div style="font-family:var(--fn);font-size:10px;color:rgba(139,26,0,.6);margin-top:6px;font-style:italic">⚠️ La contrada storicamente nemica (${nemicaStorica}) non partecipa a questo Palio</div>`)
      : '';
    return `
    <div class="card" style="margin-bottom:10px;padding:14px;${disabilitato?'opacity:.38;':'cursor:pointer;'}" ${!disabilitato ? `onclick="sceglIAtteggiamentoGaraFantino('${tipoPalio}','${a.id}')"` : ''}>
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="font-size:26px;flex-shrink:0;margin-top:2px">${a.icona}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--ocra-l);margin-bottom:3px">${a.titolo}</div>
          <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.6);line-height:1.5;margin-bottom:6px">${a.descrizione}</div>
          <div style="font-family:var(--fn);font-size:11px;color:var(--perg2);line-height:1.7">${a.dettaglio}</div>
          ${notaHtml}
        </div>
      </div>
    </div>`;
  }).join('');

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${faseIdx+1}/${FASI_PALIO_FANTINO.length}</span>
    </div>
    <div class="pad fade-in">
      <div style="display:flex;width:100%;margin-bottom:16px;margin-top:8px">${progressHtml}</div>
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:40px;margin-bottom:6px">🎯</div>
        <div class="screen-title">Atteggiamento di Gara</div>
        <div class="screen-sub" style="margin-bottom:0">Come vuoi affrontare la mossa e la Carriera?</div>
      </div>
      ${cardsHtml}
    </div>
  </div>
  `);
}

/* Applica gli effetti dell'atteggiamento scelto (offset a cavallo/i coinvolti,
   salvati sugli stessi campi già letti da preparaCorsaPalioFantino) e avvia il
   minigioco della Mossa, la cui difficoltà viene poi modulata in base
   all'atteggiamento direttamente in avviaMossaCorsaFantino. */
function sceglIAtteggiamentoGaraFantino(tipoPalio, id){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.contradaFantino || datiPalio.atteggiamentoGaraFantino) return;

  const contradaGiocatore = datiPalio.contradaFantino;
  datiPalio.atteggiamentoGaraFantino = id;

  if(id === 'attacco'){
    if(!datiPalio.accelerazioneOffsetContrade) datiPalio.accelerazioneOffsetContrade = {};
    datiPalio.accelerazioneOffsetContrade[contradaGiocatore] = (datiPalio.accelerazioneOffsetContrade[contradaGiocatore]||0) + 1;
    S.log.push("Atteggiamento di gara scelto: D'Attacco. Accelerazione del cavallo +1, mossa più difficile.");
  } else if(id === 'rimonta'){
    if(!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
    datiPalio.velocitaOffsetContrade[contradaGiocatore] = (datiPalio.velocitaOffsetContrade[contradaGiocatore]||0) - 1;
    S.log.push('Atteggiamento di gara scelto: Di Rimonta. Velocità del cavallo -1, mossa più facile.');
  } else if(id === 'nerbate'){
    const rapp = RAPPORTI_CONTRADE[contradaGiocatore];
    const nemicaStorica = (rapp && rapp.rivali && rapp.rivali.length) ? rapp.rivali[0] : null;
    if(!datiPalio.velocitaOffsetContrade) datiPalio.velocitaOffsetContrade = {};
    datiPalio.velocitaOffsetContrade[contradaGiocatore] = (datiPalio.velocitaOffsetContrade[contradaGiocatore]||0) - 2;
    if(nemicaStorica && (datiPalio.partecipanti||[]).includes(nemicaStorica)){
      datiPalio.velocitaOffsetContrade[nemicaStorica] = (datiPalio.velocitaOffsetContrade[nemicaStorica]||0) - 2;
      S.log.push(`Atteggiamento di gara scelto: Scambio di nerbate contro la ${nemicaStorica}. Velocità del tuo cavallo -2, velocità del cavallo della ${nemicaStorica} -2.`);
    } else {
      S.log.push('Atteggiamento di gara scelto: Scambio di nerbate. Velocità del tuo cavallo -2.');
    }
  }

  salvaCorrente();
  avviaMossaCorsaFantino(tipoPalio);
}

/* Costruisce le coppie cavallo/fantino delle 10 contrade in Piazza (riusando
   l'assegnazione cavalli e i fantini rivali già sorteggiati per gli accordi)
   e avvia il minigioco "Ferma la barra" con il nuovo contesto 'corsaFantino'. */
function avviaMossaCorsaFantino(tipoPalio){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio || !datiPalio.contradaFantino) return;

  const contradaGiocatore = datiPalio.contradaFantino;
  const assegnazioni = (datiPalio.assegnazione && datiPalio.assegnazione.assegnazioni) || {};
  const fantiniRivali = datiPalio.fantiniRivaliAccordi || {};
  const statDefault = { velocita:3, accelerazione:3, tenuta_curva:3, resistenza:3, nervosismo:3 };

  const trovaCavalloPerContrada = (nomeContrada) => {
    const nomeCav = Object.keys(assegnazioni).find(nc => assegnazioni[nc] === nomeContrada);
    if(!nomeCav) return statDefault;
    if(nomeContrada === contradaGiocatore && S.cavalliPosseduti && S.cavalliPosseduti.includes(nomeCav)){
      const st = statoVivoCavallo(nomeCav);
      if(st) return st;
    }
    const base = (typeof CAVALLI_DB !== 'undefined') ? CAVALLI_DB.find(c => c.nome === nomeCav) : null;
    return base || statDefault;
  };

  const partecipanti = datiPalio.partecipanti || [];
  const coppieBatteria = partecipanti.map(nomeContrada => {
    const giocatore = (nomeContrada === contradaGiocatore);
    const cavallo = trovaCavalloPerContrada(nomeContrada);
    let fantino;
    if(giocatore){
      fantino = { nome:'Tu', bravura:S.bravura||1, esperienza:S.esperienza||1, gestione_mossa:S.gestioneMossa||1, empatia:S.empatia||1 };
    } else {
      const nomeFan = fantiniRivali[nomeContrada];
      const f = (typeof FANTINI_DB !== 'undefined') ? FANTINI_DB.find(x => x.nome === nomeFan) : null;
      fantino = f || { nome:'Fantino', bravura:3, esperienza:3, gestione_mossa:3, empatia:3 };
    }
    return { cavallo, fantino, giocatore };
  });

  let { velocita, ampiezzaZona } = calcolaDifficoltaMossa(coppieBatteria);

  // Modula la difficoltà del minigioco in base all'atteggiamento di gara scelto
  // nella schermata precedente (renderAtteggiamentoGaraFantino).
  const atteggiamento = datiPalio.atteggiamentoGaraFantino;
  if(atteggiamento === 'attacco'){
    // D'Attacco: zona verde dimezzata e barra più veloce (minigioco più difficile)
    ampiezzaZona = Math.max(3.5, ampiezzaZona * 0.5);
    velocita = Math.min(2.6, velocita * 1.4);
  } else if(atteggiamento === 'rimonta'){
    // Di Rimonta: zona verde più ampia e barra più lenta (minigioco più facile)
    ampiezzaZona = Math.min(20, ampiezzaZona * 1.5);
    velocita = Math.max(0.8, velocita * 0.7);
  }

  window._mossaState = {
    contesto: 'corsaFantino',
    tipoPalio,
    velocita,
    ampiezzaZona,
    centroObiettivo: 50,
    posizione: 0,
    direzione: 1,
    fermata: false,
    timerId: null
  };
  renderMinigiocoMossa();
  avviaTickMossa();
}

/* Risolve l'esito della mossa: applica l'eventuale accordo segreto e salva il
   bonus di velocità per il futuro motore di corsa della Carriera Fantino. */
function concludiMossaCorsaFantino(tipoPalio, bonus, esito){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio) return;

  const mossaFantino = { esito, bonus, esitoAccordo: null };
  const contradaAccordo = datiPalio.accordoMossaFantino || null;

  if(contradaAccordo){
    if(!S.intesaContrade) S.intesaContrade = {};
    const intesaAttuale = (S.intesaContrade[contradaAccordo] !== undefined) ? S.intesaContrade[contradaAccordo] : 50;
    const rispettato = (esito === 'pessima');
    if(rispettato){
      S.intesaContrade[contradaAccordo] = Math.min(100, intesaAttuale + 15);
      applicaRivalitaIntesaContrada(contradaAccordo);
      S.log.push(`Hai rispettato l'accordo segreto con la Contrada del ${contradaAccordo}: mossa volutamente sbagliata. Intesa con la Contrada del ${contradaAccordo} +15.`);
    } else {
      S.intesaContrade[contradaAccordo] = Math.max(0, intesaAttuale - 20);
      S.log.push(`Hai tradito l'accordo segreto con la Contrada del ${contradaAccordo}: la mossa non è stata sbagliata. Intesa con la Contrada del ${contradaAccordo} -20.`);
    }
    mossaFantino.esitoAccordo = rispettato ? 'rispettato' : 'tradito';
  }

  datiPalio.mossaFantino = mossaFantino;
  datiPalio.bonusMossaFantino = bonus; // pronto per il motore di corsa, non ancora implementato
  salvaCorrente();
  renderEsitoMossaFantino(tipoPalio);
}

        ${rispettato
          ? `${rispettato?'✅':''} Hai rispettato il patto con la Contrada del <strong style="color:var(--ocra-l)">${datiPalio.accordoMossaFantino}</strong>: la mossa è stata volutamente sbagliata. Intesa con la Contrada del ${datiPalio.accordoMossaFantino} <strong style="color:var(--verde)">+15</strong>.`
          : `❌ Non hai rispettato il patto con la Contrada del <strong style="color:var(--ocra-l)">${datiPalio.accordoMossaFantino}</strong>: la mossa non è stata sbagliata. Intesa con la Contrada del ${datiPalio.accordoMossaFantino} <strong style="color:var(--ross)">−20</strong>.`}

        <div class="screen-title" style="color:${e.colore}">${e.titolo}</div>
        <div class="screen-sub" style="margin-bottom:0">${e.testo}</div>

      ${atteggiamentoHtml}
      <div class="card" style="margin-bottom:14px;text-align:center">
        <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.5)">Bonus velocità alla partenza</div>
        <div style="font-family:var(--fn);font-size:20px;font-weight:700;color:${e.colore}">×${m.bonus}</div>

/* ═══════════════════════════════════════════════
   IL VINCITORE — Carriera Fantino
   Due casi possibili:
   1) Il giocatore non ha corso questo Palio (nessuna contrada gli ha offerto
      l'ingaggio, vedi renderOffertePalioFantino): si estrae un vincitore a
      caso tra le partecipanti, senza alcun effetto sulle statistiche del
      giocatore.
   2) Il giocatore ha corso (datiPalio.contradaFantino presente): premi ed
      effetti dipendono dal piazzamento — 1° posto: 3000 oro, Fama +20,
      Intesa Contrada +20, +1 Vittoria, Esperienza +1, Bravura +1, Empatia +1;
      2° posto: 2000 oro; 3° posto: 1000 oro; dal 4° posto in giù: Fama −5,
      Intesa Contrada −10, Intesa con tutte le altre 16 contrade +10,
      Esperienza −1, Bravura −1, Empatia −1. Effetti applicati una sola volta
      per Palio (guardia datiPalio._vincitoreEffettiApplicatiFantino).
═══════════════════════════════════════════════ */
function renderVincitorePalioFantino(tipoPalio){
  if(!S) return;
  const datiPalio = tipoPalio === 'luglio' ? S.palioLuglioAnno : S.palioAgostoAnno;
  if(!datiPalio) return;
  // Il Palio è ormai concluso: da qui in poi l'etichetta "Partecipa al Palio" sulle
  // contrade sparisce subito (vedi contradePartecipantiPalioFantino), senza aspettare
  // il cambio d'anno, così non si confonde con l'eventuale Palio successivo.
  datiPalio.concluso = true;

  const nomePalio = tipoPalio === 'luglio' ? 'Luglio' : 'Agosto';
  const nextFn = "avanzaMeseFantino()";

  // ── Caso 1: il giocatore non ha corso questo Palio ──
  if(!datiPalio.contradaFantino){
    if(!datiPalio.vincitore){
      const partecipanti = datiPalio.partecipanti || [];
      datiPalio.vincitore = partecipanti.length ? partecipanti[Math.floor(Math.random()*partecipanti.length)] : null;
      salvaCorrente();
    }
    const vincitore = datiPalio.vincitore;
    const datiVincitore = CONTRADE.find(c => c.nome === vincitore);

    setMain(`
    <div>
      <div class="hdr">
        <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
        <span class="hdr-right" style="font-size:10px">${FASI_PALIO_FANTINO.length}/${FASI_PALIO_FANTINO.length}</span>
      </div>
      <div class="pad fade-in">
        <div class="screen-title" style="margin-top:8px">🏆 Il Vincitore</div>
        <div class="screen-sub">Questa volta non eri in sella</div>
        <div class="card" style="text-align:center;padding:24px 16px">
          <div style="font-family:var(--fn);font-size:11px;color:rgba(200,153,30,.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px">
            La Carriera è corsa — e vinta dalla…
          </div>
          <img src="img/palio/drappellone_${tipoPalio}.png" alt="Drappellone del Palio di ${nomePalio}"
               style="width:110px;height:auto;object-fit:contain;margin:0 auto 16px;display:block;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.4)"
               onerror="this.style.display='none'">
          ${vincitore && datiVincitore ? `<img src="${IMG_BASE}${datiVincitore.img}" alt="${vincitore}"
               style="width:80px;height:80px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.2);border:2px solid var(--ocra);margin:0 auto 14px;display:block"
               onerror="this.style.opacity='.15'">` : ''}
          <div style="font-family:var(--fs);font-size:26px;font-weight:700;color:var(--ocra);margin-bottom:8px">
            ${vincitore ? `Contrada del${/^[AEIOU]/.test(vincitore)?'l\'':' '}${vincitore}` : 'Palio non disputato'}
          </div>
          <div style="font-family:var(--fn);font-size:12px;color:rgba(200,153,30,.45);line-height:1.7;margin-bottom:20px">
            ${vincitore ? `Il drappellone di ${nomePalio} ${S.anno} va alla Contrada del${/^[AEIOU]/.test(vincitore)?'l\'':' '}${vincitore}.<br>` : ''}
            Nessuna contrada ti ha ingaggiato per questa Carriera — l'anno prossimo andrà meglio.
          </div>
          <button class="btn gold w" onclick="${nextFn}">
            ${tipoPalio === 'luglio' ? '📅 Vai a Luglio →' : '📅 Nuovo anno →'}
          </button>
        </div>
      </div>
    </div>
    `);
    return;
  }

  // ── Caso 2: il giocatore ha corso questo Palio ──
  const contradaGiocatore = datiPalio.contradaFantino;
  let corsa = datiPalio.corsaSimulataFantino;
  if(!corsa){ corsa = preparaCorsaPalioFantino(tipoPalio); }
  if(!corsa){ setMain(''); avanzaMeseFantino(); return; }

  const classifica = datiPalio.corsaClassificaFantino || corsa.classificaFinale;
  const vincitore = datiPalio.vincitoreFantino || classifica[0];
  const datiVincitore = CONTRADE.find(c => c.nome === vincitore);
  const giocatoreVince = vincitore === contradaGiocatore;
  const piazzamento = classifica.findIndex(n => n === contradaGiocatore) + 1;
  const premioOro = piazzamento ? (PREMI_ORO_PALIO_FANTINO[piazzamento-1] || 0) : 0;
  const suiPodio = piazzamento >= 1 && piazzamento <= 3;

  if(!datiPalio._vincitoreEffettiApplicatiFantino){
    datiPalio._vincitoreEffettiApplicatiFantino = true;
    if(!S.obiettiviCompletati) S.obiettiviCompletati = {};
    if(!S.intesaContrade) S.intesaContrade = {};

    // Obiettivo "Esordio": aver corso almeno un Palio in Carriera.
    S.palioCorsi = (S.palioCorsi || 0) + 1;

    S.oro = (S.oro || 0) + premioOro;

    if(giocatoreVince){
      S.vittorie = (S.vittorie || 0) + 1;
      S.fama = Math.min(100, (S.fama || 0) + 20);
      const intesaAttuale = (S.intesaContrade[contradaGiocatore] !== undefined) ? S.intesaContrade[contradaGiocatore] : 50;
      S.intesaContrade[contradaGiocatore] = Math.min(100, intesaAttuale + 20);
      applicaRivalitaIntesaContrada(contradaGiocatore);
      S.esperienza = Math.max(1, Math.min(5, (S.esperienza||1) + 1));
      S.bravura = Math.max(1, Math.min(5, (S.bravura||1) + 1));
      S.empatia = Math.max(1, Math.min(5, (S.empatia||1) + 1));

      completaObiettivoDiretto(OBIETTIVI_FANTINO, 'nata_stella', 'fama');
      completaObiettivoDiretto(OBIETTIVI_FANTINO, tipoPalio === 'luglio' ? 'vinci_luglio' : 'vinci_agosto', 'fama');
      const idVinciContrada = MAPPA_OBIETTIVO_VINCI_CONTRADA[contradaGiocatore];
      if(idVinciContrada) completaObiettivoDiretto(OBIETTIVI_FANTINO, idVinciContrada, 'fama');
    } else if(suiPodio){
      S.log.push(`Piazzamento al ${piazzamento}° posto al Palio di ${nomePalio} ${S.anno}: nessun effetto su fama, intesa o statistiche.`);
    } else {
      S.fama = Math.max(0, (S.fama || 0) - 5);
      const intesaAttuale = (S.intesaContrade[contradaGiocatore] !== undefined) ? S.intesaContrade[contradaGiocatore] : 50;

      CONTRADE.forEach(c => {
        if(c.nome === contradaGiocatore) return;

        S.intesaContrade[c.nome] = Math.min(100, attuale + 10);
        applicaRivalitaIntesaContrada(c.nome);
      });
      S.esperienza = Math.max(1, Math.min(5, (S.esperienza||1) - 1));
      S.bravura = Math.max(1, Math.min(5, (S.bravura||1) - 1));
      S.empatia = Math.max(1, Math.min(5, (S.empatia||1) - 1));
      S.log.push(`Piazzamento al ${piazzamento||'?'}° posto al Palio di ${nomePalio} ${S.anno}: Fama −5, Intesa Contrada del ${contradaGiocatore} −10, Intesa con le altre 16 contrade +10, Esperienza −1, Bravura −1, Empatia −1.`);
    }
    if(premioOro > 0) S.log.push(`Premio piazzamento (${piazzamento}° posto): +${premioOro} oro.`);

    // Valuta l'esito dell'istruzione del capitano (se presente)
    if(typeof valutaStrategiaCapitanoFantino === 'function'){
      valutaStrategiaCapitanoFantino(tipoPalio, {
        piazzamento, nPartecipanti: classifica.length, squalificato:false, vincitrice: vincitore
      });
    }

    salvaCorrente();
    if(typeof verificaObiettivi === 'function') verificaObiettivi();
  }

  const corpoEffetti = giocatoreVince
    ? '😊 Fama +20 · 🤝 Intesa Contrada +20 · 🏆 +1 Vittoria · 🎯 Bravura +1 · 📚 Esperienza +1 · 🧠 Empatia +1'
    : suiPodio
      ? '🥈🥉 Nessun effetto su fama, intesa o statistiche — solo il premio in oro'
      : '😔 Fama −5 · 🤝 Intesa Contrada −10 · 🤝 Intesa altre contrade +10 · 🎯 Bravura −1 · 📚 Esperienza −1 · 🧠 Empatia −1';

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Palio di ${nomePalio} ${S.anno}</span>
      <span class="hdr-right" style="font-size:10px">${FASI_PALIO_FANTINO.length}/${FASI_PALIO_FANTINO.length}</span>
    </div>
    <div class="pad fade-in">
      <div style="text-align:center;margin-bottom:0;margin-top:8px">
        <div style="font-size:48px;margin-bottom:8px">🏆</div>
        <div class="screen-title">Il Vincitore</div>
        <div class="screen-sub" style="margin-bottom:0">Il drappellone va alla contrada che ha portato per prima il cavallo al traguardo.</div>
      </div>

      <div class="card" style="text-align:center;padding:20px 16px;margin-top:12px;${giocatoreVince?'border:2px solid var(--ocra);box-shadow:0 0 30px rgba(200,153,30,.25)':''}">
        <img src="img/palio/drappellone_${tipoPalio}.png" alt="Drappellone del Palio di ${nomePalio}"
             style="width:110px;height:auto;object-fit:contain;margin:0 auto ${giocatoreVince?'14':'10'}px;display:block;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.4)"
             onerror="this.style.display='none'">
        ${datiVincitore ? `<img src="${IMG_BASE}${datiVincitore.img}" alt="${vincitore}"
             style="width:72px;height:72px;object-fit:contain;border-radius:8px;background:rgba(0,0,0,.2);border:2px solid var(--ocra);margin:0 auto 12px;display:block"
             onerror="this.style.opacity='.15'">` : ''}
        <div style="font-family:var(--fs);font-size:24px;font-weight:700;color:var(--ocra);margin-bottom:6px">
          ${giocatoreVince ? '🏆 Vittoria!' : `Contrada del${/^[AEIOU]/.test(vincitore)?'l\'':' '}${vincitore}`}
        </div>
        <div style="font-family:var(--fn);font-size:12px;color:rgba(200,153,30,.55);line-height:1.7;margin-bottom:10px">

/* ═══════════════════════════════════════════════
   MINIGIOCO "MOSSA" — carriera Fantino
   Una barra orizzontale rappresenta la "mossa" del canape: una barra mobile scorre
   avanti e indietro; il giocatore deve fermarla il più vicino possibile a una barra
   fissa (l'obiettivo), che si trova al centro di una zona verde più ampia.
   - ferma sulla barra fissa            → mossa Buona (perfetta) → bonus ×1.5
   - ferma nella zona verde             → mossa Buona             → bonus ×1.25
   - ferma appena fuori dalla zona verde→ mossa Lenta             → bonus ×0.9
   - ferma molto lontano dalla zona     → mossa Pessima           → bonus ×0.75
   Mossa Buona  → Gestione Mossa +1 (fino a 5)
   Mossa Lenta/Pessima → Gestione Mossa -1 (fino a 1)
   Difficoltà (velocità della barra, ampiezza della zona verde) dipende da:
   - gestione mossa del fantino (più alta = più facile, zona più ampia, barra più lenta)
   - nervosismo del cavallo (più alto = più difficile, zona più stretta, barra più veloce)
   - amicizia media con gli altri fantini della batteria (più amici = più facile)
═══════════════════════════════════════════════ */
function calcolaDifficoltaMossa(coppieBatteria){
  // Amicizia media con gli altri fantini presenti in batteria (0–100, default 50 se sconosciuti)
  const altriFantini = coppieBatteria.filter(c=>!c.giocatore).map(c=>c.fantino.nome);
  let ammiciziaMedia = 50;
  if(altriFantini.length && S.amiciziaFantini){
    const valori = altriFantini.map(n => (S.amiciziaFantini[n] !== undefined) ? S.amiciziaFantini[n] : 50);
    ammiciziaMedia = valori.reduce((a,b)=>a+b,0) / valori.length;
  }
  const cavalloGiocatore = coppieBatteria.find(c=>c.giocatore)?.cavallo;
  const nervosismo = cavalloGiocatore ? cavalloGiocatore.nervosismo : 3;
  const gestioneMossa = S.gestioneMossa || 1;

  // Velocità della barra mobile (% della larghezza percorsa per frame, circa 60fps)
  // Base 1.4 (più rapida di prima), aumenta con nervosismo, diminuisce con gestione mossa e amicizia
  let velocita = 1.4 + nervosismo*0.16 - gestioneMossa*0.07 - (ammiciziaMedia/100)*0.2;
  velocita = Math.max(0.8, Math.min(2.6, velocita));

  // Ampiezza della zona verde (in % della barra, centrata sull'obiettivo)
  // Base 9 (più stretta di prima), aumenta con gestione mossa e amicizia, diminuisce con nervosismo
  let ampiezzaZona = 9 + gestioneMossa*1.5 + (ammiciziaMedia/100)*5 - nervosismo*1.8;
  ampiezzaZona = Math.max(3.5, Math.min(20, ampiezzaZona));

  return { velocita, ampiezzaZona };
}

function avviaMinigiocoMossa(contesto){
  if(!S || !S.corsaProvinciaMese) return;
  const corsa = S.corsaProvinciaMese;
  const coppieBatteria = contesto.contesto === 'finale'
    ? corsa.finale.coppie
    : corsa.batterie[contesto.indiceBatteria].coppie;

  const { velocita, ampiezzaZona } = calcolaDifficoltaMossa(coppieBatteria);
  // L'obiettivo (barra fissa) è sempre al centro della zona verde
  const centroObiettivo = 50;

  window._mossaState = {
    contesto: contesto.contesto,
    indiceBatteria: contesto.indiceBatteria,
    velocita,
    ampiezzaZona,
    centroObiettivo,
    posizione: 0,
    direzione: 1,
    fermata: false,
    timerId: null
  };
  renderMinigiocoMossa();
  avviaTickMossa();
}

function avviaTickMossa(){
  const st = window._mossaState;
  if(!st || st.fermata) return;
  st.timerId = setInterval(()=>{
    if(!window._mossaState || window._mossaState.fermata){ clearInterval(st.timerId); return; }
    st.posizione += st.direzione * st.velocita;
    if(st.posizione >= 100){ st.posizione = 100; st.direzione = -1; }
    if(st.posizione <= 0){ st.posizione = 0; st.direzione = 1; }
    aggiornaBarraMossa();
  }, 16);
}

function renderMinigiocoMossa(){
  if(!S || !window._mossaState) return;
  const st = window._mossaState;
  const inizioZona = Math.max(0, st.centroObiettivo - st.ampiezzaZona/2);
  const fineZona = Math.min(100, st.centroObiettivo + st.ampiezzaZona/2);

  setMain(`
  <div>
    <div class="hdr">
      <span class="hdr-title">Minigioco · La Mossa</span>
      <span class="hdr-right"></span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🎯 Ferma la barra!</div>
      <div class="screen-sub">Tocca per fermare la barra mobile il più vicino possibile all'obiettivo.</div>
      <div class="card" style="padding:24px 16px">
        <div id="MOSSA_TRACK" style="position:relative;width:100%;height:34px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(200,153,30,.2);overflow:hidden">
          <div style="position:absolute;top:0;bottom:0;left:${inizioZona}%;width:${fineZona-inizioZona}%;background:rgba(46,160,90,.28)"></div>
          <div style="position:absolute;top:0;bottom:0;left:${st.centroObiettivo}%;width:2px;background:var(--ocra)"></div>
          <div id="MOSSA_CURSORE" style="position:absolute;top:-3px;bottom:-3px;left:${st.posizione}%;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.6)"></div>
        </div>
        <button class="btn gold w" style="margin-top:18px" onclick="fermaMinigiocoMossa()">⏹ Ferma!</button>
      </div>
    </div>
  </div>
  `);
}

/* Aggiorna solo la posizione del cursore via DOM, senza ridisegnare l'intera schermata
   (per evitare flicker durante l'animazione a 60fps). */
function aggiornaBarraMossa(){
  const cursore = R('MOSSA_CURSORE');
  if(cursore && window._mossaState) cursore.style.left = window._mossaState.posizione + '%';
}

function fermaMinigiocoMossa(){
  if(!S || !window._mossaState || window._mossaState.fermata) return;
  const st = window._mossaState;
  st.fermata = true;
  if(st.timerId) clearInterval(st.timerId);

  const distanzaCentro = Math.abs(st.posizione - st.centroObiettivo);
  const inizioZona = Math.max(0, st.centroObiettivo - st.ampiezzaZona/2);
  const fineZona = Math.min(100, st.centroObiettivo + st.ampiezzaZona/2);
  const dentroZona = (st.posizione >= inizioZona && st.posizione <= fineZona);

  let esito, bonus, deltaGestioneMossa;
  if(distanzaCentro <= 1.5){
    esito = 'perfetta'; bonus = MOSSA_BONUS_PERFETTA; deltaGestioneMossa = 1;
  } else if(dentroZona){
    esito = 'buona'; bonus = MOSSA_BONUS_BUONA; deltaGestioneMossa = 1;
  } else if(distanzaCentro <= st.ampiezzaZona){
    esito = 'lenta'; bonus = MOSSA_BONUS_LENTA; deltaGestioneMossa = -1;
  } else {
    esito = 'pessima'; bonus = MOSSA_BONUS_PESSIMA; deltaGestioneMossa = -1;
  }

  S.gestioneMossa = Math.max(1, Math.min(5, S.gestioneMossa + deltaGestioneMossa));
  S.log.push(`Minigioco Mossa: esito ${esito} (bonus velocità ×${bonus}). Gestione Mossa ${deltaGestioneMossa>0?'+1':'-1'} (ora ${S.gestioneMossa}).`);
  st.esito = esito;
  salvaCorrente();

  const etichette = {
    perfetta: { icona:'🎯', titolo:'Mossa Perfetta!', colore:'var(--verde)', testo:'Hai fermato la barra esattamente sull\'obiettivo!' },
    buona:    { icona:'✅', titolo:'Mossa Buona', colore:'var(--verde)', testo:'Ottimo tempismo: ti sei fermato nella zona verde.' },
    lenta:    { icona:'🐢', titolo:'Mossa Lenta', colore:'var(--ocra)', testo:'Partenza un po\' lenta: hai mancato la zona verde.' },
    pessima:  { icona:'😬', titolo:'Mossa Pessima', colore:'var(--ross)', testo:'Partenza decisamente sbagliata: lontanissimo dall\'obiettivo.' }
  };
  const e = etichette[esito];

  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">${e.icona}</div>
    <div class="popup-title">${e.titolo}</div>
    <div class="popup-body">${e.testo}<br><br>Bonus velocità: <strong style="color:${e.colore}">×${bonus}</strong><br>Gestione Mossa: <strong style="color:${e.colore}">${deltaGestioneMossa>0?'+1':'-1'}</strong> (ora ${S.gestioneMossa})</div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove();concludiMinigiocoMossa(${bonus})">Via!</button>
  </div>`;
  R('APP').appendChild(ov);
}

function concludiMinigiocoMossa(bonus){
  const st = window._mossaState;
  if(!st) return;
  const contesto = st.contesto;

  if(contesto === 'trattaPalio'){
    const tipoPalio = st.tipoPalio, garaIdx = st.garaIdx;
    window._mossaState = null;
    disputaMiniGaraTrattaFantino(tipoPalio, garaIdx, bonus);
    return;
  }

  if(contesto === 'corsaFantino'){
    const tipoPalio = st.tipoPalio, esito = st.esito;
    window._mossaState = null;
    concludiMossaCorsaFantino(tipoPalio, bonus, esito);
    return;
  }

  const indiceBatteria = st.indiceBatteria;
  window._mossaState = null;

  if(contesto === 'finale'){
    disputaFinaleFantino(bonus);
  } else {
    disputaBatteriaFantino(indiceBatteria, bonus);
  }
}

  `)}

  ${tutAcc('🐎','La vita da Fantino, mese per mese',`
    <p>Come il Capitano, avanzi il tempo con <b>"Avanza al mese successivo"</b> e ricevi ogni volta il <b>Giornale di Siena</b> con le notizie (e gli imprevisti) del mese. Hai quattro strumenti per costruire la tua carriera:</p>
    <p><b>🏛️ Rapporti con le Contrade</b> — la tua <b>intesa</b> con ciascuna delle 17 contrade: più è alta, più probabilità hai di essere notato e ingaggiato. Puoi coltivarla anche con il minigioco <b>"Incontra"</b> (una sfida a Forza 4 contro un rappresentante di contrada).</p>
    <p><b>🐎 Stalla</b> — i cavalli che possiedi o su cui puoi allenarti: qui gestisci il loro allenamento mensile e la loro stanchezza in vista delle corse.</p>
    <p><b>🤝 Fantini</b> — i colleghi rivali: puoi coltivare amicizie utili per gli accordi tra fantini durante il Palio.</p>
    <p><b>🏇 Corse in Provincia</b> — palii minori dove correre, farti notare dalle contrade e guadagnare qualcosa prima della Tratta di Luglio e Agosto.</p>
    <p><b>🎯 Obiettivi</b> — traguardi come il tuo esordio in un Palio, la prima vittoria in provincia, l'acquisto di un cavallo o la vittoria con una specifica Contrada: ognuno dà <b>+5 Fama</b> una sola volta.</p>
  `)}

  ${tutAcc('🏇','I giorni del Palio, dal punto di vista del Fantino',`
    <p>Quando scatta il Palio di Luglio o Agosto, il tuo destino si gioca in <b>11 fasi</b>, diverse da quelle del Capitano perché tu non hai ancora una Contrada:</p>
    ${tutFase(1,'🎲','La Tratta','I cavalli con almeno due corse in provincia vengono divisi in batterie e abbinati a sorte ai fantini: qui scopri con quale cavallo ti presenti al Palio.')}
    ${tutFase(2,'📜','Presentazione del Lotto','Il Comune presenta ufficialmente i dieci cavalli scelti per la Carriera.')}
    ${tutFase(3,'✅','Assegnazione Cavalli','I cavalli del lotto vengono abbinati a sorte alle dieci contrade partecipanti.')}
    ${tutFase(4,'💰','Offerte delle Contrade','Se non hai ancora un ingaggio, le contrade rimaste senza fantino si fanno avanti con proposte: a te la scelta di quale accettare.')}
    ${tutFase(5,'🗺️','Accordi con le Contrade','Trattative segrete con le altre contrade per favorire il tuo passaggio in Piazza.')}
    ${tutFase(6,'🤝','Accordi tra Fantini','Patti e promesse scambiati con i colleghi delle altre contrade, basati sull\'amicizia costruita durante l\'anno.')}
    ${tutFase(7,'⚔️','Istruzioni del Capitano','Il capitano della Contrada che monti ti dà le ultime indicazioni tattiche: sta a te seguirle o meno.')}
    ${tutFase(8,'🎯','Estrazione al Canapo','Il sorteggio stabilisce la tua posizione di partenza alla mossa.')}
    ${tutFase(9,'🚩','La Mossa','Il momento della partenza vera e propria: un minigioco di tempismo decide come parti.')}
    ${tutFase(10,'🏆','Il Palio e il Vincitore','Tre giri di Piazza del Campo in sella: il drappellone va a chi porta per primo il cavallo al traguardo.')}
    <div class="tut-note">💡 Empatia e intesa costruite durante l'anno tornano utili proprio nelle fasi di Offerte e Accordi: un fantino con buoni rapporti arriva al Palio con più opzioni sul tavolo.</div>
  `)}

  ${tutAcc('🚩','Il minigioco della Mossa',`
    <p>Alla partenza compare una barra che si muove: devi fermarla al momento giusto premendo il tasto. Il tempismo determina l'esito — da <b>Mossa Perfetta</b> a <b>Mossa Pessima</b> — che assegna un bonus di velocità per la corsa e influenza la tua statistica di <b>Gestione Mossa</b>.</p>
    <p>Più la tua Gestione Mossa è alta, più sarà facile ripetere buone partenze nel tempo.</p>
  `)}

  ${tutAcc('🕯️','Consigli del vecchio fantino',`
    <ul>
      <li>Corri più corse in provincia che puoi: fanno guadagnare, fanno crescere il tuo nome e preparano i cavalli alla Tratta.</li>
      <li>Coltiva l'intesa con più di una Contrada: se non arriva un'offerta dalla tua preferita, un'altra buona alternativa ti eviterà di restare a piedi.</li>
      <li>Le amicizie tra fantini non sono solo di facciata: tornano utili proprio negli Accordi tra Fantini nei giorni del Palio.</li>
      <li>Allenati con calma nella Mossa: la statistica di Gestione Mossa migliora con le buone partenze ripetute nel tempo.</li>
    </ul>
  `)}
  `;

  setMain(`
  <div>
    <div class="hdr">
      <button class="hdr-back" onclick="renderHome()">‹</button>
      <span class="hdr-title">Tutorial Fantino</span>
      <span class="hdr-right"></span>
    </div>
    <div class="pad fade-in">
      <div class="screen-title" style="margin-top:8px">🏇 Tutorial Fantino</div>
      <div class="screen-sub">Come correre, farsi notare e vincere il Drappellone</div>
      ${corpo}
      <button class="btn gold w" onclick="renderHome()">← Torna alla Home</button>
    </div>
  </div>
  `);
}

function mostraPopupErrore(titolo, testo){
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">⚠️</div>
    <div class="popup-title">${titolo}</div>
    <div class="popup-body">${testo}</div>
    <button class="btn gold w" onclick="this.closest('.overlay').remove()">Capito</button>
  </div>`;
  R('APP').appendChild(ov);
}

function confermaEsciHome(){
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
  <div class="popup">
    <div class="popup-icon">🏠</div>
    <div class="popup-title">Torna alla Home?</div>
    <div class="popup-body">La partita è salvata automaticamente. Potrai riprenderla dalla schermata principale.</div>
    <div style="display:flex;gap:8px">
      <button class="btn w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove()">Resta</button>
      <button class="btn gold w" style="flex:1;margin-top:0" onclick="this.closest('.overlay').remove();S=null;_slotCorrente=null;renderHome()">Esci</button>
    </div>
  </div>`;
  R('APP').appendChild(ov);
}
